# Cargo aliases cannot shell out to a build-then-exec wrapper, so each one runs
# the checkout's own `effigy-qa` shim, which routes the requested task through
# `scripts/effigy-selfbuild.sh` (Oxide build, `target/debug/effigy`, never a
# nested `oxide run`). Only that std-only shim binary compiles with plain Cargo.
# `cargo run --bin effigy -- <selector>` remains the plain-Cargo escape, and
# `EFFIGY_OXIDE_ESCAPE=cargo` keeps the whole alias path on Cargo.
[alias]
qa = "run --bin effigy-qa --"
qa-docs = "run --bin effigy-qa -- --docs-only"
qa-json = "run --bin effigy-qa -- --json-only"
qa-json-ci = "run --bin effigy-qa -- --json-only --ci"
qa-release = "run --bin effigy-qa -- --release-gates"
prepush-ci = "run --bin effigy-qa -- --prepush"
