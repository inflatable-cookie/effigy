[tasks."workspace:linux:artifact"]
run = [{ rhai = "scripts/build.rhai" }]
[containers."linux-release"]
driver = "colima"
startup = "detached"
profile = "effigy-release"
# Stable private builder protocol identity; upgrades reuse this project.
# Legacy effigy-linux-release resources are retained and never adopted.
project_name = "effigy-artifact-builder-v1"
primary_service = "builder"

[containers."linux-release".services.builder]
catalog = "linux-release-builder"

[containers."linux-release".lifecycle]
on_task_exit = "stop"
shutdown = "graceful"
detach_timeout_secs = 10

[containers."linux-release".host]
mounts = ["./:/workspace"]

