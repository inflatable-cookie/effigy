[package]
name = "effigy-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Runtime session and orchestration helpers for Effigy"

[dependencies]
anstyle = "1"
effigy-catalog = { path = "../effigy-catalog" }
effigy-containers = { path = "../effigy-containers" }
effigy-core = { path = "../effigy-core" }
effigy-execution = { path = "../effigy-execution" }
effigy-gateway = { path = "../effigy-gateway" }
effigy-manifest = { path = "../effigy-manifest" }
effigy-process = { path = "../effigy-process" }
effigy-tui = { path = "../effigy-tui" }
effigy-ui = { path = "../effigy-ui" }
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
signal-hook = "0.4"

[dev-dependencies]
tempfile = "3"
