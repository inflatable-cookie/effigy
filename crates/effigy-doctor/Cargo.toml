[package]
name = "effigy-doctor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Doctor policy contracts, report model, and runner orchestration for Effigy"

[dependencies]
effigy-cli = { path = "../effigy-cli" }
effigy-codegraph = { path = "../effigy-codegraph" }
effigy-core = { path = "../effigy-core" }
effigy-deps = { path = "../effigy-deps" }
effigy-manifest = { path = "../effigy-manifest" }
effigy-routing = { path = "../effigy-routing" }
effigy-scan = { path = "../effigy-scan" }
effigy-tasks = { path = "../effigy-tasks" }
effigy-ui = { path = "../effigy-ui" }
anstream = "1"
globset = "0.4"
jsonc-parser = "0.34.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1"

[lints]
workspace = true
