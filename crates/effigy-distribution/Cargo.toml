[package]
name = "effigy-distribution"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Distribution policy contracts for Effigy"

[dependencies]
effigy-manifest = { path = "../effigy-manifest" }
effigy-ui = { path = "../effigy-ui" }
anstyle = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
serde_json = "1"
toml = "1"
