[package]
name = "effigy-deps"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Machine-local dependency link models and state stores for Effigy"

[dependencies]
fs2 = "0.4"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
