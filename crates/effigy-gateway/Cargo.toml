[package]
name = "effigy-gateway"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "DNS resolver and reverse proxy gateway for Effigy local development"

[dependencies]
# DNS resolution
hickory-server = "0.25"
hickory-proto = "0.25"

# HTTP reverse proxy
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "server", "client-legacy"] }
http-body-util = "0.1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# TLS
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"

# Route table and config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"

# System
libc = "0.2"

# Utilities
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1"
