[package]
name = "effigy-release"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Release configuration and gate execution contracts for Effigy"

[dependencies]
effigy-changelog = { path = "../effigy-changelog" }
effigy-manifest = { path = "../effigy-manifest" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25.11"
