[package]
name = "effigy-release"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Release configuration and gate execution contracts for Effigy"

[dependencies]
effigy-changelog = { path = "../effigy-changelog" }
effigy-core = { path = "../effigy-core" }
effigy-kernel = { path = "../effigy-kernel" }
effigy-manifest = { path = "../effigy-manifest" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.4"
globset = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"
toml_edit = "0.25.11"

[dev-dependencies]
effigy-test-support = { path = "../effigy-test-support" }
effigy-json-schema = { path = "../effigy-json-schema" }
tempfile = "3"

[lints]
workspace = true
