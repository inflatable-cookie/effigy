[package]
name = "effigy-managed"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Managed task orchestration for Effigy (scheduler, run-spec, runtime)"

[dependencies]
effigy-core = { path = "../effigy-core" }
effigy-env = { path = "../effigy-env" }
effigy-manifest = { path = "../effigy-manifest" }
effigy-process = { path = "../effigy-process" }
effigy-tasks = { path = "../effigy-tasks" }
effigy-tui = { path = "../effigy-tui" }
effigy-ui = { path = "../effigy-ui" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.4"

[lints]
workspace = true
