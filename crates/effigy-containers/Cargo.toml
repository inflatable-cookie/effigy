[package]
name = "effigy-containers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Container policy contracts for Effigy"

[features]
test-support = ["dep:tempfile"]
# Engine proofs at kernel crossings; absent from ordinary builds.
fault-injection = ["effigy-kernel/fault-injection"]

[dependencies]
effigy-kernel = { path = "../effigy-kernel" }
tempfile = { version = "3", optional = true }
effigy-catalog = { path = "../effigy-catalog" }
effigy-core = { path = "../effigy-core" }
effigy-gateway = { path = "../effigy-gateway" }
# Step progress and human errors: container waits report through the one API.
effigy-ui = { path = "../effigy-ui" }
effigy-manifest = { path = "../effigy-manifest" }
# A container's own `Created` stamp is RFC 3339; a creation window compares it
# with the apply start it recorded (effigy#508).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
nix = { version = "0.31", default-features = false, features = ["process", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
siphasher = "1"
toml = "1"
toml_edit = "0.25.11"

[dev-dependencies]
effigy-test-support = { path = "../effigy-test-support" }
tempfile = "3"

[lints]
workspace = true
