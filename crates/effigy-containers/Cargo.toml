[package]
name = "effigy-containers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Container policy contracts for Effigy"

[dependencies]
effigy-catalog = { path = "../effigy-catalog" }
effigy-container-manager = { path = "../effigy-container-manager" }
effigy-core = { path = "../effigy-core" }
effigy-gateway = { path = "../effigy-gateway" }
effigy-manifest = { path = "../effigy-manifest" }
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1"

[dev-dependencies]
tempfile = "3"
