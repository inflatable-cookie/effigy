[package]
name = "effigy-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Shared core contracts for Effigy runtime and domain crates"

[dependencies]
ratatui-core = { version = "0.1.2", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.11"
toml = "1"

[dev-dependencies]
effigy-test-support = { path = "../effigy-test-support" }
tempfile = "3"

[lints]
workspace = true
