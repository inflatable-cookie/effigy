[package]
name = "effigy-rhai"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Rhai runtime and host API contracts for Effigy"

[dependencies]
effigy-core = { path = "../effigy-core" }
effigy-context = { path = "../effigy-context" }
effigy-env = { path = "../effigy-env" }
effigy-execution = { path = "../effigy-execution" }
effigy-ui = { path = "../effigy-ui" }
anstyle = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
portable-pty = "0.9"
ring = "0.17"
rhai = { version = "1", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
regex = "1"
serde_json = "1"
signal-hook = "0.4"
toml = "1"
walkdir = "2"
