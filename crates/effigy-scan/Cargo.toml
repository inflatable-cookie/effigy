[package]
name = "effigy-scan"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Workspace scan engine for Effigy (options, execution, render)"

[dependencies]
effigy-manifest = { path = "../effigy-manifest" }
effigy-tasks = { path = "../effigy-tasks" }
anstyle = "1"
globset = "0.4"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
