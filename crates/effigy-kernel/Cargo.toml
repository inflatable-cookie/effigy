[package]
name = "effigy-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Synchronous runtime foundation for Effigy engines"

[features]
# Injection hooks are absent from ordinary builds; no production default.
fault-injection = []
# Native Child adapters for repository fixture harnesses only.
test-support = []

[dependencies]
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
unicode-normalization = "0.1"

[dev-dependencies]
effigy-test-support = { path = "../effigy-test-support" }
# Interpreter conformance only: product engines still own script integration.
rhai = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = "1"
tempfile = "3"

[lints]
workspace = true

[[example]]
name = "kernel-ratchet"
path = "examples/kernel-ratchet.rs"

# Disposable same-binary re-exec harness, never part of a product install.
[[bin]]
name = "kernel-custody-fixture"
path = "tests/support/custody-fixture.rs"
required-features = ["fault-injection"]
test = false
bench = false

[[test]]
name = "custody"
required-features = ["fault-injection"]

[[test]]
name = "probe"
required-features = ["fault-injection"]
