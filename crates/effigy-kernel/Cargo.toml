[package]
name = "effigy-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Synchronous runtime foundation for Effigy engines"

[features]
# Injection hooks are absent from ordinary builds; no production default.
fault-injection = []

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
unicode-normalization = "0.1"

[dev-dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = "1"
tempfile = "3"

[lints]
workspace = true

[[example]]
name = "kernel-ratchet"
path = "examples/kernel-ratchet.rs"
