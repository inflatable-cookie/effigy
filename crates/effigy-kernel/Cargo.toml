[package]
name = "effigy-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Synchronous runtime foundation for Effigy engines"

[features]
# Qualification candidate only; never enabled by product defaults.
workspace-private-qualification = []
# Injection hooks are absent from ordinary builds; no production default.
fault-injection = []
# Disposable-fixture support for process-lifetime proofs: one transaction that
# records an environment's own active publication without a container
# activation. Absent from every product build.
test-support = []
# Read-only task-signal qualification utility; never in a product build.
qualification-observer = []

[dependencies]
effigy-core = { path = "../effigy-core" }
effigy-ui = { path = "../effigy-ui" }
libc = "0.2"
nix = { version = "0.31", default-features = false, features = ["fs", "socket", "uio"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
unicode-normalization = "0.1"

[dev-dependencies]
effigy-test-support = { path = "../effigy-test-support" }
# Interpreter conformance only: product engines still own script integration.
rhai = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = "1"
tempfile = "3"

[lints]
workspace = true

[[example]]
name = "kernel-ratchet"
path = "examples/kernel-ratchet.rs"

[[example]]
name = "signal-registration-observer"
path = "examples/signal-registration-observer.rs"
required-features = ["qualification-observer"]

# Disposable same-binary re-exec harness, never part of a product install.
# Built without a feature gate: `fault_point!` is inert outside a test build, so
# the helper behaviour ordinary runs need is identical with or without
# `fault-injection`, and proofs that run under a plain test runner (built-in
# `effigy test` included) must be able to prepare it. `tests/fixture_binary.rs`
# is the preparation proof that makes an ordinary workspace run build it.
[[bin]]
name = "kernel-custody-fixture"
path = "tests/support/custody-fixture.rs"
test = false
bench = false

[[test]]
name = "custody"
required-features = ["fault-injection"]

[[test]]
name = "probe"
required-features = ["fault-injection"]
