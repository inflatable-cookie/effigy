[package]
name = "effigy-codegraph"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Native graph storage and JSON contracts for Effigy code intelligence"

[dependencies]
aho-corasick = "1"
effigy-manifest = { path = "../effigy-manifest" }
ignore = "0.4"
notify = "8"
pulldown-cmark = "0.13"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.11"
toml = "1"
tree-sitter = "0.26.8"
tree-sitter-javascript = "0.25.0"
tree-sitter-language = "0.1.5"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
