[package]
name = "effigy-manifest"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Shared manifest contracts and composition for Effigy"

[dependencies]
effigy-core = { path = "../effigy-core" }
effigy-kernel = { path = "../effigy-kernel" }
getrandom = "0.4"
libc = "0.2"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
indexmap = { version = "2", features = ["serde"] }
minijinja = "2"
serde = { version = "1", features = ["derive"] }
semver = "1"
sha2 = "0.11"
toml = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
effigy-test-support = { path = "../effigy-test-support" }
tempfile = "3"

[lints]
workspace = true
