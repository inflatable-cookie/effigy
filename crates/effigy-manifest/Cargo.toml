[package]
name = "effigy-manifest"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Shared manifest contracts and composition for Effigy"

[dependencies]
effigy-artifacts = { path = "../effigy-artifacts" }
effigy-core = { path = "../effigy-core" }
indexmap = { version = "2", features = ["serde"] }
minijinja = "2"
serde = { version = "1", features = ["derive"] }
semver = "1"
sha2 = "0.11"
toml = "1"

[dev-dependencies]
tempfile = "3"
