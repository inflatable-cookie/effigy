[bundle]
name = "decodelabs"
description = "DecodeLabs legacy PHP stack with nginx, php-fpm, MariaDB, phpMyAdmin, Mailpit, Redis, Memcached, a dev workspace, and local gateway routes."
defaults = "export.toml"

[[inputs]]
name = "host"
type = "string"
required = true
description = "Primary local hostname for the app route; phpMyAdmin is published at `pma.<host>` and Mailpit at `mailpit.<host>`."
example = "contact-patch.legacy.test"

[[inputs]]
name = "project_name"
type = "string"
description = "Compose project name used for the generated container environment. Defaults to `<host-label>-decodelabs`."
example = "contactpatch-decodelabs"

[[inputs]]
name = "databases"
type = "list"
required = true
description = "MariaDB databases to create for the stack. The first entry becomes the primary app database."
example = ["contactpatch", "contactpatch_test"]

[[inputs]]
name = "system_name"
type = "string"
description = "Name of the `[systems.<name>]` block rendered by the bundle."
default = "dev"

[[inputs]]
name = "container_name"
type = "string"
description = "Name of the `[containers.<name>]` block that hosts the stack (also used as the default container)."
default = "web"

[[inputs]]
name = "workspace_service_name"
type = "string"
description = "Name of the php-fpm workspace service inside the container (also wired as the `php` alias target and the `composer` service)."
default = "app"

[[inputs]]
name = "default_workspace"
type = "string"
description = "Name of the `[systems.<system>.workspaces.<name>]` workspace treated as the system default."
default = "app"

[[inputs]]
name = "zest_port"
type = "integer"
description = "Optional port to publish and route to the temporary Zest/Vite dev server that runs inside the PHP workspace container."
example = 8938

[[inputs]]
name = "zest_domain"
type = "string"
description = "Optional hostname for the temporary Zest/Vite dev server route. Defaults to `zest.<host>` when `zest_port` is set."
example = "zest.gideon.legacy.test"
