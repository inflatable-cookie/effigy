[containers]
default = "{{ inputs.container_name }}"

{% set resolved_project_name = inputs.project_name or bundle_host_label(inputs.host) ~ "-" ~ bundle.name %}

[containers.{{ inputs.container_name }}]
driver = "colima"
startup = "detached"
project_name = "{{ resolved_project_name }}"
primary_service = "{{ inputs.workspace_service_name }}"
working_dir = "/var/www/{{ bundle_host_label(inputs.host) }}"

[containers.{{ inputs.container_name }}.lifecycle]
on_task_exit = "stop"
shutdown = "graceful"

[containers.{{ inputs.container_name }}.dns]
routes = [
  { domain = "{{ inputs.host }}", tls = true, service = "web" },
  { domain = "pma.{{ inputs.host }}", tls = true, service = "pma" },
  { domain = "mailpit.{{ inputs.host }}", tls = true, port = 8025, service = "mailpit" },
{% if inputs.zest_port %}
  { domain = "{{ inputs.zest_domain or "zest." ~ inputs.host }}", tls = true, port = {{ bundle_validated_port(inputs.zest_port, "zest_port") }}, service = "{{ inputs.workspace_service_name }}" },
{% endif %}
]

[containers.{{ inputs.container_name }}.aliases]
php = "{{ inputs.workspace_service_name }}"
composer = { service = "{{ inputs.workspace_service_name }}", command = "composer" }
mysql = { service = "mysql", command = "mysql -uroot{% raw %}{% if services.mysql.params.password %} -p{{ services.mysql.params.password }}{% endif %}{% endraw %} {{ inputs.databases|first }}" }

[containers.{{ inputs.container_name }}.services.{{ inputs.workspace_service_name }}]
catalog = "php-fpm"
version = "8.4"
document_root = "."
isolated_dirs = ["vendor", "node_modules"]
{% if inputs.zest_port %}
host_ports = ["{{ bundle_validated_port(inputs.zest_port, "zest_port") }}:{{ bundle_validated_port(inputs.zest_port, "zest_port") }}"]
{% else %}
host_ports = []
{% endif %}
mount_host_ssh_dir = true
node_version = "24"
node_global_packages = ["eclint"]
composer_global_packages = ["decodelabs/effigy"]
extensions = [
  "bcmath",
  "apcu",
  "bz2",
  "calendar",
  "curl",
  "gmp",
  "imagick",
  "mbstring",
  "pcntl",
  "exif",
  "gd",
  "intl",
  "memcached",
  "mysqli",
  "opcache",
  "pdo_mysql",
  "readline",
  "redis",
  "sockets",
  "sqlite3",
  "xml",
  "zip",
  "event",
]

[containers.{{ inputs.container_name }}.services.web]
catalog = "nginx"
variant = "decodelabs"
document_root = "."

[containers.{{ inputs.container_name }}.services.mysql]
catalog = "mariadb"
version = "10.11"
database = "{{ inputs.databases|first }}"
databases = [{% for database in inputs.databases %}"{{ database }}"{% if not loop.last %}, {% endif %}{% endfor %}]

[containers.{{ inputs.container_name }}.services.pma]
catalog = "phpmyadmin"
version = "latest"
database_host = "mysql"

[containers.{{ inputs.container_name }}.services.mailpit]
catalog = "mailpit"
version = "latest"

[containers.{{ inputs.container_name }}.services.memcached]
catalog = "memcached"
memory = 128

[containers.{{ inputs.container_name }}.services.redis]
catalog = "redis"
version = "7"

[systems]
default = "{{ inputs.system_name }}"

[systems.{{ inputs.system_name }}]
default_workspace = "{{ inputs.default_workspace }}"

[systems.{{ inputs.system_name }}.workspaces.{{ inputs.default_workspace }}]
container = "{{ inputs.container_name }}"

[bootstrap]
run = [{ rhai = "{{ bundle.root }}/scripts/write-env-if-present.rhai" }]
start = "dev"

[tasks.dev]
workspace = "{{ inputs.default_workspace }}"
[tasks.seed]
run_in = "host"
run = "effigy container data seed"

[tasks.release]
run = { task = "defer release" }

[defer]
run = "\"${COMPOSER_HOME:-$HOME/.config/composer}/vendor/bin/effigy\" {request} {args}"
run_in = "container"
