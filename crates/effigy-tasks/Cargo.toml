[package]
name = "effigy-tasks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Task-domain contracts and parsing helpers for Effigy"

[dependencies]
anstyle = "1"
effigy-core = { path = "../effigy-core" }
effigy-manifest = { path = "../effigy-manifest" }
effigy-routing = { path = "../effigy-routing" }
effigy-ui = { path = "../effigy-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
