[package]
name = "effigy-test-support"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Owned temporary fixtures for Effigy tests"

[dependencies]
effigy-kernel = { path = "../effigy-kernel", features = ["test-support"] }
libc = "0.2"
serde_json = "1"
tempfile = "3"

[lints]
workspace = true

[[bin]]
name = "effigy-fixture-process"
path = "tests/fixtures/process.rs"
test = false
bench = false
