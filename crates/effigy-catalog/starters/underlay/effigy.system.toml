# Underlay starter — system + container wiring.
#
# Declares one workspace-oriented system (`dev`) bound to a single
# container (`stack`). The container's services are generated from
# Effigy's bundled catalog — no `compose_file`, no repo-local
# `docker-compose.yml`, no repo-local `workspace.Dockerfile`.
#
# Edit points:
#   - `systems.dev.working_dir`: align with the repo's position inside
#     the workspace root. Typical shape: `/workspace-root/<repo-name>`.
#   - `systems.dev.mounts`: sibling checkouts that must be visible
#     alongside this repo (e.g. shared libraries checked out next to it).
#   - `containers.stack.services.workspace.host_ports`: host-side ports
#     for repo-owned dev servers. Keep these aligned with the ports your
#     apps expose via `tasks.<app>/dev`.
#   - `containers.stack.dns.routes`: the domains the gateway should
#     publish. Port values must match `host_ports` above.

[systems]
default = "dev"

[systems.dev]
container = "stack"
default_workspace = "app"
working_dir = "/workspace-root/underlay-app"
user = "dev"
home = "/home/dev"
# Sibling checkouts that need to be visible next to this repo.
# Remove or adjust as needed.
mounts = []

[systems.dev.workspaces.app]
# `app` is the default workspace. Per-workspace overrides can go here if
# the repo ever grows a second workspace; otherwise the `systems.dev`
# defaults above apply.

[containers.stack]
startup = "detached"
context = "dev"
project_name = "underlay-app-dev"
primary_service = "workspace"

[containers.stack.aliases]
psql = "postgres"

[containers.stack.health]
check = "tcp://127.0.0.1:5432"
timeout_secs = 90

[containers.stack.services.workspace]
catalog = "workspace-rust-bun"
working_subdir = "underlay-app"
# Host port bindings for repo-owned dev servers. Keep in sync with the
# gateway DNS routes below and with each app's `tasks.<app>/dev` PORT.
host_ports = [
  "41001:41001",  # api
  "41002:41002",  # admin
  "41003:41003",  # front
]

[containers.stack.services.postgres]
catalog = "postgres"
database = "acme"
password = "postgres"

[containers.stack.services.mailpit]
catalog = "mailpit"

[containers.stack.services.minio]
catalog = "minio"

[containers.stack.dns]
routes = [
  { domain = "app.test", tls = true, port = 41003, service = "workspace" },
  { domain = "admin.app.test", tls = true, port = 41002, service = "workspace" },
  { domain = "api.app.test", tls = true, port = 41001, service = "workspace" },
  { domain = "mailpit.app.test", port = 8025, service = "mailpit" },
  { domain = "minio.app.test", port = 9001, service = "minio" },
]
