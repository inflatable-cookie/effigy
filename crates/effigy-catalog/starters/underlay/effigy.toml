# Underlay starter — root manifest.
#
# This file is the root `effigy.toml` for an Underlay-style consumer repo.
# It keeps the repo-owned glue small by pulling the stable system/container
# shape from Effigy's shipped `underlay` bundle, then layering bootstrap and
# task orchestration through `[manifest].include`.
#
# Edit points for a new consumer repo:
#   - update `[bundle]` inputs for your domains, project name, repo path, and database
#   - optionally override `system_name`, `container_name`, `workspace_service_name`,
#     and `default_workspace` on `[bundle]` if the defaults (`dev`/`stack`/`workspace`/`app`)
#     don't fit (remember to update `effigy.tasks.toml` + `systems.<name>` overrides to match)
#   - add `systems.dev.mounts` when sibling checkouts must be visible in the workspace
#   - retitle/replace the per-app dev tabs in `effigy.tasks.toml`
#   - repoint the bootstrap deps command in `effigy.bootstrap.toml`
#
# Everything else (workspace service, postgres/mailpit/minio, gateway
# routes, alias publication) comes from Effigy's bundled defaults.

[catalog]
alias = "underlay-app"

[bundle]
base = "underlay"
host = "app.test"
project_name = "underlay-app-dev"
workspace_subdir = "underlay-app"
database = "acme"

[systems.dev]
mounts = []

[manifest]
include = [
  "effigy.bootstrap.toml",
  "effigy.tasks.toml",
]
