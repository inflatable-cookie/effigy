[manifest]
minimum_effigy_version = "0.7.0"

[catalog]
alias = "underlay-app"

[bundle]
base = { type = "path", dir = "bundles/underlay" }
host = "app.test"
project_name = "underlay-app-dev"
workspace_subdir = "underlay-app"
databases = ["acme"]

[bundle.dirs]
docs = "app-docs"
api = "app-api"
client = "app-client"
ui = "app-ui"
front = "app-front"
admin = "app-admin"

[systems.dev]
mounts = []
