# Underlay starter — root manifest.
#
# This file is the root `effigy.toml` for an Underlay-style consumer repo.
# It composes the reusable shape via `[manifest].include` so the
# repo-local glue stays small: system/container wiring, managed `dev`
# orchestration, and optional bootstrap helpers are each carried in their
# own fragment file.
#
# Edit points for a new consumer repo:
#   - rename/adjust `systems.dev` + `containers.stack` in `effigy.system.toml`
#   - retitle/replace the per-app dev tabs in `effigy.tasks.toml`
#   - repoint the bootstrap deps command in `effigy.bootstrap.toml`
#
# Everything else (image build, cargo/bun toolchain, service assembly)
# comes from Effigy's bundled catalog.

[catalog]
alias = "underlay-app"

[package_manager]
js = "bun"

[manifest]
include = [
  "effigy.system.toml",
  "effigy.bootstrap.toml",
  "effigy.tasks.toml",
]
