# Underlay starter — repo-owned task layer.
#
# `tasks.dev` is the managed front door. Everything else is an
# aggregator across the repo's child apps.
#
# This file is repo-owned on purpose: tab ordering, concurrent makeup,
# per-app process labels, and the list of child apps are all consumer
# concerns. Keep the `workspace` shell tab and the lifecycle tab — those
# are the managed-dev contract. Replace the `app-*/dev` entries to match
# the real apps in your repo.
#
# If you set `[bundle].workspace_service_name` to something other than
# `workspace`, update the `service = "workspace"` line in the shell role
# below to match.
#
# The bundled `ui-setup.rhai` helper reads `[bundle.dirs]` when repos
# need explicit package-directory mapping.

[tasks.health]
run_in = "host"
run = [
  # Replace with the repo's child apps.
  { task = "app-api/health" },
  { task = "app-admin/health" },
  { task = "app-front/health" },
]

[tasks.validate]
run_in = "host"
run = [
  { task = "app-api/validate" },
  { task = "app-admin/validate" },
  { task = "app-front/validate" },
]

[tasks.qa]
run_in = "host"
run = [
  { task = "health" },
  { task = "validate" },
]

[tasks.dev]
mode = "tui"
container_lifecycle = true
gateway = true
health_wait = true
concurrent = [
  { role = "lifecycle", start = 1, tab = 5 },
  { role = "shell", service = "workspace", start = 2, tab = 4 },
  { task = "app-api/dev", start = 3, tab = 3 },
  { name = "front", task = "app-front/dev", setup = [{ rhai = "{{ bundle.root }}/scripts/dev/ui-setup.rhai" }], start = 4, tab = 2 },
  { name = "admin", task = "app-admin/dev", setup = [{ rhai = "{{ bundle.root }}/scripts/dev/ui-setup.rhai" }], start = 5, tab = 1 },
]
