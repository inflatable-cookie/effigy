# Underlay starter — bootstrap helpers.
#
# Bootstrap-local `run` syncs repo dependencies before the first `dev` run.
# The commands run through normal managed run steps, so the bootstrap
# contract stays out of the task catalog entirely.
#
# Edit points:
#   - adjust the step sequence to match your repo's app layout.

[bootstrap]
run = [
  { rhai = "{{ bundle.root }}/scripts/bootstrap-env.rhai" },
  { task = "container up --detach" },
  { task = "bootstrap deps sync underlay-app" },
]
start = "dev"
