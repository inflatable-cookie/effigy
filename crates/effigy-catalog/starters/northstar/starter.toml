[starter]
name = "northstar"
description = "Northstar: current knowledge in Git, planning and leads in Queue, and a repository-owned docs check."

[[files]]
target = "AGENTS.md"

[[files]]
target = "README.md"

[[files]]
target = "docs/README.md"

[[files]]
target = "docs/knowledge/README.md"

[[files]]
target = "docs/knowledge/architecture.md"

[[files]]
target = "docs/knowledge/contracts/README.md"

[[files]]
target = "docs/knowledge/contracts/release.md"

[[files]]
target = "docs/knowledge/domain/README.md"

[[files]]
target = "docs/knowledge/questions.md"

[[files]]
target = "docs/knowledge/retired.toml"

[[files]]
target = "docs/knowledge/vision.md"

[[files]]
target = "effigy.toml"

[guidance]
text = """
Fill in AGENTS.md, docs/knowledge/vision.md, and the release procedure. Keep the plan, leads, papercuts, brief drafts, tasks and outcomes in Queue. Workers use the current brief's targeted Effigy selectors for changed-code tests and touched-target compilation, plus one docs check when needed; the planner runs full `effigy qa` on `main` at Queue milestones. The committed `[docs_policy.graph]` profile is the repository's own documentation authority.
"""
