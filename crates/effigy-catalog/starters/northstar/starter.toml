[starter]
name = "northstar"
description = "Lean Northstar: current knowledge, intent, triage, and a repository-owned docs check."

[[files]]
target = ".paseo/queue.json"

[[files]]
target = "AGENTS.md"

[[files]]
target = "PAPERCUTS.md"

[[files]]
target = "README.md"

[[files]]
target = "docs/README.md"

[[files]]
target = "docs/knowledge/README.md"

[[files]]
target = "docs/knowledge/architecture.md"

[[files]]
target = "docs/knowledge/contracts/README.md"

[[files]]
target = "docs/knowledge/contracts/release.md"

[[files]]
target = "docs/knowledge/domain/README.md"

[[files]]
target = "docs/knowledge/questions.md"

[[files]]
target = "docs/knowledge/retired.toml"

[[files]]
target = "docs/knowledge/vision.md"

[[files]]
target = "docs/plan.md"

[[files]]
target = "docs/triage/README.md"

[[files]]
target = "effigy.toml"

[guidance]
text = """
Fill in AGENTS.md, docs/knowledge/vision.md, and the release procedure. Keep task briefs and outcomes in Queue. Run `effigy qa` before the first PR. The committed `[docs_policy.graph]` profile is the repository's own documentation authority.
"""
