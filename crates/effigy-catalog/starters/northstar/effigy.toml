[manifest]
minimum_effigy_version = "0.7.0"

# Root Effigy manifest for a Northstar + Effigy consumer repo.
#
# Shape: single-repo. Adjust task contents, add release config, and
# extend `qa:northstar` with repo-specific checks as the project grows.
# If it becomes a multi-project repo, declare each nested catalog explicitly:
# [catalog.members]
# docs = "packages/docs"

[tasks]
ping = "printf ok"

# Repo-owned test entrypoint. Either leave `test` as the default
# built-in (by omitting it here), or declare an explicit task — do
# not leave this ambiguous in multi-runner repos.
# test = "<your test command>"

# Cheap orientation only: seconds-scale fmt/toolchain/docs-forbidden/check
# probes. Keep broader validation on `validate` and the full board on `qa`.
health = [
  { task = "ping" },
]

# Mid-cost validation gate. Add focused lint/check/test work here without
# collapsing the full `qa` board into `health`.
validate = [
  { task = "ping" },
]

# ---- Docs + Northstar contract ------------------------------------------------
# These use Effigy's built-in `docs` checks to enforce the consumer contract.
# Tune the paths below once the repo's real docs tree takes shape.

"qa:docs" = [
  { task = "qa:northstar:spine" },
  { task = "qa:northstar:docs-front-door" },
  { task = "qa:northstar:readme" },
]

"qa:northstar:spine" = "effigy docs check paths README.md AGENTS.md docs/README.md docs/vision/README.md docs/roadmaps/README.md docs/logs/README.md docs/policy/vision-next-task-verbs.txt"
"qa:northstar:agent-contract" = "effigy docs check contains AGENTS.md --require 'effigy tasks' --require 'effigy test --plan' --require 'docs/README.md' --require 'docs/vision/README.md' --require 'docs/roadmaps/README.md' --require 'docs/logs/README.md'"
"qa:northstar:readme" = "effigy docs check contains README.md --require 'docs/README.md'"
"qa:northstar:docs-front-door" = "effigy docs check contains docs/README.md --require 'vision/README.md' --require 'roadmaps/README.md' --require 'logs/README.md'"
"qa:northstar:indexes" = "effigy docs check index --policy-index vision"
"qa:northstar:next-action" = "effigy docs check next-action --policy vision"
"qa:northstar:headings" = "effigy docs check headings docs/vision/README.md --require-heading '## Vision Artifacts'"
"qa:northstar:agent-defaults" = "effigy docs check forbidden AGENTS.md README.md --forbid '--repo .'"

"qa:northstar" = [
  { task = "qa:northstar:spine" },
  { task = "qa:northstar:agent-contract" },
  { task = "qa:northstar:readme" },
  { task = "qa:northstar:docs-front-door" },
  { task = "qa:northstar:indexes" },
  { task = "qa:northstar:next-action" },
  { task = "qa:northstar:headings" },
  { task = "qa:northstar:agent-defaults" },
]

qa = [
  { task = "validate" },
  { task = "qa:docs" },
  { task = "qa:northstar" },
]

# ---- Docs policy -------------------------------------------------------------
# Starter `[docs_policy]` block — wire the vision index to the
# `effigy docs check index` / `check-next-action` engines.

[docs_policy.indexes.vision]
file = "docs/vision/README.md"
dir = "docs/vision"
section = "Vision Artifacts"
exclude = ["history/**"]

[docs_policy.next_actions.vision]
index = "vision"
heading = "## Next Task"
allowlist_file = "docs/policy/vision-next-task-verbs.txt"

# ---- Documentation graph profile ---------------------------------------------
# Northstar's repository-owned documentation ontology for `effigy docs context`.
#
# This block is COPIED configuration, not an inherited runtime dependency.
# `effigy init northstar` materializes these bytes into your `effigy.toml`; from
# that moment your committed manifest is the only runtime authority. Effigy never
# reads a starter, an installed agent skill, or any template directory while
# answering a query, so upgrading Effigy or your skills cannot silently
# reinterpret this repository. Picking up a newer template is an explicit edit:
# re-run `effigy init northstar --dry-run` and merge the parts you want.
#
# Every token below is repository-owned. Rename kinds, fields, statuses, and
# relations to match your project; the runtime has no built-in Northstar
# vocabulary. Kind globs must not overlap - one document matches at most one
# kind - and a single `*` never crosses a path separator, which is what keeps
# each nested family disjoint from its parent directory.

# ---- Cross-repository sharing ------------------------------------------------
# Your half of two-sided membership for `effigy docs context --sources`. A
# portfolio file names directories to look in; this table is how this repository
# says it wants to be found there. Leave `share = false` (or delete the table)
# and no portfolio can search this checkout.

[docs_policy.sources]
share = true
front_doors = ["docs/README.md", "AGENTS.md"]
skill_roots = [".agents/skills"]

[docs_policy.graph]
roots = ["README.md", "AGENTS.md", "CHANGELOG.md", "docs"]

[docs_policy.graph.fields.status]
labels = ["Status"]
cardinality = "one"

[docs_policy.graph.fields.owner]
labels = ["Owner"]
cardinality = "one"

[docs_policy.graph.currentness]
field = "status"
current = ["active", "ready", "strict-ready", "draft", "planned", "accepted"]
historical = ["complete", "archived", "closed", "superseded", "deprecated"]

# ---- Kinds -------------------------------------------------------------------
# Authority is repository policy, not relevance. It orders results that already
# match; it can never pull an unrelated document into a report.

[docs_policy.graph.kinds.contract]
include = ["docs/contracts/*.md"]
exclude = []
authority = 100
default-currentness = "current"

[docs_policy.graph.kinds.architecture]
include = ["docs/architecture/*.md"]
exclude = []
authority = 90
default-currentness = "current"

[docs_policy.graph.kinds.spec]
include = ["docs/specs/*.md"]
exclude = []
authority = 85
default-currentness = "current"

[docs_policy.graph.kinds.archived-spec]
include = ["docs/specs/archive/*.md"]
exclude = []
authority = 10
default-currentness = "historical"

[docs_policy.graph.kinds.vision]
include = ["docs/vision/*.md"]
exclude = []
authority = 80
default-currentness = "current"

[docs_policy.graph.kinds.archived-vision]
include = ["docs/vision/history/*.md"]
exclude = []
authority = 10
default-currentness = "historical"

[docs_policy.graph.kinds.roadmap]
include = ["docs/roadmaps/*.md", "docs/roadmaps/*/*.md"]
exclude = []
authority = 70
default-currentness = "unknown"

[docs_policy.graph.kinds.ready-card]
include = ["docs/roadmaps/*/batch-cards/*.md"]
exclude = []
authority = 60
default-currentness = "unknown"

[docs_policy.graph.kinds.guide]
include = ["docs/guides/*.md"]
exclude = []
authority = 50
default-currentness = "current"

[docs_policy.graph.kinds.archived-guide]
include = ["docs/guides/archive/*.md"]
exclude = []
authority = 10
default-currentness = "historical"

[docs_policy.graph.kinds.front-door]
include = ["README.md", "AGENTS.md", "CHANGELOG.md", "docs/README.md"]
exclude = []
authority = 40
default-currentness = "current"

[docs_policy.graph.kinds.log]
include = ["docs/logs/*.md", "docs/logs/*/*.md"]
exclude = []
authority = 30
default-currentness = "historical"

[docs_policy.graph.kinds.archived-log]
include = ["docs/logs/archive/*/*.md"]
exclude = []
authority = 5
default-currentness = "historical"

[docs_policy.graph.kinds.handoff]
include = ["docs/handoffs/*.md"]
exclude = []
authority = 15
default-currentness = "unknown"

# ---- Relations ---------------------------------------------------------------
# `labels` match `Label: [link](target)` metadata lines. `headings` match links
# found under the named heading. Both are traversed by `--max-hops`.

[docs_policy.graph.relations.contract]
labels = ["Contract", "Contracts"]
headings = []

[docs_policy.graph.relations.architecture]
labels = ["Architecture"]
headings = []

[docs_policy.graph.relations.spec]
labels = ["Spec", "Lane", "Strict lane"]
headings = []

[docs_policy.graph.relations.roadmap]
labels = ["Roadmap", "Roadmaps"]
headings = []

[docs_policy.graph.relations.card]
labels = ["Card", "Batch card", "Ready card", "Current ready card"]
headings = []

[docs_policy.graph.relations.evidence]
labels = ["Evidence", "Prior evidence", "Predecessor evidence", "Closeout log"]
headings = []

[docs_policy.graph.relations.supersedes]
labels = ["Supersedes", "Superseded by"]
headings = []

[docs_policy.graph.relations.next-task]
labels = []
headings = ["Next Task"]

# ---- Release (deferred) ------------------------------------------------------
# Uncomment and tune once the repo is actually preparing to ship artifacts.
# See docs/guides/056-northstar-effigy-consumer-repo-contract.md §5.
#
# [release]
# changelog = "CHANGELOG.md"
# tag-format = "v{version}"
