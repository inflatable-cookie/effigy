[manifest]
minimum_effigy_version = "0.7.0"

# Root Effigy manifest for a Northstar + Effigy consumer repo.
#
# Shape: single-repo. Adjust task contents, add release config, and
# extend `qa:northstar` with repo-specific checks as the project grows.
# If it becomes a multi-project repo, declare each nested catalog explicitly:
# [catalog.members]
# docs = "packages/docs"

[tasks]
ping = "printf ok"

# Repo-owned test entrypoint. Either leave `test` as the default
# built-in (by omitting it here), or declare an explicit task — do
# not leave this ambiguous in multi-runner repos.
# test = "<your test command>"

# Cheap orientation only: seconds-scale fmt/toolchain/docs-forbidden/check
# probes. Keep broader validation on `validate` and the full board on `qa`.
health = [
  { task = "ping" },
]

# Mid-cost validation gate. Add focused lint/check/test work here without
# collapsing the full `qa` board into `health`.
validate = [
  { task = "ping" },
]

# ---- Docs + Northstar contract ------------------------------------------------
# These use Effigy's built-in `docs` checks to enforce the consumer contract.
# Tune the paths below once the repo's real docs tree takes shape.

"qa:docs" = [
  { task = "qa:northstar:spine" },
  { task = "qa:northstar:docs-front-door" },
  { task = "qa:northstar:readme" },
]

"qa:northstar:spine" = "effigy docs check paths README.md AGENTS.md docs/README.md docs/vision/README.md docs/roadmaps/README.md docs/logs/README.md docs/policy/vision-next-task-verbs.txt"
"qa:northstar:agent-contract" = "effigy docs check contains AGENTS.md --require 'effigy tasks' --require 'effigy test --plan' --require 'docs/README.md' --require 'docs/vision/README.md' --require 'docs/roadmaps/README.md' --require 'docs/logs/README.md'"
"qa:northstar:readme" = "effigy docs check contains README.md --require 'docs/README.md'"
"qa:northstar:docs-front-door" = "effigy docs check contains docs/README.md --require 'vision/README.md' --require 'roadmaps/README.md' --require 'logs/README.md'"
"qa:northstar:indexes" = "effigy docs check index --policy-index vision"
"qa:northstar:next-action" = "effigy docs check next-action --policy vision"
"qa:northstar:headings" = "effigy docs check headings docs/vision/README.md --require-heading '## Vision Artifacts'"
"qa:northstar:agent-defaults" = "effigy docs check forbidden AGENTS.md README.md --forbid '--repo .'"

"qa:northstar" = [
  { task = "qa:northstar:spine" },
  { task = "qa:northstar:agent-contract" },
  { task = "qa:northstar:readme" },
  { task = "qa:northstar:docs-front-door" },
  { task = "qa:northstar:indexes" },
  { task = "qa:northstar:next-action" },
  { task = "qa:northstar:headings" },
  { task = "qa:northstar:agent-defaults" },
]

qa = [
  { task = "validate" },
  { task = "qa:docs" },
  { task = "qa:northstar" },
]

# ---- Docs policy -------------------------------------------------------------
# Starter `[docs_policy]` block — wire the vision index to the
# `effigy docs check index` / `check-next-action` engines.

[docs_policy.indexes.vision]
file = "docs/vision/README.md"
dir = "docs/vision"
section = "Vision Artifacts"
exclude = ["history/**"]

[docs_policy.next_actions.vision]
index = "vision"
heading = "## Next Task"
allowlist_file = "docs/policy/vision-next-task-verbs.txt"

# Northstar's repository-owned graph ontology is emitted by this starter.
[docs_policy.graph]
roots = ["README.md", "docs"]

[docs_policy.graph.fields.status]
labels = ["Status"]
cardinality = "one"

[docs_policy.graph.fields.owner]
labels = ["Owner"]
cardinality = "one"

[docs_policy.graph.currentness]
field = "status"
current = ["active", "ready", "strict-ready", "draft"]
historical = ["complete", "archived", "superseded"]

[docs_policy.graph.kinds.contract]
include = ["docs/contracts/*.md"]
exclude = []
authority = 100
default-currentness = "unknown"

[docs_policy.graph.kinds.archived-spec]
include = ["docs/specs/archive/*.md"]
exclude = []
authority = 10
default-currentness = "historical"

[docs_policy.graph.relations.contract]
labels = ["Contract", "Contracts"]
headings = []

[docs_policy.graph.relations.next-task]
labels = []
headings = ["Next Task"]

# ---- Release (deferred) ------------------------------------------------------
# Uncomment and tune once the repo is actually preparing to ship artifacts.
# See docs/guides/056-northstar-effigy-consumer-repo-contract.md §5.
#
# [release]
# changelog = "CHANGELOG.md"
# tag-format = "v{version}"
