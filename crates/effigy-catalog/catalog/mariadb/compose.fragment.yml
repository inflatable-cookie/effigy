services:
  {{ service_name }}:
    image: mariadb:{{ version }}
    environment:
      MYSQL_ROOT_PASSWORD: "{{ root_password }}"
      MYSQL_DATABASE: "{{ database }}"
    ports:
      - "3306:3306"
    volumes:
      - {{ repo_root }}/.effigy/runtime/data/{{ service_name }}/mysql:/var/lib/mysql
      - {{ repo_root }}/.effigy/runtime/{{ project_name }}/{{ service_name }}.conf:/docker-entrypoint-initdb.d/10-extra-databases.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=100
