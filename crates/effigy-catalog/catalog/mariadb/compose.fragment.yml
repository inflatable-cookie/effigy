services:
  {{ service_name }}:
    image: mariadb:{{ version }}
    # Run under an init process so the children its periodic health check
    # leaves behind are reaped, not kept as zombies under mariadbd (effigy#1130).
    init: true
    environment:
      MYSQL_ROOT_PASSWORD: "{{ password }}"
      MYSQL_DATABASE: "{{ database }}"
    ports:
      - "3306:3306"
    volumes:
      - {{ project_name }}-{{ service_name }}-data:/var/lib/mysql
      - {{ repo_root }}/.effigy/runtime/compose/{{ service_name }}.conf:/docker-entrypoint-initdb.d/10-extra-databases.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=100
