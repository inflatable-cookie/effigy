[service]
name = "mariadb"
description = "MariaDB database server"

[params.version]
type = "string"
default = "10.11"
description = "MariaDB version"

[params.database]
type = "string"
default = "app"
description = "Default database name"

[params.root_password]
type = "string"
default = "secret"
description = "Root password (local dev only)"

[capabilities]
exec_target = true
shell = "/bin/bash"

[volumes.data]
mount = "/var/lib/mysql"
named = true
persist = true
description = "Database storage"

[ports]
default = [3306]
description = "MySQL protocol port"
