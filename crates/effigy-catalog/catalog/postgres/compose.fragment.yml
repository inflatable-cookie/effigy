services:
  {{ service_name }}:
    image: postgres:{{ version }}-alpine
    environment:
      POSTGRES_DB: "{{ database }}"
      POSTGRES_PASSWORD: "{{ password }}"
    ports:
      - "5432:5432"
    volumes:
      - {{ project_name }}-{{ service_name }}-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
