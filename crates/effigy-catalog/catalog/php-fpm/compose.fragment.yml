services:
  {{ service_name }}:
    build:
      context: {{ repo_root }}
      dockerfile: {{ catalog_path }}/Dockerfile
      args:
        PHP_VERSION: "{{ version }}"
        WORKSPACE_UID: "{{ host_uid }}"
        WORKSPACE_GID: "{{ host_gid }}"
        COMPOSER_HOME: "/home/dev/.config/composer"
{% if extensions %}
        EXTENSIONS: "{{ extensions | join(' ') }}"
{% endif %}
{% if node_version %}
        NODE_VERSION: "{{ node_version }}"
{% endif %}
{% if node_global_packages %}
        NODE_GLOBAL_PACKAGES: "{{ node_global_packages | join(' ') }}"
{% endif %}
{% if composer_global_packages and not mount_host_composer_home %}
        COMPOSER_GLOBAL_PACKAGES: "{{ composer_global_packages | join(' ') }}"
{% endif %}
    volumes:
      - {% if mount_source %}{{ mount_source }}{% else %}{{ repo_root }}{% endif %}:{{ working_dir }}
      - {{ project_name }}-{{ service_name }}-pnpm-store:/home/dev/.local/share/pnpm/store
{% for dir in isolated_dirs %}
      - {{ project_name }}-{{ service_name }}{{ working_dir | replace("/", "-") | replace("_", "-") }}-{{ dir | replace("/", "-") | replace("_", "-") }}:{{ working_dir }}/{{ dir }}
{% endfor %}
    tmpfs:
      - /run/effigy/secrets
{% if host_ports %}
    ports:
{% for port in host_ports %}
      - "{{ port }}"
{% endfor %}
{% endif %}
    working_dir: {{ working_dir }}
    environment:
      DOCUMENT_ROOT: "{{ document_root }}"
      COMPOSER_HOME: "/home/dev/.config/composer"
      COMPOSER_CACHE_DIR: "/home/dev/.cache/composer"
      PNPM_HOME: "/home/dev/.local/share/pnpm"
      pnpm_config_store_dir: "/home/dev/.local/share/pnpm/store"
      npm_config_store_dir: "/home/dev/.local/share/pnpm/store"
      EFFIGY_SMTP_HOST: "{% if services.mail %}{{ services.mail.name }}{% elif services.mailpit %}{{ services.mailpit.name }}{% else %}mail{% endif %}"
      EFFIGY_SMTP_PORT: "{% if services.mail %}1025{% elif services.mailpit %}1025{% else %}1025{% endif %}"
{% if services.mariadb or services.postgres or services.redis or services.memcached or services.mail or services.mailpit %}
    depends_on:
{% endif %}
{% if services.mariadb %}
      {{ services.mariadb.name }}:
        condition: service_started
{% endif %}
{% if services.postgres %}
      {{ services.postgres.name }}:
        condition: service_started
{% endif %}
{% if services.redis %}
      {{ services.redis.name }}:
        condition: service_started
{% endif %}
{% if services.memcached %}
      {{ services.memcached.name }}:
        condition: service_started
{% endif %}
{% if services.mail %}
      {{ services.mail.name }}:
        condition: service_started
{% elif services.mailpit %}
      {{ services.mailpit.name }}:
        condition: service_started
{% endif %}
