[service]
name = "php-fpm"
description = "PHP-FPM application server with Composer and optional Node.js"

[params.version]
type = "string"
default = "8.3"
description = "PHP version (e.g., 7.4, 8.0, 8.1, 8.2, 8.3)"

[params.extensions]
type = "list"
default = []
description = "PHP extensions to install (e.g., pdo_mysql, gd, redis, memcached, intl, zip)"

[params.document_root]
type = "string"
default = "public"
description = "Document root relative to repo root"

[params.working_dir]
type = "string"
default = "/var/www/html"
description = "Container working directory where the repo is mounted"

[params.mount_source]
type = "string"
default = ""
description = "Host path to mount into `working_dir`. Empty keeps the default repo root mount."

[params.node_version]
type = "string"
default = ""
description = "Node.js major version to install (e.g., 20, 22). Empty to skip."

[params.node_global_packages]
type = "list"
default = []
description = "npm packages to install globally when Node.js is enabled (e.g., eclint)"

[params.mount_host_composer_home]
type = "bool"
default = false
description = "Mount the host Composer home into the workspace container when explicitly enabled and available"

[params.mount_shared_composer_auth]
type = "bool"
default = true
description = "Mount shared Effigy-managed Composer auth/config files into the workspace container"

[params.mount_shared_composer_cache]
type = "bool"
default = true
description = "Mount a shared Effigy-managed Composer cache directory into the workspace container"

[params.composer_global_packages]
type = "list"
default = []
description = "Composer packages to install globally in the container image as a fallback when no host Composer home is mounted"

[params.mount_host_git_config]
type = "bool"
default = true
description = "Mount the host's `~/.gitconfig` read-only into the workspace container so git inside the container inherits the developer's identity, aliases, and global ignore. Skipped silently when the host file does not exist."

[params.mount_host_ssh_known_hosts]
type = "bool"
default = true
description = "Mount the host's `~/.ssh/known_hosts` read-only into the workspace container so git/ssh from inside the container does not prompt on first connection to known remotes. Skipped silently when the host file does not exist."

[params.forward_host_ssh_agent]
type = "bool"
default = true
description = "Forward the host's SSH agent socket into the workspace container (Colima exposes it at `/run/host-services/ssh-auth.sock`) and set `SSH_AUTH_SOCK` accordingly so git pushes over SSH use the developer's already-loaded keys without copying private material into the container. Skipped silently when the socket is not present on the host."

[capabilities]
exec_target = true
shell = "/bin/bash"

[depends_on]
optional = ["mariadb", "postgres", "redis", "memcached"]
