[service]
name = "redis"
description = "Redis in-memory data store"

[params.version]
type = "string"
default = "7"
description = "Redis major version"

[capabilities]
exec_target = true
shell = "/bin/sh"
loopback_alias_label = "redis"
loopback_alias_port = 6379
shared_service = true
shared_host_env_vars = ["REDIS_HOST"]
shared_port_env_vars = ["REDIS_PORT"]

[ports]
default = [6379]
description = "Redis protocol port"
