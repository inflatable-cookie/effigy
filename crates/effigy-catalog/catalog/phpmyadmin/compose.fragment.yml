services:
  {{ service_name }}:
    image: phpmyadmin:{{ version }}
    environment:
      PMA_HOST: "{{ database_host }}"
      PMA_PORT: "{{ database_port }}"
      PMA_USER: "root"
{% set database_service = services[database_host] %}
{% if database_password %}
      PMA_PASSWORD: "{{ database_password }}"
{% elif database_service and database_service.params.password %}
      PMA_PASSWORD: "{{ database_service.params.password }}"
{% else %}
      PMA_PASSWORD: ""
{% endif %}
      UPLOAD_LIMIT: "128M"
{% if services.db %}
    depends_on:
      {{ services.db.name }}:
        condition: service_started
{% elif services.mariadb %}
    depends_on:
      {{ services.mariadb.name }}:
        condition: service_started
{% endif %}
    ports:
      - "80:80"
    healthcheck:
      # The phpMyAdmin image ships no wget or curl; PHP is always present.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 80, $$e, $$s, 2) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
