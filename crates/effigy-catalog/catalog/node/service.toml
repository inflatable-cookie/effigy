[service]
name = "node"
description = "Node.js application server for frontend or full-stack JavaScript projects"

[params.version]
type = "string"
default = "22"
description = "Node.js major version (e.g., 18, 20, 22)"

[params.working_dir]
type = "string"
default = "/app"
description = "Container working directory where the repo is mounted"

[params.command]
type = "string"
default = "npm run dev"
description = "Command to run (e.g., 'npm run dev', 'yarn dev', 'pnpm dev')"

[params.port]
type = "integer"
default = 3000
description = "Application port inside the container"

[params.mount_host_git_config]
type = "bool"
default = true
description = "Mount the host's `~/.gitconfig` read-only into the workspace container so git inside the container inherits the developer's identity, aliases, and global ignore. Skipped silently when the host file does not exist."

[params.mount_host_ssh_known_hosts]
type = "bool"
default = true
description = "Mount the host's `~/.ssh/known_hosts` read-only into the workspace container so git/ssh from inside the container does not prompt on first connection to known remotes. Skipped silently when the host file does not exist."

[params.mount_host_ssh_dir]
type = "bool"
default = false
description = "Mount the host's full `~/.ssh` directory read-only at `/home/dev/.ssh` for trusted local-dev cases that depend on private key files, `IdentityFile`, or `IdentitiesOnly`. Takes precedence over the narrower SSH config and known_hosts mounts."

[params.ssh_dir_path]
type = "string"
default = ""
description = "Explicit path to a host SSH directory to mount read-only at `/home/dev/.ssh`. Supports `${VAR}` and `~`. Takes precedence over `mount_host_ssh_dir`, `mount_host_ssh_config`, and `ssh_config_path`."

[params.mount_host_ssh_config]
type = "bool"
default = false
description = "Mount the host's `~/.ssh/config` read-only into the workspace container when you explicitly want container SSH to reuse a container-safe host config. Disabled by default because many host configs depend on local-only `IdentityFile`, `Include`, or `IdentitiesOnly` rules that should stay explicit in container use. Skipped silently when the host file does not exist."

[params.ssh_config_path]
type = "string"
default = ""
description = "Explicit path to a container-safe SSH config file to mount at `/home/dev/.ssh/config`. Supports `${VAR}` and `~`. Takes precedence over `mount_host_ssh_config`."

[params.forward_host_ssh_agent]
type = "bool"
default = true
description = "Forward the host's SSH agent socket into the workspace container (Colima exposes it at `/run/host-services/ssh-auth.sock`) and set `SSH_AUTH_SOCK` accordingly so git pushes over SSH use the developer's already-loaded keys without copying private material into the container. Skipped silently when the socket is not present on the host."

[capabilities]
exec_target = true
shell = "/bin/bash"
workspace_host_integration = true
installs_mkcert_ca = true

[volumes.node-modules]
mount = "/app/node_modules"
named = true
persist = false
description = "Node modules — kept in a named volume to avoid host/container platform conflicts"

[ports]
default = [3000]
description = "Application HTTP port"
