[service]
name = "silo"
description = "S3-compatible object storage (PGSTY Silo, a maintained MinIO fork) for local development"

[params.image]
type = "string"
default = "docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46"
description = "Digest-pinned PGSTY Silo server image (source pgsty/silo 2a4d5140). The image also ships the `mc` client."

[params.root_user]
type = "string"
default = "minioadmin"
description = "Root user for Silo access"

[params.root_password]
type = "string"
default = "minioadmin"
description = "Root password for Silo access"

[params.api_port]
type = "integer"
default = 9000
description = "S3 API port"

[params.console_port]
type = "integer"
default = 9001
description = "Silo web console port"

[capabilities]
exec_target = true
shell = "/bin/sh"
loopback_alias_label = "s3"
loopback_alias_port = 9000

[volumes.data]
mount = "/data"
named = true
persist = true
description = "Object storage data"

[ports]
default = [9000, 9001]
description = "S3 API (9000) and web console (9001)"
