services:
  {{ service_name }}:
    image: minio/minio:{{ version }}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "{{ root_user }}"
      MINIO_ROOT_PASSWORD: "{{ root_password }}"
    ports:
      - "{{ api_port }}:9000"
      - "{{ console_port }}:9001"
    volumes:
      - {{ project_name }}-{{ service_name }}-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
