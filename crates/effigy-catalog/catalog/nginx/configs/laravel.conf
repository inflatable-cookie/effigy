##
## Effigy nginx config: Laravel
##
## Tuned for Laravel conventions — proper handling of storage symlinks,
## Sanctum/Fortify routes, and Vite dev server proxying.
##
## Rendered through Jinja2 by the effigy catalog assembler.
##

server {
    listen 80;
    server_name _;

    root {{ working_dir }}/{{ document_root }};
    index index.php;

    charset utf-8;

    # ── Request size limits ────────────────────────────────────────────
    client_max_body_size 128M;
    client_body_buffer_size 16k;

    # ── Gzip ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Security headers ──────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Front controller ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP handling ──────────────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass {% if services["php-fpm"] %}{{ services["php-fpm"].name }}{% else %}app{% endif %}:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;

        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
        fastcgi_busy_buffers_size 32k;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_connect_timeout 10s;

        fastcgi_hide_header X-Powered-By;
    }

    # ── Hidden files / sensitive files ────────────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* (\.env|\.git|composer\.(json|lock)|package(-lock)?\.json|artisan) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Static assets ─────────────────────────────────────────────────
    location ~* \.(css|js|jpg|jpeg|gif|png|ico|svg|webp|avif|woff|woff2|ttf|eot|mp4|webm|pdf)$ {
        expires 1h;
        access_log off;
        add_header Cache-Control "public, no-transform";
        try_files $uri /index.php?$query_string;
    }

    # ── Laravel storage symlink ───────────────────────────────────────
    # Serve files from storage/app/public via the storage symlink.
    location /storage/ {
        try_files $uri $uri/ =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =204; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;
}
