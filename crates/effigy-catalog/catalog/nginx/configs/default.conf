##
## Effigy nginx config: generic PHP front-controller
##
## Works for most PHP frameworks that route through a single entry point
## (index.php) with URL rewriting. Covers custom frameworks, Laravel,
## Symfony, and similar front-controller patterns.
##
## This file is rendered through Jinja2 by the effigy catalog assembler.
## The fastcgi_pass target is resolved from the PHP-FPM service name in
## your compose stack.
##

server {
    listen 80;
    server_name _;

    root {% if document_root == "." %}{{ working_dir }}{% else %}{{ working_dir }}/{{ document_root }}{% endif %};
    index index.php index.html index.htm;

    charset utf-8;

    set $fastcgi_https off;
    set $fastcgi_request_scheme $scheme;
    set $fastcgi_server_port $server_port;

    if ($http_x_forwarded_proto = "https") {
        set $fastcgi_https on;
        set $fastcgi_request_scheme https;
        set $fastcgi_server_port 443;
    }

    # ── Request size limits ────────────────────────────────────────────
    client_max_body_size 128M;
    client_body_buffer_size 16k;

    # ── Gzip compression ──────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Front controller ──────────────────────────────────────────────
    # Try serving the request as a file, then a directory, then fall
    # back to the front controller (index.php). This is the standard
    # mod_rewrite equivalent for nginx.
    location / {
{% if rewrite_all_to %}
        rewrite .* {{ rewrite_all_to }} last;
{% elif front_controller_fallback %}
        try_files $uri $uri/ {{ front_controller_fallback }};
{% else %}
        try_files $uri $uri/ =404;
{% endif %}
    }

    # ── PHP handling ──────────────────────────────────────────────────
    location ~ \.php$ {
        # Prevent PHP execution from uploaded files or other unexpected
        # locations. Only process .php files that actually exist.
        try_files $uri =404;

        fastcgi_pass {% if services["php-fpm"] %}{{ services["php-fpm"].name }}{% else %}app{% endif %}:9000;
        fastcgi_index index.php;

        # Standard parameters.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_param REQUEST_SCHEME $fastcgi_request_scheme;
        fastcgi_param SERVER_PORT $fastcgi_server_port;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        include fastcgi_params;

        # Buffer and timeout tuning for development.
        # Generous timeouts to allow debugging sessions and slow queries.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
        fastcgi_busy_buffers_size 32k;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_connect_timeout 10s;

        # Hide PHP version for good habit, even in dev.
        fastcgi_hide_header X-Powered-By;
    }

    # ── Security ──────────────────────────────────────────────────────
    # Deny access to hidden files (except .well-known for ACME).
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to common sensitive files.
    location ~* (\.env|\.git|composer\.(json|lock)|package(-lock)?\.json|\.editorconfig|\.php_cs) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Static assets ─────────────────────────────────────────────────
    # In development, use short cache times so changes are visible.
    location ~* \.(css|js|jpg|jpeg|gif|png|ico|svg|webp|avif|woff|woff2|ttf|eot|mp4|webm|pdf)$ {
        expires 1h;
        access_log off;
        add_header Cache-Control "public, no-transform";

        # Fall back to front controller for missing assets
        # (useful for asset pipeline routes).
{% if asset_fallback %}
        try_files $uri {{ asset_fallback }};
{% else %}
        try_files $uri =404;
{% endif %}
    }

    # ── Favicon and robots ────────────────────────────────────────────
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =204;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # ── Error handling ────────────────────────────────────────────────
    # Route 404s through the front controller so the application can
    # render its own error pages.
    error_page 404 {{ error_page_404 }};
}
