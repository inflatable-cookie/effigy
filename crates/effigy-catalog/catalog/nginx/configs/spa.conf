##
## Effigy nginx config: Single-Page Application
##
## For frontend apps (React, Vue, Svelte, etc.) that handle routing
## client-side. All unmatched routes serve index.html. Includes optional
## API proxy pass-through configuration.
##

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.html;

    charset utf-8;

    # ── Request size limits ────────────────────────────────────────────
    client_max_body_size 128M;

    # ── Gzip ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        application/wasm;

    # ── Security headers ──────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ── SPA fallback ──────────────────────────────────────────────────
    # Serve static files if they exist, otherwise fall back to
    # index.html so the client-side router handles the route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy (uncomment and configure as needed) ─────────────────
    # Proxy API requests to a backend service. Adjust the target to
    # match your API service name and port in the compose stack.
    #
    # location /api/ {
    #     proxy_pass http://api:3000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #
    #     # WebSocket support for API routes.
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #
    #     proxy_read_timeout 300s;
    # }

    # ── Static assets ─────────────────────────────────────────────────
    # Hashed filenames (app.abc123.js) can be cached aggressively.
    # Unhashed assets get short cache times.
    location ~* \.[0-9a-f]{8,}\.(css|js|woff2?|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js|jpg|jpeg|gif|png|ico|svg|webp|avif|woff|woff2|ttf|eot|mp4|webm|pdf)$ {
        expires 1h;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # ── Hidden files ──────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =204; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
