##
## Effigy nginx config: DecodeLabs monolithic front controller
##
## DecodeLabs apps route every request through /vendor/genesis.php and
## handle routing, asset serving, and error pages in PHP. Nginx does
## nothing but rewrite and hand off to php-fpm.
##
## Rendered through Jinja2 by the effigy catalog assembler.
##

server {
    listen 80;
    server_name _;

    root {% if document_root == "." %}{{ working_dir }}{% else %}{{ working_dir }}/{{ document_root }}{% endif %};

    rewrite .* /vendor/genesis.php last;

    location ~ \.php$ {
        fastcgi_pass {% if services["php-fpm"] %}{{ services["php-fpm"].name }}{% else %}app{% endif %}:9000;

        # Standard parameters.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_param REQUEST_SCHEME $fastcgi_request_scheme;
        fastcgi_param SERVER_PORT $fastcgi_server_port;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        include fastcgi_params;

        # Buffer and timeout tuning for development.
        # Generous timeouts to allow debugging sessions and slow queries.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
        fastcgi_busy_buffers_size 32k;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_connect_timeout 10s;
    }
}
