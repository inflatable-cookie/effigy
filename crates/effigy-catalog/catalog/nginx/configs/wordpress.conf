##
## Effigy nginx config: WordPress
##
## Handles WordPress permalink rewriting, wp-admin, xmlrpc restrictions,
## and multisite support (uncomment the multisite section if needed).
##
## Rendered through Jinja2 by the effigy catalog assembler.
##

server {
    listen 80;
    server_name _;

    root {{ working_dir }};
    index index.php index.html;

    charset utf-8;

    # ── Request size limits ────────────────────────────────────────────
    # WordPress media uploads can be large.
    client_max_body_size 256M;
    client_body_buffer_size 128k;

    # ── Gzip ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── WordPress permalinks ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # ── PHP handling ──────────────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass {% if services["php-fpm"] %}{{ services["php-fpm"].name }}{% else %}app{% endif %}:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        include fastcgi_params;

        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
        fastcgi_busy_buffers_size 32k;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_connect_timeout 10s;

        fastcgi_hide_header X-Powered-By;
    }

    # ── wp-content/uploads ────────────────────────────────────────────
    # Prevent PHP execution in the uploads directory.
    location ~* /wp-content/uploads/.*\.php$ {
        deny all;
    }

    # ── wp-includes ───────────────────────────────────────────────────
    # Allow specific js/css files but block PHP execution.
    location ~* /wp-includes/.*\.php$ {
        deny all;
    }

    # ── Security ──────────────────────────────────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to xmlrpc.php (common attack vector).
    # Uncomment if you don't use XML-RPC.
    # location = /xmlrpc.php {
    #     deny all;
    #     access_log off;
    #     log_not_found off;
    # }

    # Block access to sensitive WordPress files.
    location ~* (wp-config\.php|readme\.html|license\.txt) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Static assets ─────────────────────────────────────────────────
    location ~* \.(css|js|jpg|jpeg|gif|png|ico|svg|webp|avif|woff|woff2|ttf|eot|mp4|webm|pdf)$ {
        expires 1h;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =204; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ── WordPress Multisite (uncomment if needed) ─────────────────────
    # location ~ ^/files/(.*)$ {
    #     try_files /wp-includes/ms-files.php?file=$1 =404;
    # }
}
