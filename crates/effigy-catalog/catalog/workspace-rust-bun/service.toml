[service]
name = "workspace-rust-bun"
description = "Long-running Rust + Bun dev workspace container — used as a shell target and command runner for repo tasks, not as a long-running service."

[params.rust_version]
type = "string"
default = "1.91"
description = "Rust toolchain version (used as the `rust:<version>-bookworm` base image tag)"

[params.bun_version]
type = "string"
default = ""
description = "Bun version tag to install (e.g. '1.1.18'). Empty string installs the latest stable Bun."

[params.workspace_mount]
type = "string"
default = "/workspace-root"
description = "Mount point for the workspace root inside the container. The Effigy system layer binds the consumer repo and any extra workspace mounts into subdirectories of this path."

[params.working_subdir]
type = "string"
default = ""
description = "Subdirectory of `workspace_mount` to use as the compose `working_dir`. Empty means `workspace_mount` itself. The Effigy system layer overrides the exec working dir at task time via `systems.<name>.working_dir`; this only affects the compose default."

[params.host_ports]
type = "list"
default = []
description = "Host port bindings to publish on the workspace container, as strings (e.g. [\"41001:41001\", \"41002:41002\"]). Typically used to expose repo-owned dev servers that run inside the workspace."

[params.isolated_dirs]
type = "list"
default = []
description = "Directory paths (relative to working_dir) that should be backed by named Docker volumes instead of the host bind mount, e.g. `[\"api/target\", \"front/node_modules\"]`. Use this for Rust `target/` output and Bun/Node `node_modules/` installs that should stay on Linux-native storage."

[params.mount_host_git_config]
type = "bool"
default = true
description = "Mount the host's `~/.gitconfig` read-only into the workspace container so git inside the container inherits the developer's identity, aliases, and global ignore. Skipped silently when the host file does not exist."

[params.mount_host_ssh_known_hosts]
type = "bool"
default = true
description = "Mount the host's `~/.ssh/known_hosts` read-only into the workspace container so git/ssh from inside the container does not prompt on first connection to known remotes. Skipped silently when the host file does not exist."

[params.forward_host_ssh_agent]
type = "bool"
default = true
description = "Forward the host's SSH agent socket into the workspace container (Colima exposes it at `/run/host-services/ssh-auth.sock`) and set `SSH_AUTH_SOCK` accordingly so git pushes over SSH use the developer's already-loaded keys without copying private material into the container. Skipped silently when the socket is not present on the host."

[params.mount_host_mkcert_ca]
type = "bool"
default = true
description = "Mount the host's mkcert root CA (`$(mkcert -CAROOT)/rootCA.pem`) read-only at `/usr/local/share/ca-certificates/effigy-mkcert.crt`. The image's `effigy-entrypoint` runs `update-ca-certificates` on container start so HTTPS calls from inside the container trust the host gateway's mkcert-issued certs. Skipped silently when mkcert is not installed or has not generated a root CA."

[capabilities]
exec_target = true
shell = "/bin/bash"

[volumes.cargo-registry]
mount = "/usr/local/cargo/registry"
named = true
persist = true
description = "Cargo crates registry cache — preserves `cargo fetch` results across container rebuilds"

[volumes.cargo-git]
mount = "/usr/local/cargo/git"
named = true
persist = true
description = "Cargo git dependency cache"
