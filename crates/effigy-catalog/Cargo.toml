[package]
name = "effigy-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Service catalog and compose assembly for Effigy container environments"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
minijinja = "2"
indexmap = { version = "2", features = ["serde"] }
rust-embed = "8"
serde_yaml = "0.9"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
