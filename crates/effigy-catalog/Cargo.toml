[package]
name = "effigy-catalog"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Service catalog and compose assembly for Effigy container environments"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
minijinja = "2"
indexmap = { version = "2", features = ["serde"] }
rust-embed = "8"
thiserror = "2"
