[tasks.validate]
run = [{ rhai = "scripts/container-helpers.rhai" }]

[containers]
default = "web"

[containers.web]
driver = "colima"
startup = "detached"
profile = "dev"
compose_file = "infra/dev/docker-compose.yml"
project_name = "fixture-web-dev"
primary_service = "app"

[containers.web.lifecycle]
on_task_exit = "stop"
shutdown = "graceful"
detach_timeout_secs = 1

[containers.web.host]
mounts = ["./:/workspace"]
