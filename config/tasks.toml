# Environment CI regressions in both isolated and genuinely shared test processes.
# Nextest bounds individual tests and leaked handles; shared libtest keeps eight
# concurrent threads and a bounded task lifetime, matching hosted CI's cfg.
# Light composition calls heavy runner leaves through a CLI boundary so each
# leaf has its own admitted run and inherits the normal admission marker.
# One nextest invocation uses -j 2 for up to two concurrent per-test processes;
# Per-test timeout and leak controls are unchanged; the environment profile
# gives the complete case matrix its own aggregate budget.
