  "cargo test -p effigy-host-run --lib protocol_tests::attach_recovery_does_not_retry_malformed_protocol -- --exact --nocapture",
]
"check:host-run:compile" = "cargo check -p effigy-host-run -p effigy --lib --bin effigy --test host_scheduler_integration --test cli_output_tests"
# Peer identity refusal on a live private fixture (papercut 8947d524): held
# accepted stream through trust, closed-peer fail-closed distinction, and
# directory/socket mode refusals. Private tempfile only; no live endpoint.
"test:host-run:peer-trust" = [
  "cargo test -p effigy-host-run --lib protocol_tests::authority_and_socket_are_owned_private_and_peer_identity_must_match -- --exact --nocapture",
  "cargo test -p effigy-host-run --lib protocol_tests::valid_peer_identity_is_accepted_on_private_fixture -- --exact --nocapture",
  "cargo test -p effigy-host-run --lib protocol_tests::closed_peer_fails_closed_and_is_not_a_trust_match -- --exact --nocapture",
  "cargo test -p effigy-host-run --lib protocol_tests::unknown_identity_and_legacy_fractional_identity_never_match -- --exact --nocapture",
  "cargo test -p effigy-host-run --lib identity::tests -- --nocapture",
]
"check:host-run:peer-trust" = [
  "cargo check -p effigy-host-run --lib --tests --profile test",
