# Authorized in-place release preparation. Heavy admission wraps the WHOLE
# operation (current-source build, prepared-tree gates, prepared state) before
# any compile or file mutation. The entry point is argv-safe: it fixes the
# subcommand to `release prepare`, rejects `--repo`, enforces `--check-gates`
# for a mutating run, and never forwards execute, resume, tag or publish. It
# mutates this checkout by design, unlike Queue milestone `project.qa.run`,
# which uses a disposable checkout. Ordinary milestone QA stays on Queue.
"release:prepare".admission = "heavy"
"release:prepare".run = "bash scripts/release-prepare.sh {args}"
# The self-hosting install verifier runs from a compatible source build; keep
# its subcommand fixed and admit the complete tagged-source install proof.
"release:verify-install".admission = "heavy"
"release:verify-install".run = "./target/debug/effigy release verify-install {args}"

