# Implicit runtime ignore registration (papercut 082): Git-local
# info/exclude, never working-tree .gitignore. Private fixtures only.
"test:runtime:local-ignores" = [
  "cargo test -p effigy-core --lib runtime_dir:: -- --nocapture",
