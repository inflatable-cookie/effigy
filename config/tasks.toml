"test:gateway:endpoint-daemon-faults" = { durable = true, visibility = "internal", group = "Maintenance", run = [{ run = "sh scripts/oxide-selector.sh nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-gateway --features endpoint-store-faults --lib -E 'test(faults_engine_gateway_endpoint_commit)' --no-capture --retries 0 --no-tests fail", timeout_ms = 600000 }] }
"test:gateway:proxy" = { durable = true, visibility = "internal", group = "Maintenance", run = [{ run = "sh scripts/oxide-selector.sh nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-gateway --features endpoint-store-faults --lib -E 'test(proxy::) | test(registration::) | test(faults_engine_gateway_endpoint_commit)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 900000 }] }
# Gateway routes are withdrawn by checkout path only, and a certificate is a
# cache: a route whose target is briefly down survives past the interval the
# retired dead-route sweep ran on, and the daemon prunes an orphaned
# certificate while keeping a routed one. Disposable private roots only.
"test:gateway:route-survival" = { durable = true, visibility = "internal", group = "Maintenance", run = [
  { id = "route-survival-cert-cache", run = "sh scripts/oxide-selector.sh nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy --test gateway_private --filterset 'test(private_gateway_keeps_a_route_whose_target_is_down) | test(private_gateway_prunes_an_orphan_certificate_and_keeps_a_routed_one)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail -j 1", timeout_ms = 600000 },
] }
# The pinned-build reader proof needs `EFFIGY_PINNED_READER_EFC1478` in the
# operator's environment naming that build's binary. It is `#[ignore]`d so no
# ordinary sweep can pass it vacuously; this selector is the only way to run it.
"proof:gateway:pinned-reader" = { durable = true, visibility = "internal", group = "Maintenance", run = [{ run = "sh scripts/oxide-selector.sh nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy --test gateway_private -E 'test(pinned_reader_reads_a_store_this_build_wrote)' --run-ignored only --no-capture --retries 0 --no-tests fail -j 1", timeout_ms = 600000 }] }
