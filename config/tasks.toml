  { task = "test:architecture:runtime-container-drift-controls" },
  { task = "test:workspace:catalog-handoff" },
  { id = "partial-activation-markers", run = "cargo nextest run --config-file tests/config/deadline-marker-nextest.toml --user-config-file none -p effigy --lib --filterset 'test(container_command::lifecycle::tests::)' --no-capture --no-fail-fast --retries 0 --no-tests fail -j 1", timeout_ms = 600000 },
]
"qa:architecture:runtime-container-drift" = { rhai = "scripts/check-runtime-container-drift.rhai" }
# Private fixture proof of path-scoped allowances and rejected production
# bypasses, including production tokens in the same file as a legitimate
# fixture. Disposable trees only; no live runtime.
"test:architecture:runtime-container-drift-controls" = { rhai = "scripts/check-runtime-container-drift-controls.rhai" }
"test:architecture:compose-backend-identity" = [
  "cargo test -p effigy-runtime --lib container_manager::tests::lifecycle_operation_report_does_not_apply_policy_backend_detection -- --exact --nocapture",
  "cargo test -p effigy --lib runner::execute::pipeline::standard::tests::inline_workspace_started_and_removed_facts_share_compose_plan_backend -- --exact --nocapture",
]
"test:architecture:qa-group-member-cwd" = "cargo test -p effigy --lib runner::qa_group_command::execute::tests::member_request_discovers_from_resolved_root_not_process_cwd -- --exact --nocapture"
"check:architecture:runtime-container-drift" = [
  "cargo check -p effigy-runtime -p effigy --lib --tests --profile test",
  "cargo clippy -p effigy --all-targets -- -D warnings",
]
"qa:architecture:container-exec-readiness" = [
  "cargo test -p effigy-containers status_report_includes_primary_service_exec_ready_state -- --nocapture",
  "cargo test -p effigy-runtime read::tests::primary_service_exec_readiness_ -- --nocapture",
  "cargo test -p effigy exec_readiness_recovery_ -- --nocapture",
]
"qa:architecture" = [
  { task = "qa:kernel-ratchet" },
  { task = "qa:architecture:runtime-container-drift" },
  { task = "qa:architecture:container-exec-readiness" },
]

# CI mirrors and release gates
"qa:released-surface" = "cargo test --test cli_output_tests released_surface_ -- --nocapture"
"qa:ci:fast".admission = "heavy"
"qa:ci:fast".run = [
  "bash -lc 'if cargo nextest --version >/dev/null 2>&1; then cargo nextest run --workspace --no-fail-fast; else echo \"[warn] cargo-nextest not installed; falling back to cargo test --workspace --no-fail-fast\" >&2; cargo test --workspace --no-fail-fast; fi'",
  "cargo test --workspace --doc",
  { task = "qa:released-surface" },
  { task = "qa:ci:json" },
]
"qa:ci:local".admission = "heavy"
"qa:ci:local".run = [
  { task = "fmt:check" },
  "cargo clippy --workspace --all-targets -- -D warnings",
  "bash -lc 'if cargo nextest --version >/dev/null 2>&1; then cargo nextest run --workspace --no-fail-fast; else echo \"[warn] cargo-nextest not installed; falling back to cargo test --workspace --no-fail-fast\" >&2; cargo test --workspace --no-fail-fast; fi'",
  "cargo test --workspace --doc",
  { task = "qa:released-surface" },
  "cargo run --bin effigy -- docs check links",
  { task = "qa:ci:json" },
]
"qa:gates" = [{ task = "qa:docs" }, { task = "qa:json" }, { task = "qa:architecture" }]
"qa:ci" = [
  { task = "qa:docs" },
  { task = "qa:json:ci" },
  { task = "qa:released-surface" },
  { task = "qa:architecture" },
]
"prepush:ci" = [
  { task = "qa:json:ci" },
  "cargo test --test cli_output_tests cli_json_mode",
  "cargo test --lib",
  "cargo test --test cli_output_tests",
  { task = "qa:docs" },
  { task = "qa:architecture" },
]

# Default validation shortcuts
health = [{ task = "fmt:check" }, "cargo check --workspace --locked"]
validate = [{ task = "health" }, "cargo clippy --workspace --all-targets -- -D warnings"]
qa = [{ task = "test" }, { task = "qa:docs" }, { task = "qa:json" }]
