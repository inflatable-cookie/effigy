# Keep built-in `test` canonical so `effigy test --plan` remains available.
# Aggregator tasks below call the built-in through task refs.

[tasks]
# Contributor setup
"bootstrap:local" = [
  { rhai = "scripts/build-local-bin.rhai" },
  { rhai = "scripts/install-local-bin-links.rhai" },
]

# Common local commands
"fmt:check" = "cargo fmt --all -- --check"
"build:release" = "cargo build --release --bin effigy"

# Release and distribution proofs
"smoke:release" = { rhai = "scripts/check-release-smoke.rhai" }
"release:linux:rehearse" = { rhai = "scripts/rehearse-linux-release-container.rhai" }
"workspace:linux:artifact" = { rhai = "scripts/build-linux-workspace-artifact.rhai" }
"dist:preflight:smoke" = "cargo test --test cli_output_tests cli_distribution_artifact_pipeline_smoke_fixture_passes -- --nocapture"
"test:release:macos-checksums" = "bash tests/scripts/release-macos-checksums.sh"

# Container/runtime profiling
"perf:container-shell-matrix" = { rhai = "scripts/profile-container-shell-matrix.rhai" }
"perf:graph-agent-benchmark" = { rhai = "scripts/benchmark-graph-agent-usage.rhai" }
"perf:docs-context-benchmark" = { rhai = "scripts/benchmark-docs-context.rhai" }

# Scoped runtime inventory, participation, backend selection and loopback
"test:containers:scope-lifecycle" = [
  "cargo test -p effigy-containers --lib policy_resolution_does_not_register_an_unactivated_runtime_scope -- --nocapture",
  "cargo test -p effigy --lib retire_of_unactivated_checkout_does_not_create_scope_or_probe_profile -- --nocapture",
  "cargo test -p effigy --lib container_retire_checkout_lookup_preserves_existing_unknown_profile_record -- --nocapture",
  "cargo test -p effigy --lib runtime_start_failure_keeps_scope_record_created_before_start -- --nocapture",
]
"test:containers:retire-selection" = [
  "cargo test -p effigy --lib container_retire -- --nocapture",
  "cargo test -p effigy --lib retirement_clears_qualified_and_owned_legacy_loopbacks_only -- --nocapture",
  "cargo test --test cli_output_tests cli_container_retire_named_environment_refuses_before_effects -- --nocapture",
]
"test:worktree:lifecycle-hooks" = "sh tests/scripts/worktree-lifecycle-hooks.sh"
# Catalog entrypoint behavior: exercises the effigy-entrypoint generated by
# the bundled workspace-rust-bun and php-fpm Dockerfiles in an isolated
# mktemp fixture (no image build, no docker). Non-root cases run as the real
# host user with private unwritable-log fixtures; root-only bridge/trust
# diagnostics are covered on the shared workspace-rust-bun block with a
# simulated root identity. Any skip would mean a papercut 2f1b0df3
# regression and fails the run.
"test:catalog:non-root-entrypoint" = "bash tests/scripts/catalog-non-root-entrypoint.sh"
# Compiled-baseline provenance proof: the committed catalog snapshot and the
# typed lock must agree with each other and with the pinned artifact
# identities (crates/effigy-catalog/src/pack/baseline.rs).
"test:catalog:baseline-lock" = "cargo test -p effigy-catalog --lib committed_snapshot_ -- --nocapture"
"check:containers:scope-compile" = "cargo check -p effigy-containers -p effigy-runtime -p effigy --all-targets"
"check:containers:retire-selection" = [
  "cargo check -p effigy-cli -p effigy --all-targets",
  "cargo clippy -p effigy-cli -p effigy --all-targets -- -D warnings",
]
"test:containers:runtime-inventory" = [
  "cargo test -p effigy-containers inventory_tests:: -- --nocapture",
  "cargo test -p effigy-containers participation::tests:: -- --nocapture",
]
"test:containers:linked-compose" = [
  "cargo test -p effigy-containers --lib linked_worktrees_generate_distinct_compose_resources_and_source_mounts -- --nocapture",
  "cargo test -p effigy-containers --lib linked_worktrees_get_distinct_effective_hosts_and_primary_keeps_declared -- --nocapture",
  "cargo test -p effigy-containers --lib invalid_linked_worktree_admin_directory_is_refused -- --nocapture",
]
"test:containers:loopback" = "cargo test -p effigy-containers runtime::loopback::tests:: -- --nocapture"
"test:containers:loopback-policy" = [
  "cargo test -p effigy-containers loopback_allocator_reclaims_complete_stale_pool_before_exhaustion -- --nocapture",
  "cargo test -p effigy-containers full_pool_with_incomplete_inventory_fails_with_preservation_reason -- --nocapture",
]
"test:containers:backend-selection" = "cargo test -p effigy-containers manager::tests:: -- --nocapture"
# Exact-owned stale nerdctl health-check timer/service recovery: behavioral
# fixtures plus existing restart-recovery cases, then compile the touched crate.
"test:containers:healthcheck-timer" = [
  "cargo test -p effigy-containers --lib healthcheck_timer:: -- --nocapture",
  "cargo test -p effigy-containers --lib restart_recovery:: -- --nocapture",
  "cargo check -p effigy-containers --lib --tests",
]
# Restart-safe proof for the exact-owned health-check unload: a stop/reset that
# exits 0 while the transient pair stays loaded must fail bounded with an exact
# diagnostic, a late unload recovers once, and a running container is never
# mutated or reported as a clean health-check recovery.
"test:containers:healthcheck-unload" = [
  "cargo test -p effigy-containers --lib unload_proof_ -- --nocapture",
  "cargo test -p effigy-containers --lib restart_recovery::tests::pathological_start_fatal -- --nocapture",
  "cargo check -p effigy-containers --lib --tests",
]
"test:gateway:registration-loopback" = "cargo test -p effigy gateway_registration::tests:: -- --nocapture"
"test:container:fake-runtime-lease-isolation" = [
  "cargo test --test cli_output_tests cli_container_data_seed_json_reports_seed_contract -- --nocapture",
  "cargo test --test cli_output_tests cli_container_data_seed_reaper_detector_catches_enabled_control_and_cleans_owned_child -- --nocapture",
  "cargo test --test cli_output_tests cli_workspace_binding_handoff_stops_environment_after_return -- --nocapture",
]

# Bounded QA-group proofs (contract 051 implementation)
"test:qa-groups:manifest" = "cargo test -p effigy-manifest --lib qa_groups -- --nocapture"
"test:qa-groups:surface" = "cargo test -p effigy-tasks --lib qa_groups -- --nocapture"
"test:qa-groups:runtime" = "cargo test -p effigy-runtime --lib qa_group_status -- --nocapture"
"test:qa-groups:identity" = "cargo test -p effigy-process --lib identity -- --nocapture"
"test:qa-groups:cli" = "cargo test --test cli_output_tests qa_groups_tests -- --nocapture"
"test:qa-groups:json-clean" = "cargo test --test cli_output_tests qa_group_json_forms_emit_one_banner_free_document -- --nocapture"
"test:qa-groups:parse" = "cargo test -p effigy --lib qa_group_option_tests -- --nocapture"
"test:cli:command-surface" = "cargo test -p effigy-cli --lib command_surface -- --nocapture"
"test:cli:lock-conflict" = [
  { id = "lock-conflict", run = "cargo test --test cli_output_tests lock_conflict -- --nocapture", timeout_ms = 600000 },
]
"check:cli:lock-conflict" = [
  "cargo check -p effigy --test cli_output_tests --profile test",
  "cargo clippy -p effigy --all-targets -- -D warnings",
]
# In-process sequence and managed-cleanup timeout descendant reap. Private
# tempfile fixtures only; exact recorded PIDs/groups; no process-name kills.
"test:runner:timeout-descendants" = [
  { id = "timeout-descendants", run = "cargo test -p effigy --lib timeout_descendants -- --nocapture", timeout_ms = 240000 },
]
"check:runner:timeout-descendants" = [
  "cargo check -p effigy --all-targets --profile test",
  "cargo clippy -p effigy --all-targets -- -D warnings",
]
"test:init:upstream-guidance" = "cargo test -p effigy --lib init_upstream_guidance -- --nocapture"
"check:init:upstream-guidance" = "cargo check -p effigy-builtin -p effigy --lib --bin effigy --tests"
"test:docs:skill-parity" = "cargo test --test documentation_coverage_tests project_local_and_distributed_effigy_skills_have_semantic_parity -- --nocapture"
# Workspace rust/cache ownership: mount classification, permission prep,
# doctor diagnosis, and the activation routing that must fail closed before
# lease refresh. Includes fake-runtime container data-seed routes that run
# permission prep (numeric id -u/-g probe) before exec. Private fixtures
# only; no live VM/container/cache mutation.
"test:workspace:rust-ownership" = [
  "cargo test -p effigy-containers --lib workspace::ownership -- --nocapture",
  "cargo test -p effigy --lib runner::system_command::workspace_permissions -- --nocapture",
  "cargo test -p effigy --lib workspace_ownership_finding_is_named_and_actionable -- --nocapture",
  "cargo test -p effigy --lib task_activation_surfaces_workspace_permission_failure_before_lease_refresh -- --nocapture",
  "cargo test -p effigy --lib run_command_capture_until -- --nocapture",
  "cargo test -p effigy --lib run_manifest_task_php_app_bundle_defers_inside_container -- --nocapture",
  "cargo test -p effigy --lib run_manifest_task_php_app_bundle_defers_locally_inside_handoff_container -- --nocapture",
  "cargo test -p effigy --lib run_manifest_task_php_app_handoff_local_deferral_prefers_composer_global_bin -- --nocapture",
  "cargo test -p effigy --lib run_manifest_task_php_app_library_bundle_prepares_workspace_permissions_before_exec -- --nocapture",
  "cargo test --test cli_output_tests cli_container_data_seed_json_reports_seed_contract -- --nocapture",
  "cargo test --test cli_output_tests cli_container_data_seed_reaper_detector_catches_enabled_control_and_cleans_owned_child -- --nocapture",
  "cargo test -p effigy-doctor --lib runtime_diagnostics_run_when_budget_already_expired -- --nocapture",
]
# Plain exec workspace prep stays down-stack-safe and batches live checks by
# plan; private in-memory backends only, with no VM or host mount access.
"test:exec:workspace-preparation" = [
  "cargo test -p effigy --lib exec_preparation -- --nocapture",
]
"test:exec:workspace-preparation:bulk-guards" = [
  "cargo test -p effigy --lib bulk_ -- --nocapture",
]
"check:exec:workspace-preparation" = "cargo check -p effigy --lib --tests --profile test"
# Nested host bind mount boundaries and numeric-user access checks. Private
# fixtures only; Effigy does not mutate host bind sources or start a runtime.
"test:workspace:nested-mounts" = [
  { id = "nested-bind-preparation", run = "cargo test -p effigy --lib nested_host_bind -- --nocapture", timeout_ms = 240000 },
  { id = "nested-volume-scope", run = "cargo test -p effigy --lib nested_owned_volume_is_pruned_from_parent_then_repaired_in_its_own_scope -- --nocapture", timeout_ms = 240000 },
  { id = "named-rust-volume-classification", run = "cargo test -p effigy-containers --lib named_cargo_and_target_volumes_are_owned_disposable -- --nocapture", timeout_ms = 240000 },
  { id = "mount-plan-classification", run = "cargo test -p effigy-containers --lib bind_mounted_rust_target_is_verify_only -- --nocapture", timeout_ms = 240000 },
]
"check:workspace:nested-mounts" = [
  "cargo check -p effigy-containers -p effigy --all-targets --profile test",
  # Effigy all-targets includes the changed permission-prep tests. Lint the
  # container library separately; its unrelated existing test lints are noisy.
  "cargo clippy -p effigy --all-targets -- -D warnings",
  "cargo clippy -p effigy-containers --lib -- -D warnings",
]
# Bulk ownership repair (papercut dab293be): O(volumes) runtime round trips
# for owned Rust volumes, deadline/identity/protected-scope failures. Private
# in-memory numeric-user backend only; no live VM/container/chown.
"test:workspace:rust-ownership:bulk" = [
  "cargo test -p effigy --lib runner::system_command::workspace_permissions::tests::bulk -- --nocapture",
  "cargo test -p effigy --lib runner::system_command::workspace_permissions::tests::compose_bulk -- --nocapture",
  # Full-size GNU findutils + native chown + numeric-user proof in a private
  # disposable container (already-running effigy Colima profile, already-local
  # image, no host mounts or network). Fails, never skips, if unavailable.
  "cargo test -p effigy --lib runner::system_command::workspace_permissions::tests::bulk_gnu_container_full_acceptance -- --ignored --nocapture",
]
"check:workspace:rust-ownership:bulk" = [
  "cargo check -p effigy --lib --tests --profile test",
  "cargo clippy -p effigy --lib -- -D warnings",
]
"test:workspace:rust-ownership:fake-runtime-identity" = [
  { id = "php-app-bundle-deferral-fake-runtime", run = "cargo test -p effigy --lib run_manifest_task_php_app_bundle_defers -- --nocapture", timeout_ms = 240000 },
  { id = "php-app-library-bundle-fake-runtime", run = "cargo test -p effigy --lib run_manifest_task_php_app_library_bundle_prepares_workspace_permissions_before_exec -- --nocapture", timeout_ms = 240000 },
]
# Deadline/reap proof uses only a fresh private temp root, a fake Docker command,
# and exact fixture PIDs. Includes the expired-no-spawn and disabled-reap controls.
"test:workspace:rust-ownership:bulk-deadline" = [
  "cargo test -p effigy --lib bulk_production_constructor -- --nocapture",
]
"check:workspace:rust-ownership:bulk-deadline" = [
  "cargo clippy -p effigy --all-targets -- -D warnings",
]
"check:workspace:rust-ownership" = [
  "cargo check -p effigy-containers -p effigy --lib --tests --bins --profile test",
  "cargo clippy -p effigy-containers -p effigy-doctor -p effigy --lib -- -D warnings",
]

# Preliminary doctor container-liveness probes (papercut effigy#074). Private
# fresh-root fixtures with a fake `colima` on PATH prove the shared monotonic
# deadline: expired never spawns, a hung Colima/compose-ps probe dies at the
# deadline and reaps only its recorded process group, the
# running/stopped/unavailable distinction survives, and the ownership probe
# shares one budget instead of getting a fresh one per subprocess.
"test:doctor:workspace-liveness" = [
  "cargo test -p effigy --lib runner::doctor_ports::tests -- --nocapture",
]
"test:doctor:ownership-latency" = [
  "cargo test -p effigy --lib runner::doctor_ports::tests::healthy_named_volume_ownership_batches_probes_within_doctor_budget -- --exact --nocapture",
  "cargo test -p effigy --lib runner::doctor_ports::tests::named_volume_batch_keeps_wrong_permissions_as_path_specific_finding -- --exact --nocapture",
  "cargo test -p effigy --lib runner::doctor_ports::tests::doctor_batches_keep_bind_and_shared_volumes_verify_only -- --exact --nocapture",
  "cargo test -p effigy --lib runner::doctor_ports::tests::expired_ownership_deadline_does_not_spawn_identity_probe -- --exact --nocapture",
  "cargo test -p effigy --lib runner::doctor_ports::tests::hung_ownership_batch_is_bounded_and_reaps_its_process_group -- --exact --nocapture",
  "cargo test -p effigy --lib runner::system_command::workspace_permissions::tests::doctor -- --nocapture",
]
# Doctor hung workspace-ownership batch proof (papercut d773ae06). Private
# fake-runtime fixture only: the metadata batch must record its own leader and
# descendant before the proof judges the hang, order a controlled hung
# preflight so it reports only its own unavailable context with no metadata
# reap claim, and cover a timeout/reap-disabled negative control whose oracle
# must fail before a private guard reaps the recorded owned child. No
# production budget, readiness, or incomplete semantics change.
"test:doctor:ownership-hang" = [
  "cargo test -p effigy --lib runner::doctor_ports::tests::hung_ownership_batch_is_bounded_and_reaps_its_process_group -- --exact --nocapture",
  "cargo test -p effigy --lib runner::doctor_ports::tests::ownership_preflight_hang_is_unavailable_without_metadata_reap_claim -- --exact --nocapture",
  "cargo test -p effigy --lib runner::doctor_ports::tests::ownership_hang_reap_oracle_fails_when_runtime_reap_is_disabled -- --exact --nocapture",
]
"check:doctor:ownership-latency" = "cargo check -p effigy-containers -p effigy-doctor -p effigy --lib --tests --bins --profile test"
"check:doctor:workspace-liveness" = [
  "cargo check -p effigy-containers -p effigy-doctor -p effigy --lib --tests --bins --profile test",
  "cargo clippy -p effigy-containers -p effigy-doctor -p effigy --lib -- -D warnings",
]
# Deterministic doctor behavior fixtures (papercut 4ee28d2c). The four
# behavior oracles and the model deadline controls run through the production
# orchestration, argv construction and parsers with zero real subprocess
# launches; the negative controls keep each oracle non-vacuous; and a bounded
# private fake runtime crosschecks received argv/parse for the same workload.
"test:doctor:fixture-contract" = [
  "cargo test -p effigy --lib runner::doctor_ports::tests::fixture_contract -- --nocapture",
  "cargo test -p effigy --lib runner::doctor_ports::tests::healthy_named_volume_ownership_batches_probes_within_doctor_budget -- --exact --nocapture",
  "cargo test -p effigy --lib runner::doctor_ports::tests::named_volume_batch_keeps_wrong_permissions_as_path_specific_finding -- --exact --nocapture",
  "cargo test -p effigy --lib runner::doctor_ports::tests::doctor_batches_keep_bind_and_shared_volumes_verify_only -- --exact --nocapture",
  "cargo test -p effigy --lib runner::doctor_ports::tests::successful_and_stopped_liveness_distinctions_survive_a_deadline -- --exact --nocapture",
]
# CI-equivalent lint coverage for the touched doctor fixture targets. The
# hosted `cargo clippy --all-targets -- -D warnings` lints the root `effigy`
# package's test targets too, so this selector matches that scope instead of
# linting only the lib.
"check:doctor:fixture-contract" = [
  "cargo clippy --all-targets -- -D warnings",
]

# Rhai storage retirement (contract 043): negative proofs that the removed
# surface stays absent and neighbouring modules still work.
"test:rhai:storage-retirement" = "cargo test -p effigy-rhai --lib storage_retirement -- --nocapture"
"check:rhai:storage-retirement" = "cargo check -p effigy-rhai -p effigy --lib --bin effigy"

# Rhai copy_if_missing atomic publication (contract 050): concurrent winners,
# occupied entries, independent copy, and failure cleanup. Compile the
# touched crate's lib/tests, then lint all of its targets.
"test:rhai:copy-if-missing" = "cargo test -p effigy-rhai --lib copy_if_missing -- --nocapture"
"check:rhai:copy-if-missing" = [
  "cargo check -p effigy-rhai --lib --tests --profile test",
  "cargo clippy -p effigy-rhai --all-targets -- -D warnings",
]

