# Pure discovery and pinned executable-source acquisition (contract 052 R2).
# Cargo local-link lockfile workflows: link-owned lock resolution, the
# recorded clean baseline, committed-pin advances, and unlink restoration.
# Focused Rust test runs keep Cargo.lock read-only: evidence collection must
# not rewrite a source-linked consumer lockfile. Pass the usual scope and
# filter, for example `effigy test:focused -p effigy-deps --lib -E 'test(x)'`.
