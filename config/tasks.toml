"test:catalog:baseline-lock" = [
  { id = "catalog-baseline-lock", run = "cargo test -p effigy-catalog --lib committed_snapshot_ -- --nocapture", timeout_ms = 600000 },
]
"check:catalog:baseline" = [
  "cargo check -p effigy-catalog --all-targets",
  "cargo clippy -p effigy-catalog --all-targets -- -D warnings",
]
"check:containers:scope-compile" = [
  "cargo check -p effigy-containers -p effigy-runtime -p effigy-managed -p effigy --all-targets",
  "cargo clippy -p effigy-containers -p effigy-runtime -p effigy-managed -p effigy --all-targets -- -D warnings",
]
"check:containers:retire-selection" = [
  "cargo check -p effigy-cli -p effigy --all-targets",
  "cargo clippy -p effigy-cli -p effigy --all-targets -- -D warnings",
]
"test:containers:runtime-inventory" = [
  "cargo test -p effigy-containers inventory_tests:: -- --nocapture",
  "cargo test -p effigy-containers participation::tests:: -- --nocapture",
]
"test:containers:linked-compose" = [
  "cargo test -p effigy-containers --lib linked_worktrees_generate_distinct_compose_resources_and_source_mounts -- --nocapture",
  "cargo test -p effigy-containers --lib linked_worktrees_get_distinct_effective_hosts_and_primary_keeps_declared -- --nocapture",
  "cargo test -p effigy-containers --lib invalid_linked_worktree_admin_directory_is_refused -- --nocapture",
]
"test:containers:data-from" = [
  { run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-manifest --lib --filterset 'test(container_data_from)' --no-capture --no-fail-fast --retries 0 --no-tests fail -j 1", timeout_ms = 600000 },
  { run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-doctor --lib --filterset 'test(validate_manifest_schema_accepts_container_data_from)' --no-capture --no-fail-fast --retries 0 --no-tests fail -j 1", timeout_ms = 600000 },
  { run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-containers --lib --filterset 'test(tests::data_from) | test(policy::data_from)' --no-capture --no-fail-fast --retries 0 --no-tests fail -j 1", timeout_ms = 600000 },
]
# Detached-activation admission over the runtime Compose inputs: the strict
# publication verify reads the per-environment generated payload, workspace,
# ownership and DNS overrides while concurrent policy resolutions rewrite
# them, so replacement stays atomic and every read sees one complete
# generation. Covers the #197 publication-refusal regression seam.
"test:containers:detached-admission" = [
  "cargo test -p effigy --lib host_container_lease::tests:: -- --nocapture",
  "cargo test -p effigy-containers --lib runtime::dns::tests:: -- --nocapture",
]
"test:containers:loopback" = "cargo test -p effigy-containers runtime::loopback::tests:: -- --nocapture"
