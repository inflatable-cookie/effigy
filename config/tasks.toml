# reclaim in a private registry, status/dry-run non-mutation, digest-confirmed
# locked apply, retirement releasing only its own allocation in the isolated
# home, and CLI parsing of the supported surface.
"test:containers:port-registry-recovery" = [
  { id = "port-registry-recovery-containers", run = "cargo test -p effigy-containers --lib port_recovery:: -- --nocapture", timeout_ms = 600000 },
  { id = "port-registry-recovery-gateway", run = "cargo test -p effigy-gateway --lib ports:: -- --nocapture", timeout_ms = 240000 },
  { id = "port-registry-recovery-retire", run = "cargo test -p effigy --lib retirement_releases_only_the_scope_port_allocation -- --nocapture", timeout_ms = 240000 },
  { id = "port-registry-recovery-cli", run = "cargo test -p effigy-cli --lib ports_ -- --nocapture", timeout_ms = 240000 },
]
"check:containers:port-registry-recovery" = [
  "cargo check -p effigy-gateway -p effigy-containers -p effigy-cli -p effigy --all-targets",
  "cargo clippy -p effigy-gateway -p effigy-containers -p effigy-cli -p effigy --all-targets -- -D warnings",
]
"test:containers:loopback-policy" = [
  "cargo test -p effigy-containers loopback_allocator_reclaims_complete_stale_pool_before_exhaustion -- --nocapture",
  "cargo test -p effigy-containers full_pool_with_incomplete_inventory_fails_with_preservation_reason -- --nocapture",
]
"test:containers:backend-selection" = "cargo test -p effigy-containers manager::tests:: -- --nocapture"
# Exact-owned stale nerdctl health-check timer/service recovery: behavioral
# fixtures plus existing restart-recovery cases, then compile the touched crate.
"test:containers:healthcheck-timer" = [
  { id = "healthcheck-timer-private", run = "cargo nextest run --config-file tests/config/deadline-marker-nextest.toml --user-config-file none -p effigy-containers --lib --filterset 'test(healthcheck_timer::) | test(restart_recovery::)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail -j 1", timeout_ms = 600000 },
  "cargo check -p effigy-containers --lib --tests",
]
# Restart-safe proof for the exact-owned health-check unload: a stop/reset that
# exits 0 while the transient pair stays loaded must fail bounded with an exact
# diagnostic, a late unload recovers once, and a running container is never
# mutated or reported as a clean health-check recovery.
"test:containers:healthcheck-unload" = [
  { id = "healthcheck-unload-private", run = "cargo nextest run --config-file tests/config/deadline-marker-nextest.toml --user-config-file none -p effigy-containers --lib --filterset 'test(unload_proof_) | test(restart_recovery::tests::pathological_start_fatal)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail -j 1", timeout_ms = 600000 },
  "cargo check -p effigy-containers --lib --tests",
]
"test:gateway:registration-loopback" = [
  { id = "gateway-registration-loopback", run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy --lib --filterset 'test(gateway_registration::tests::)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail -j 1", timeout_ms = 600000 },
]
# Partial scoped bring-up: a failed route registration after `compose up` keeps
# a detached scope running with an explicit partial result and a reconcile
# mark; a re-run with a running primary skips `compose up`. Attached bring-up
# keeps its teardown. Reuses the registration-loopback family.
"test:containers:activation-compatibility" = [
  { task = "test:containers:activation-compatibility:runner" },
  { task = "test:containers:activation-compatibility:cli" },
]
"test:containers:activation-compatibility:runner" = [
  { id = "activation-deferral-context", run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy --lib --filterset 'test(deferral_tests::token_and_implicit_tests::run_manifest_task_php_app)' --no-capture --no-fail-fast --retries 0 --no-tests fail -j 1", timeout_ms = 600000 },
