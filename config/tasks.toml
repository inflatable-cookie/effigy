# Caller deadline continuity through Colima service discovery and container
# capture (task effigy#093). Private fake-runtime fixtures plus one controlled
# spawn-delay seam prove the caller's absolute deadline is not rebased, an
# expired deadline never spawns, a hung discovery is bounded and reaped by its
# own process group, and cache hits still skip discovery. Real process
# supervision is retained; no live runtime, VM or container is touched.
"test:runtime:deadline-continuity" = [
  { id = "containers-absolute-deadline", run = "cargo test -p effigy-containers --lib exec::process::tests -- --nocapture", timeout_ms = 300000 },
  { id = "colima-discovery-deadline", run = "cargo test -p effigy --lib runner::exec_command::transport::colima::tests -- --nocapture", timeout_ms = 300000 },
]
"check:runtime:deadline-continuity" = [
  "cargo check -p effigy-containers -p effigy --all-targets --profile test",
  # Match the existing selector convention: the root package is linted with
  # `--all-targets`, while effigy-containers is linted `--lib` because its
  # unrelated pre-existing test-target lints are noisy.
  "cargo clippy -p effigy-containers --lib -- -D warnings",
  "cargo clippy --all-targets -- -D warnings",
]
# Env-isolation regressions (papercut batch 067): parallel process-env
# readers and writers. Build-identity readers take injected values and the
# runner's remaining global writers share one proved boundary.
"test:env-isolation:build-info" = "cargo test -p effigy-core --lib build_info::tests::env_isolation -- --nocapture"
"test:env-isolation:runner" = [
  "cargo test -p effigy --lib runner::tests::env_isolation_tests -- --nocapture",
  "cargo test -p effigy --lib stay_in_shell -- --nocapture",
  "cargo test -p effigy --lib deferral::policy -- --nocapture",
]
"check:env-isolation" = "cargo check -p effigy-core -p effigy --lib --profile test"

# Scheduler routing: unit decisions plus the private Queue-server proofs. The
# private-server cases require EFFIGY_HOST_RUN_PRIVATE_SERVER to name an
# isolated Queue checkout at e9e4d12 or a verified descendant; they never touch
# a live endpoint. Restart/roll cases pin Queue152 merge f53a9d0. Cases using a
# private fixture are ignored by ordinary test runners; this selector includes
# them and sets the required-fixture gate so a missing server fails instead of
# silently skipping proofs. The separate protocol selector covers the client
# crate.
"test:host-run:env-projection" = "cargo test -p effigy --lib host_scheduler::tests::submitted_environment_ -- --nocapture"
"test:host-run:integration" = [
  "cargo test -p effigy --lib host_scheduler:: -- --nocapture",
  "cargo test -p effigy --lib container_command::shell_prep::tests::scheduler_tokens_are_not_forwarded_to_container_exec -- --nocapture",
  "cargo test -p effigy --lib host_scheduler::tests::owned_children_scope_forwards_termination_only_to_registered_groups -- --nocapture",
  "cargo test -p effigy --lib container_removal_state -- --nocapture",
  "EFFIGY_REQUIRE_HOST_RUN_PRIVATE_SERVER=1 cargo test --test host_scheduler_integration -- --include-ignored --nocapture --test-threads=1",
]
# Exact Queue152 follower restart and cancellation acceptance. The caller must
# provide EFFIGY_HOST_RUN_PRIVATE_SERVER pointing at the clean reviewed f53a9d0
# checkout; required-fixture mode prevents either ignored case from skipping.
"test:host-run:idle-follow:restart" = [
  "EFFIGY_REQUIRE_HOST_RUN_PRIVATE_SERVER=1 cargo test --test host_scheduler_integration real_effigy_follower_recovers_across_five_queue152_supervisor_rolls -- --include-ignored --nocapture --test-threads=1",
  "EFFIGY_REQUIRE_HOST_RUN_PRIVATE_SERVER=1 cargo test --test host_scheduler_integration real_effigy_sigterm_cancels_during_queue152_supervisor_roll -- --include-ignored --nocapture --test-threads=1",
]

# Owned-child termination proof (papercut 075): the real scope must terminate a
# registered child before any cleanup, and a controlled negative seam must show
# the oracle fails when forwarding is disabled while unconditional exact-owned
# cleanup still reaps both test-created children.
"test:host-run:termination-proof" = [
  "cargo test -p effigy --lib host_scheduler::tests::owned_children_scope_forwards_termination_only_to_registered_groups -- --nocapture",
  "cargo test -p effigy --lib host_scheduler::tests::owned_children_termination_oracle_fails_when_forwarding_is_disabled -- --nocapture",
]

# Documentation QA
"qa:docs:links" = "cargo run --bin effigy -- docs check links"
"qa:docs:examples" = "cargo run --bin effigy -- docs check json-examples"
"qa:docs:agent-defaults" = "cargo run --bin effigy -- docs check forbidden AGENTS.md .github/workflows/json-contracts.yml docs/knowledge/contracts/json-selection-contract.json --forbid '--repo .'"
"qa:docs:knowledge" = [
  "cargo run --bin effigy -- docs check paths README.md AGENTS.md docs/README.md docs/knowledge/README.md docs/knowledge/vision.md docs/knowledge/architecture.md docs/knowledge/contracts/README.md docs/knowledge/contracts/release.md docs/knowledge/retired.toml docs/knowledge/questions.md",
  "cargo run --bin effigy -- docs check workflow-paths",
]
# The changelog is documentation: validate its release headings with the same
# parser `release status` uses, so an em-dash separator fails both surfaces.
"qa:docs:changelog" = "cargo run --bin effigy -- changelog validate CHANGELOG.md"
"qa:docs" = [
  { task = "qa:docs:links" },
  { task = "qa:docs:examples" },
  { task = "qa:docs:agent-defaults" },
  { task = "qa:docs:knowledge" },
  { task = "qa:docs:changelog" },
]

