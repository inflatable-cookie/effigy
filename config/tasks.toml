# Keep built-in `test` canonical so `effigy test --plan` remains available.

# Aggregator tasks below call the built-in through task refs.

[tasks]
# Every selector that runs Cargo goes through `scripts/oxide-selector.sh`, which
# leases Oxide's shared slot pool and keeps Rust intermediates off the internal
# SSD. Its one escape is `EFFIGY_OXIDE_ESCAPE=cargo effigy <selector>`, which
# runs that selector's Cargo command exactly as written.
"test:gateway:closeout:operator" = { durable = true, visibility = "internal", group = "Maintenance", run = [{ task = "test:gateway:closeout:ci" }, { task = "test:gateway:operator" }, { task = "test:gateway:operator:process" }] }
"qa:gateway:closeout" = { visibility = "internal", group = "Maintenance", run = [{ task = "fmt:check" }, { task = "lint:gateway:closeout" }, { task = "qa:kernel-ratchet" }] }
"test:gateway:closeout:runtime" = { durable = true, visibility = "internal", group = "Maintenance", run = [{ task = "test:gateway:closeout:ci" }, { task = "test:gateway:closeout:kernel" }, { task = "test:gateway:operator:process" }, { task = "test:kernel:custody" }] }
"lint:gateway:closeout" = { visibility = "internal", group = "Maintenance", run = [{ run = "sh scripts/oxide-selector.sh clippy -p effigy -p effigy-gateway -p effigy-kernel --all-targets --features effigy-gateway/endpoint-store-faults -- -D warnings", timeout_ms = 900000 }] }
"test:gateway:closeout:kernel" = { durable = true, visibility = "internal", group = "Maintenance", run = [{ run = "sh scripts/oxide-selector.sh nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-kernel --lib -E 'test(client_order_tests::)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 600000 }] }
