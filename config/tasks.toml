# Keep built-in `test` canonical so `effigy test --plan` remains available.
# Aggregator tasks below call the built-in through task refs.

[tasks]
# Contributor setup
"bootstrap:local" = [
  { rhai = "scripts/build-local-bin.rhai" },
  { rhai = "scripts/install-local-bin-links.rhai" },
]

# Common local commands
"fmt:check" = "cargo fmt --all -- --check"
"fmt:apply" = "cargo fmt --all"
"build:release" = "cargo build --release --bin effigy"

# All maintained JSON contract rows and their authority/ownership controls.
"test:audit:contracts" = [
  "cargo test -p effigy-contracts --lib -- --nocapture",
  "cargo test --test cli_output_tests cli_contracts_ -- --nocapture",
  { task = "test:audit:contracts:parent" },
]
"test:audit:contracts:parent" = [
  { id = "contract-private-parent", run = "bash tests/scripts/fixture-parent-isolation.sh contracts", timeout_ms = 600000 },
]
"test:audit:contracts:runner".admission = "heavy"
"test:audit:contracts:runner".run = "python3 tests/scripts/contract-fixture-checks.py ./target/debug/effigy {args}"
"check:audit:contracts" = [
  { task = "fmt:check" },
  "cargo check -p effigy-contracts -p effigy --all-targets --profile test",
]
"lint:audit:contracts" = "cargo clippy -p effigy-contracts -p effigy --all-targets -- -D warnings"
"fmt:audit:contracts" = "rustfmt --edition 2021 crates/effigy-contracts/src/lib.rs crates/effigy-contracts/src/tests.rs tests/host_scheduler_integration.rs"

# All consumers of the maintained YAML compatibility backend; no live systems.
"check:audit:yaml" = [
  { task = "fmt:check" },
  "cargo check -p effigy -p effigy-catalog -p effigy-containers -p effigy-doctor -p effigy-rhai -p effigy-runtime --all-targets --profile test",
]
"lint:audit:yaml" = "cargo clippy -p effigy -p effigy-catalog -p effigy-containers -p effigy-doctor -p effigy-rhai -p effigy-runtime --all-targets -- -D warnings"
"test:audit:yaml" = [
  "cargo test -p effigy-catalog -- --nocapture",
  "cargo test -p effigy-containers --lib -- --nocapture",
  "cargo test -p effigy-doctor --lib health::bootstrap:: -- --nocapture",
  "cargo test -p effigy-rhai --lib tests::utility:: -- --nocapture",
  "cargo test -p effigy-runtime --lib write::planning:: -- --nocapture",
  "cargo test -p effigy --lib container_runtime_prep::tests:: -- --nocapture",
  "cargo test -p effigy --lib gateway_registration -- --nocapture",
  "cargo test -p effigy --lib container_command::lifecycle -- --nocapture",
]

# Managed TUI startup must render and remain cancellable while ordered child
# startup delays are still pending. The PTY test follows the production path.
"test:tui:startup-visibility" = [
  { id = "tui-startup-visibility", run = "cargo test -p effigy-tui --lib multiprocess::startup_visibility::managed_tui_startup_visibility_production_pty -- --nocapture", timeout_ms = 240000 },
]
"check:tui:startup-visibility" = [
  "cargo check -p effigy-process -p effigy-tui --all-targets --profile test",
  "cargo clippy -p effigy-process -p effigy-tui --all-targets -- -D warnings",
]

# Release and distribution proofs
"smoke:release" = { rhai = "scripts/check-release-smoke.rhai" }
"release:linux:rehearse" = { rhai = "scripts/rehearse-linux-release-container.rhai" }
"workspace:linux:artifact" = { rhai = "scripts/build-linux-workspace-artifact.rhai" }
"dist:preflight:smoke" = "cargo test --test cli_output_tests cli_distribution_artifact_pipeline_smoke_fixture_passes -- --nocapture"
"test:release:macos-checksums" = "bash tests/scripts/release-macos-checksums.sh"

# Authorized in-place release preparation. Heavy admission wraps the WHOLE
# operation (current-source build, prepared-tree gates, prepared state) before
# any compile or file mutation. The entry point is argv-safe: it fixes the
# subcommand to `release prepare`, rejects `--repo`, enforces `--check-gates`
# for a mutating run, and never forwards execute, resume, tag or publish. It
# mutates this checkout by design, unlike Queue milestone `project.qa.run`,
# which uses a disposable checkout. Ordinary milestone QA stays on Queue.
"release:prepare".admission = "heavy"
"release:prepare".run = "bash scripts/release-prepare.sh {args}"
# The self-hosting install verifier runs from a compatible source build; keep
# its subcommand fixed and admit the complete tagged-source install proof.
"release:verify-install".admission = "heavy"
"release:verify-install".run = "./target/debug/effigy release verify-install {args}"
# Private fixture proof of heavy admission and argv safety. No build, no live
# scheduler: a recording `cargo` stub in a disposable git fixture.
"test:release:preparation-admission" = "bash tests/scripts/release-preparation-admission.sh"
# No compiled target is touched by the selector; validate the entry points.
"check:release:preparation-admission" = [
  "bash -n scripts/release-prepare.sh",
  "bash -n tests/scripts/release-preparation-admission.sh",
]

# Container/runtime profiling
"perf:container-shell-matrix" = { rhai = "scripts/profile-container-shell-matrix.rhai" }
"perf:graph-agent-benchmark" = { rhai = "scripts/benchmark-graph-agent-usage.rhai" }
"perf:docs-context-benchmark" = { rhai = "scripts/benchmark-docs-context.rhai" }

# Scoped runtime inventory, participation, backend selection and loopback
"test:containers:scope-lifecycle" = [
  "cargo test -p effigy-containers --lib policy_resolution_does_not_register_an_unactivated_runtime_scope -- --nocapture",
  "cargo test -p effigy --lib retire_of_unactivated_checkout_does_not_create_scope_or_probe_profile -- --nocapture",
  "cargo test -p effigy --lib container_retire_checkout_lookup_preserves_existing_unknown_profile_record -- --nocapture",
  "cargo test -p effigy --lib runtime_start_failure_keeps_scope_record_created_before_start -- --nocapture",
]
"test:containers:retire-selection" = [
  "cargo test -p effigy --lib container_retire -- --nocapture",
  "cargo test -p effigy --lib retirement_clears_qualified_and_owned_legacy_loopbacks_only -- --nocapture",
  "cargo test --test cli_output_tests cli_container_retire_named_environment_refuses_before_effects -- --nocapture",
]
"test:worktree:lifecycle-hooks" = "sh tests/scripts/worktree-lifecycle-hooks.sh"
# Catalog entrypoint behavior: exercises the effigy-entrypoint generated by
# the bundled workspace-rust-bun and php-fpm Dockerfiles in an isolated
# mktemp fixture (no image build, no docker). Non-root cases run as the real
# host user with private unwritable-log fixtures; root-only bridge/trust
# diagnostics are covered on the shared workspace-rust-bun block with a
# simulated root identity. Any skip would mean a papercut 2f1b0df3
# regression and fails the run.
"test:catalog:non-root-entrypoint" = "bash tests/scripts/catalog-non-root-entrypoint.sh"
# Compiled-baseline provenance proof: the committed catalog snapshot and the
# typed lock must agree with each other and with the pinned artifact
# identities (crates/effigy-catalog/src/pack/baseline.rs).
"test:catalog:baseline-lock" = [
  { id = "catalog-baseline-lock", run = "cargo test -p effigy-catalog --lib committed_snapshot_ -- --nocapture", timeout_ms = 600000 },
]
"check:catalog:baseline" = [
  "cargo check -p effigy-catalog --all-targets",
  "cargo clippy -p effigy-catalog --all-targets -- -D warnings",
]
"check:containers:scope-compile" = "cargo check -p effigy-containers -p effigy-runtime -p effigy --all-targets"
"check:containers:retire-selection" = [
  "cargo check -p effigy-cli -p effigy --all-targets",
  "cargo clippy -p effigy-cli -p effigy --all-targets -- -D warnings",
]
"test:containers:runtime-inventory" = [
  "cargo test -p effigy-containers inventory_tests:: -- --nocapture",
  "cargo test -p effigy-containers participation::tests:: -- --nocapture",
]
"test:containers:linked-compose" = [
  "cargo test -p effigy-containers --lib linked_worktrees_generate_distinct_compose_resources_and_source_mounts -- --nocapture",
  "cargo test -p effigy-containers --lib linked_worktrees_get_distinct_effective_hosts_and_primary_keeps_declared -- --nocapture",
  "cargo test -p effigy-containers --lib invalid_linked_worktree_admin_directory_is_refused -- --nocapture",
]
"test:containers:loopback" = "cargo test -p effigy-containers runtime::loopback::tests:: -- --nocapture"
# Machine-wide generated-container port registry recovery: exhaustion and
# reclaim in a private registry, status/dry-run non-mutation, digest-confirmed
# locked apply, retirement releasing only its own allocation in the isolated
# home, and CLI parsing of the supported surface.
"test:containers:port-registry-recovery" = [
  { id = "port-registry-recovery-containers", run = "cargo test -p effigy-containers --lib port_recovery:: -- --nocapture", timeout_ms = 600000 },
  { id = "port-registry-recovery-gateway", run = "cargo test -p effigy-gateway --lib ports:: -- --nocapture", timeout_ms = 240000 },
  { id = "port-registry-recovery-retire", run = "cargo test -p effigy --lib retirement_releases_only_the_scope_port_allocation -- --nocapture", timeout_ms = 240000 },
  { id = "port-registry-recovery-cli", run = "cargo test -p effigy-cli --lib ports_ -- --nocapture", timeout_ms = 240000 },
]
"check:containers:port-registry-recovery" = [
  "cargo check -p effigy-gateway -p effigy-containers -p effigy-cli -p effigy --all-targets",
  "cargo clippy -p effigy-gateway -p effigy-containers -p effigy-cli -p effigy --all-targets -- -D warnings",
]
"test:containers:loopback-policy" = [
  "cargo test -p effigy-containers loopback_allocator_reclaims_complete_stale_pool_before_exhaustion -- --nocapture",
  "cargo test -p effigy-containers full_pool_with_incomplete_inventory_fails_with_preservation_reason -- --nocapture",
]
"test:containers:backend-selection" = "cargo test -p effigy-containers manager::tests:: -- --nocapture"
# Exact-owned stale nerdctl health-check timer/service recovery: behavioral
# fixtures plus existing restart-recovery cases, then compile the touched crate.
"test:containers:healthcheck-timer" = [
  "cargo test -p effigy-containers --lib healthcheck_timer:: -- --nocapture",
  "cargo test -p effigy-containers --lib restart_recovery:: -- --nocapture",
  "cargo check -p effigy-containers --lib --tests",
]
# Restart-safe proof for the exact-owned health-check unload: a stop/reset that
# exits 0 while the transient pair stays loaded must fail bounded with an exact
# diagnostic, a late unload recovers once, and a running container is never
# mutated or reported as a clean health-check recovery.
"test:containers:healthcheck-unload" = [
  "cargo test -p effigy-containers --lib unload_proof_ -- --nocapture",
  "cargo test -p effigy-containers --lib restart_recovery::tests::pathological_start_fatal -- --nocapture",
  "cargo check -p effigy-containers --lib --tests",
]
"test:gateway:registration-loopback" = "cargo test -p effigy gateway_registration::tests:: -- --nocapture"
"test:gateway:pid-domain" = [
  { id = "gateway-pid-domain", run = "cargo test -p effigy-gateway -p effigy --lib pid_domain -- --nocapture", timeout_ms = 240000 },
]
"check:gateway:pid-domain" = [
  "cargo check -p effigy-gateway -p effigy --all-targets",
  "cargo clippy -p effigy-gateway -p effigy --all-targets -- -D warnings",
]
# Gateway process probe state: a failed or ambiguous `ps` probe is `Unknown`,
# never `ConfirmedAbsent`, so lifecycle (status/up/down/start/stop) cannot
# report a false stop, delete PID/version records, or start a replacement.
"test:gateway:probe-state" = [
  { id = "gateway-probe-state", run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-gateway -p effigy --lib --filterset 'test(probe_state)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail -j 1", timeout_ms = 240000 },
]
"check:gateway:probe-state" = [
  "cargo check -p effigy-gateway -p effigy --all-targets",
  "cargo clippy -p effigy-gateway -p effigy --all-targets -- -D warnings",
]
"test:gateway:private" = [
  { id = "gateway-private-state-startup", run = "cargo test -p effigy-gateway --lib private_ -- --nocapture --test-threads=1", timeout_ms = 240000 },
  { id = "gateway-private-tls", run = "cargo test -p effigy-gateway --lib tls::tests:: -- --nocapture --test-threads=1", timeout_ms = 240000 },
  { id = "gateway-private-container-propagation", run = "cargo test -p effigy-containers private_gateway_does_not_resolve -- --nocapture --test-threads=1", timeout_ms = 240000 },
  { id = "gateway-private-runner-policy", run = "cargo test -p effigy --lib private_gateway -- --nocapture --test-threads=1", timeout_ms = 240000 },
  { id = "gateway-private-cli-parse", run = "cargo test -p effigy --lib parse_gateway -- --nocapture --test-threads=1", timeout_ms = 240000 },
]
"proof:gateway:private" = [
  { id = "gateway-private-cli-https", run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy --test gateway_private --filterset 'test(private_gateway_cli_serves_verified_https_and_isolates_concurrent_instances)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail -j 1", timeout_ms = 600000 },
]

# Real production-path TERM/INT handling after private HTTP readiness, including
# a daemon that inherits SIGTERM ignored. The test signals and reaps only its
# owned process and checks route and foreign-listener isolation.
"proof:gateway:shutdown" = [
  { id = "gateway-graceful-shutdown", run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy --test gateway_private --filterset 'test(private_gateway_shutdown_handles_owned_term_int_and_inherited_ignore)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail -j 1", timeout_ms = 180000 },
]

# Managed host listener ownership, readiness, route generations, dependency
# URL propagation, and exact scoped teardown. Nextest gives each test a slow
# timeout with forced termination and a bounded overall run time.
"test:managed:host-listeners" = [
  { id = "managed-host-listener-manifest", run = "cargo nextest run --config-file tests/config/managed-host-listeners-nextest.toml --user-config-file none -p effigy-manifest --lib --filterset 'test(managed_host_listener_)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail", timeout_ms = 600000 },
  { id = "managed-host-listener-process", run = "cargo nextest run --config-file tests/config/managed-host-listeners-nextest.toml --user-config-file none -p effigy-process --lib --filterset 'test(identity)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail", timeout_ms = 600000 },
  { id = "managed-host-listener-registration", run = "cargo nextest run --config-file tests/config/managed-host-listeners-nextest.toml --user-config-file none -p effigy-gateway --lib --filterset 'test(managed_listener_routes_require_exact_generation_and_block_static_replacement)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail", timeout_ms = 600000 },
  { id = "managed-host-listener-gateway-registration", run = "cargo nextest run --config-file tests/config/managed-host-listeners-nextest.toml --user-config-file none -p effigy-gateway --lib --filterset 'test(registration)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail", timeout_ms = 600000 },
  { id = "managed-host-listener-runner-registration", run = "cargo nextest run --config-file tests/config/managed-host-listeners-nextest.toml --user-config-file none -p effigy --lib --filterset 'test(gateway_registration)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail", timeout_ms = 600000 },
  { id = "managed-host-listener-proxy", run = "cargo nextest run --config-file tests/config/managed-host-listeners-nextest.toml --user-config-file none -p effigy-gateway --lib --filterset 'test(proxy)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail", timeout_ms = 600000 },
  { id = "managed-host-listener-supervisor", run = "cargo nextest run --config-file tests/config/managed-host-listeners-nextest.toml --user-config-file none -p effigy --lib --filterset 'test(host_process)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail", timeout_ms = 600000 },
  { id = "managed-host-listener-gateway-transition", run = "cargo nextest run --config-file tests/config/managed-host-listeners-nextest.toml --user-config-file none -p effigy-gateway --lib --filterset 'test(legacy_recovery)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail", timeout_ms = 600000 },
]
# Managed listener routes follow the checkout host map that container DNS
# routes already use. The E2E proof runs a primary checkout and two linked
# worktrees that declare one host on a disposable private gateway, plus an
# explicit shared-identity refusal. Policy proofs cover marked clones and
# matching DNS/listener declarations. Disposable loopback fixtures only.
"test:managed:scoped-host-routes" = [
  { id = "managed-scoped-host-routes-runtime", run = "cargo nextest run --config-file tests/config/managed-host-listeners-nextest.toml --user-config-file none -p effigy --test gateway_private --filterset 'test(scoped_host_routes)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail", timeout_ms = 600000 },
  { id = "managed-scoped-host-routes-policy", run = "cargo test -p effigy-containers --lib listener_routes -- --nocapture", timeout_ms = 600000 },
]
"proof:managed:host-listeners" = [
  { id = "managed-host-listener-cli-proof", run = "cargo nextest run --config-file tests/config/managed-host-listeners-nextest.toml --user-config-file none -p effigy --test gateway_private --filterset 'test(managed_host_listeners_bind_routes_propagate_restart_and_scope_teardown)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail", timeout_ms = 600000 },
]
# Controlled listener transitions through the public container CLI plus the
# production wait boundary: selected causes, dependency assignments, teardown,
# ready-only tuple replacement, inspection failure and secret allowlist control.
# Disposable loopback fixtures and owned child processes only.
"proof:managed:host-transitions" = [
  { id = "managed-host-transitions-cli-proof", run = "cargo nextest run --config-file tests/config/managed-host-listeners-nextest.toml --user-config-file none -p effigy --test gateway_private --filterset 'test(managed_host_transitions_)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail", timeout_ms = 600000 },
  { id = "managed-host-transitions-production-wait-proof", run = "cargo nextest run --config-file tests/config/managed-host-listeners-nextest.toml --user-config-file none -p effigy --lib --filterset 'test(managed_host_transitions_)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail", timeout_ms = 600000 },
]
# Isolated HTTP readiness compatibility and terminal diagnostic counterexamples
# for managed host listeners. Disposable loopback fixtures only; no consumer
# runtime, route table or host state is touched.
# Process-inventory owner parsing for listener exclusivity: signed `ps` UID
# presentation, effective-UID aliasing, boundaries and malformed rows through the
# production row parser. Read-only inventory; no process is signaled.
"test:managed:process-inventory" = [
  { id = "managed-process-inventory-rows", run = "cargo nextest run --config-file tests/config/managed-host-listeners-nextest.toml --user-config-file none -p effigy-gateway --lib --filterset 'test(process_inventory_row_)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail", timeout_ms = 600000 },
]
"proof:managed:host-readiness" = [
  { id = "managed-host-readiness-probe", run = "cargo nextest run --config-file tests/config/managed-host-listeners-nextest.toml --user-config-file none -p effigy --lib --filterset 'test(managed_host_readiness_)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail", timeout_ms = 600000 },
  { id = "managed-host-readiness-terminal", run = "cargo nextest run --config-file tests/config/managed-host-listeners-nextest.toml --user-config-file none -p effigy --test gateway_private --filterset 'test(managed_host_readiness_)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail", timeout_ms = 600000 },
]
# Whole lifecycle correction: real public private-gateway cases and native
# owned-root/descendant, selected-cause and exact recorded-identity controls.
"proof:managed:lifecycle" = [
  { id = "managed-lifecycle-native", run = "cargo nextest run --config-file tests/config/managed-host-listeners-nextest.toml --user-config-file none -p effigy --lib --filterset 'test(host_process) | test(managed_host_transitions_)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail", timeout_ms = 600000 },
  { id = "managed-lifecycle-identity", run = "cargo nextest run --config-file tests/config/managed-host-listeners-nextest.toml --user-config-file none -p effigy-gateway --lib --filterset 'test(identity::tests::) | test(managed_listener_routes_)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail", timeout_ms = 600000 },
  { id = "managed-lifecycle-public", run = "cargo nextest run --config-file tests/config/managed-host-listeners-nextest.toml --user-config-file none -p effigy --test gateway_private --filterset 'not test(managed_listener_fixture_child)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail", timeout_ms = 600000 },
]
"check:managed:host-listeners" = [
  { id = "managed-host-listener-compile", run = "cargo check -p effigy-process -p effigy-gateway -p effigy-manifest -p effigy-containers -p effigy-cli -p effigy --all-targets --profile test", timeout_ms = 600000 },
  { id = "managed-host-listener-clippy", run = "cargo clippy -p effigy-process -p effigy-gateway -p effigy-manifest -p effigy-containers -p effigy-cli -p effigy --all-targets -- -D warnings", timeout_ms = 600000 },
]
"test:gateway:identity" = [
  { id = "gateway-identity", run = "cargo test -p effigy-gateway -p effigy-cli -p effigy --lib gateway_identity -- --nocapture", timeout_ms = 240000 },
]
"check:gateway:identity" = [
  "cargo check -p effigy-gateway -p effigy-cli -p effigy-containers -p effigy --all-targets",
  "cargo clippy -p effigy-gateway -p effigy-cli -p effigy-containers -p effigy --all-targets -- -D warnings",
]
"test:gateway:legacy-recovery" = [
  { id = "gateway-legacy-recovery", run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-gateway -p effigy-cli -p effigy --lib --filterset 'test(legacy_recovery) | test(gateway_identity_legacy) | test(gateway_identity)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail -j 1", timeout_ms = 240000 },
]
"check:gateway:legacy-recovery" = [
  "cargo check -p effigy-gateway -p effigy-cli -p effigy --all-targets",
  "cargo clippy -p effigy-gateway -p effigy-cli -p effigy --all-targets -- -D warnings",
]
# Stable per-boot identity primitives: parser/command controls, cross-process
# uncached proof, and legacy `kern.boottime` compatibility. Private fixtures
# only; no host mutation.
"test:gateway:boot-identity" = [
  { id = "gateway-boot-identity", run = "cargo test -p effigy-process --lib identity -- --nocapture", timeout_ms = 120000 },
]
"check:gateway:boot-identity" = [
  "cargo check -p effigy-process --all-targets --profile test",
  "cargo clippy -p effigy-process --all-targets -- -D warnings",
]
# Managed auto-start PTY transport: terminal stdin stays available to the
# bounded elevated reader while stdout/stderr diagnostics stay captured. Real
# private PTY; noninteractive controls refuse without running the body.
"test:gateway:managed-tty" = [
  { id = "gateway-managed-tty-and-bounded-handoff", run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy --lib --filterset 'test(gateway_up_for_managed_task) | test(gateway_down_permission_denied_uses_one_lifecycle_handoff_or_preserves_unknown) | test(gateway_lifecycle_timeout_kills_and_reaps_only_its_owned_child)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail -j 1", timeout_ms = 240000 },
