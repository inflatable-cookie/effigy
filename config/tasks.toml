# Keep built-in `test` canonical so `effigy test --plan` remains available.
# Aggregator tasks below call the built-in through task refs.

[tasks]
# Contributor setup
"bootstrap:local" = [
  { rhai = "scripts/build-local-bin.rhai" },
  { rhai = "scripts/install-local-bin-links.rhai" },
]

# Graph storage and CLI refresh contract; nextest bounds each case and leaks.
"test:graph:storage" = { run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-codegraph --lib --no-fail-fast --retries 0 --no-tests fail --status-level fail --final-status-level fail", timeout_ms = 600000 }
"test:graph:runner" = { run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy --lib --filterset 'test(graph_) | test(docs_context_time_budget_tests::)' --no-fail-fast --retries 0 --no-tests fail --status-level fail --final-status-level fail", timeout_ms = 600000 }
"test:graph:adoption" = { run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy -p effigy-codegraph --lib --filterset 'test(builtin_init_actions_json_contract_has_versioned_shape) | test(graph_excerpts_payload_round_trips)' --no-fail-fast --retries 0 --no-tests fail --status-level fail --final-status-level fail", timeout_ms = 600000 }
"test:graph:config" = { run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-manifest -p effigy-routing --lib --filterset 'test(loaded_catalog::tests::) | test(owning_workspace_root_)' --no-fail-fast --retries 0 --no-tests fail --status-level fail --final-status-level fail", timeout_ms = 600000 }
"test:graph:cli" = { run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy --test cli_output_tests --filterset 'test(graph_surface_tests::) | test(retired_graph_watch_) | test(documentation_graph_runtime_)' --no-fail-fast --retries 0 --no-tests fail --status-level fail --final-status-level fail", timeout_ms = 600000 }
"test:graph:parity" = { run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy --test documentation_coverage_tests --filterset 'test(project_local_and_distributed_effigy_skills_have_semantic_parity) | test(public_help_families_and_current_contract_paths_are_documented)' --no-fail-fast --retries 0 --no-tests fail --status-level fail --final-status-level fail", timeout_ms = 600000 }

"test:graph:checkout" = { admission = "heavy", run = [ { id = "graph-checkout-build", run = "cargo build --bin effigy", timeout_ms = 600000 }, { id = "graph-checkout-smoke", run = "python3 tests/scripts/graph-checkout-smoke.py ./target/debug/effigy", timeout_ms = 600000 } ] }
"check:graph" = "cargo check -p effigy-codegraph -p effigy-cli -p effigy-manifest -p effigy-routing -p effigy-builtin -p effigy --all-targets --profile test"
"lint:graph" = "cargo clippy -p effigy-codegraph -p effigy-cli -p effigy-manifest -p effigy-routing -p effigy-builtin -p effigy --all-targets -- -D warnings"

# Kernel foundation: bounded, disjoint proof families; no engine adoption.
"test:kernel:remote" = [
  { run = "cargo build -p effigy-kernel --features fault-injection --bin kernel-custody-fixture", timeout_ms = 600000 },
  { run = "EFFIGY_KERNEL_CUSTODY_FIXTURE=$PWD/target/debug/kernel-custody-fixture cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-kernel --features fault-injection --lib -E 'test(/^remote::tests::/) | test(/^strict_fake::tests::/)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 600000 },
]
"test:kernel:custody" = [
  { run = "cargo build -p effigy-kernel --features fault-injection --bin kernel-custody-fixture", timeout_ms = 600000 },
  { run = "EFFIGY_KERNEL_CUSTODY_FIXTURE=$PWD/target/debug/kernel-custody-fixture cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-kernel --features fault-injection --test custody --lib -E 'test(/^custody::tests::/) | test(/^signal::tests::/) | test(/^run::lifecycle::tests::/) | binary(custody)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 600000 },
]
"test:kernel:custody:linux" = { admission = "heavy", run = [{ id = "linux-custody", run = "sh crates/effigy-kernel/tests/scripts/linux-custody.sh", timeout_ms = 1800000 }] }
"test:kernel:custody:signals" = [
  { run = "cargo build -p effigy-kernel --features fault-injection --bin kernel-custody-fixture", timeout_ms = 600000 },
  { run = "EFFIGY_KERNEL_CUSTODY_FIXTURE=$PWD/target/debug/kernel-custody-fixture cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-kernel --features fault-injection --test custody -E 'test(custody_signal_and_owner_kill_matrix_settles_without_survivors)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 600000 },
]
"test:kernel:identity" = { run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-kernel --test foundation -E 'test(identity_)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 600000 }
"test:kernel:context" = { run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-kernel --test foundation -E 'test(context_)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 600000 }
"test:kernel:observed" = { run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-kernel --test foundation -E 'test(observation_)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 600000 }
"test:kernel:outcome" = { run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-kernel --test foundation -E 'test(outcome_)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 600000 }
"test:kernel:platform" = { run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-kernel --features fault-injection --lib --test platform -E 'not test(/^fault_tests::/) & not test(/^custody::tests::/) & not test(/^signal::tests::/) & not test(/^run::lifecycle::tests::/) & not test(/^remote::tests::/) & not test(/^strict_fake::tests::/)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 600000 }
"test:kernel:gate" = { run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-kernel --features fault-injection --lib --test gate -E 'test(gate_)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 600000 }
# Match CI's concurrent libtest process; Effigy bounds the runner's lifetime.
"test:kernel:gate:shared" = { run = "RUSTFLAGS='--cfg effigy_shared_process' cargo test -p effigy-kernel --test gate -- --test-threads=8", timeout_ms = 600000 }
"test:kernel:gate:shared:linux" = { admission = "heavy", run = [{ id = "linux-shared-gate", run = "sh crates/effigy-kernel/tests/scripts/linux-custody.sh gate-shared", timeout_ms = 1800000 }] }
"test:kernel:store" = { run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-kernel --features fault-injection --lib --test store -E 'test(store_)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 600000 }
"test:kernel:run" = { run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-kernel --features fault-injection --lib -E 'test(/^run::tests::run_/) | test(/^run::tests::faults::run_/)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 600000 }
"test:kernel:attachments" = { run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-kernel --features fault-injection --lib -E 'test(/^run::tests::attachments_/) | test(/^run::tests::faults::attachments_/)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 600000 }
"test:kernel:claims" = { run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-kernel --features fault-injection --lib -E 'test(/^run::tests::claims_/)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 600000 }
"test:kernel:classes" = { run = "cargo test -p effigy-kernel --doc", timeout_ms = 120000 }
"test:kernel:ratchet" = { run = "cargo nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-kernel --test ratchet --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 600000 }
"check:kernel" = [{ task = "check:kernel:compile" }, { task = "check:kernel:clippy" }, { task = "check:kernel:clippy:default" }]
"check:kernel:compile" = { run = "cargo check -p effigy-kernel --all-targets --features fault-injection", timeout_ms = 600000 }
"check:kernel:clippy" = { run = "cargo clippy -p effigy-kernel --all-targets --features fault-injection -- -D warnings", timeout_ms = 600000 }
"check:kernel:clippy:default" = { run = "cargo clippy -p effigy-kernel --all-targets -- -D warnings", timeout_ms = 600000 }
"fmt:kernel" = "cargo fmt -p effigy-kernel"
"qa:kernel-ratchet" = { run = "cargo run -p effigy-kernel --example kernel-ratchet", timeout_ms = 600000 }
# Explicit baseline maintenance; ordinary QA never rewrites the baseline.
"qa:kernel-ratchet:baseline" = { run = "cargo run -p effigy-kernel --example kernel-ratchet -- --inventory", timeout_ms = 600000 }

# Common local commands
"fmt:check" = "cargo fmt --all -- --check"
"fmt:apply" = "cargo fmt --all"
