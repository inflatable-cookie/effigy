# Authorized in-place release Run. Heavy admission wraps the WHOLE operation
# (current-source build, prepare, certify gates, artifact digests) before any
# compile or file mutation. The stage boundary is fixed to `certify`, so this
# selector never tags, pushes or publishes; publishing stays an explicit
# `effigy release run` with the operator's authority. It mutates this checkout
# by design, unlike Queue milestone `project.qa.run`, which uses a disposable
# checkout. Ordinary milestone QA stays on Queue.
"release:run".description = "Run this checkout's release in place up to certify: prepare, gate and certify, publish nothing."
"release:run".admission = "heavy"
"release:run".run = "./target/debug/effigy release run --to certify {args}"

# Effigy's own release checks (contract 054 §4.4). They were the retired
# `effigy release validate|preflight|check-binary|proof|verify-install|evidence`
# commands; `config/release.toml` wires them as gates and as the binary
# target's `verify`. Nothing here publishes except `release:publish:binaries`,
# which only dispatches the existing release-binaries workflow.
"release:metadata" = { visibility = "internal", group = "Release", description = "Check Effigy's release metadata: version, changelog, lockfile and release records.", run = "sh scripts/release/checks.sh metadata {args}" }
"release:preflight" = { visibility = "public", group = "Release", description = "Run Effigy's release preflight: metadata, docs and a release smoke.", run = "sh scripts/release/checks.sh preflight {args}" }
"release:check-binary" = { visibility = "internal", group = "Release", description = "Check one release binary against the Linux GLIBC floor.", run = "sh scripts/release/checks.sh check-binary {args}" }
"release:proof" = { visibility = "public", group = "Release", description = "Prove a release artifact directory: assets, checksums and GLIBC floors.", run = "sh scripts/release/checks.sh proof {args}" }
"release:artifact" = { visibility = "internal", group = "Release", description = "Build the release binary that certify records as the artifact.", run = [{ task = "build:release" }] }
"release:verify:install" = { visibility = "public", group = "Release", description = "Prove the tagged-source install of a released binary.", admission = "heavy", run = "sh scripts/release/checks.sh verify-install {args}" }
"release:verify:binaries" = { visibility = "internal", group = "Release", description = "Verify the published GitHub Release, Homebrew tap and tagged-source install.", admission = "heavy", run = "sh scripts/release/checks.sh verify-binaries {args}" }
"release:publish:binaries" = { visibility = "internal", group = "Release", description = "Dispatch release-binaries.yml for the release tag and record the run.", run = "sh scripts/release/checks.sh publish-binaries" }
"release:check:binaries" = { visibility = "internal", group = "Release", description = "Report whether this release tag already publishes its binary assets.", run = "sh scripts/release/checks.sh check-binaries" }
"release:evidence:validate" = { visibility = "public", group = "Release", description = "Validate captured release artifact evidence.", run = "sh scripts/release/checks.sh evidence-validate {args}" }
"release:evidence:closeout" = { visibility = "public", group = "Release", description = "Write the release closeout record from captured artifacts.", run = "sh scripts/release/checks.sh evidence-closeout {args}" }

