# rendered Compose is checked by the real Compose implementation, then the same
# fixture is brought up on the Colima profile (build service, shared plus local
# MariaDB, primary and linked worktree, idempotent re-up, host-process restart,
# down leaving nothing) and torn down by exact owned name. The live half fails
# closed and names the mount ask until the approved Colima scratch mount lands;
# it never falls back to a /Users staging root by itself.
