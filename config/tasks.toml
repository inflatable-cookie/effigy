# An ordinary server needs no adapter (effigy#334): readiness is the reserved
# port answering its own probe. A plain
# `python3 -m http.server "$PORT" --bind "$HOST"` reaches ready, publishes its
# route, keeps the reserved port across a restart and settles on `down`; a child
# bound elsewhere waits while it is alive and fails naming the reserved address
# when it exits, and a reservation another process already answers fails the
# start naming that port. A shipped bundle adapter that refuses to
# start without `EFFIGY_MANAGED_HOST_LISTENER_REPORT_FILE` and
# `EFFIGY_MANAGED_HOST_LISTENER_GENERATION` gets both, writes its report and is
# ready on the port alone (effigy#349). A compile that forks short-lived
# children, a watch-mode respawn, a double fork and a momentary probe miss are
# all ordinary. Disposable loopback fixtures, a private gateway and a fake
# Docker backend only.
"test:managed:adapterless-listeners" = { durable = true, visibility = "internal", group = "Maintenance", run = [
  { id = "managed-adapterless-listener", run = "sh scripts/oxide-selector.sh nextest run --config-file tests/config/managed-host-listeners-nextest.toml --user-config-file none -p effigy --test gateway_private --filterset 'test(managed_host_adapterless_) | test(managed_host_listener_pre_bound_port_) | test(managed_host_listener_adapter_env_) | test(managed_host_listener_is_ready_) | test(managed_host_listener_watch_mode_) | test(managed_host_listener_double_forked_) | test(managed_host_listener_probe_miss_) | test(managed_host_listener_republishes_) | test(managed_host_listener_retries_a_failed_republication_)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail -j 1", timeout_ms = 900000 },
  # A child that is alive and never opens its port: `up` reports progress and a
  # `down` from another process ends the wait instead of blocking on the
  # environment (effigy#370).
  { id = "managed-hung-listener-down", run = "sh scripts/oxide-selector.sh nextest run --config-file tests/config/managed-host-listeners-nextest.toml --user-config-file none -p effigy --test gateway_private --filterset 'test(hung_listener_does_not_block_down_) | test(hung_restart_does_not_block_down_)' --no-capture --max-fail 1:immediate --retries 0 --no-tests fail -j 1", timeout_ms = 900000 },
] }
