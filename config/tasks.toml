"qa:docs:cargo-routes" = { visibility = "internal", group = "Maintenance", run = "python3 scripts/check-cargo-routes.py" }
# The ratchet on Debug formatting in human-facing error construction: a rise
# fails, and so does a fall that leaves the baseline stale.
"qa:docs:human-error-debug" = { visibility = "internal", group = "Maintenance", run = "python3 scripts/check-human-error-debug.py" }
# Every harness `mktemp` takes a `${TMPDIR:-/tmp}` template, so a run's scratch
# on a configured `[scratch]` volume is where test temp actually lands.
"qa:docs:mktemp" = { visibility = "internal", group = "Maintenance", run = "python3 scripts/check-mktemp.py" }

# Human-facing feedback (effigy#312): the step-progress API, the human error
# renderer and the kernel's readable refusals. Each covers the crate and test
# binary that owns the behaviour, so a change here has a narrow proof.
"test:ui" = { durable = true, visibility = "internal", group = "Maintenance", description = "Prove the step-progress API and the human error renderer.", run = [{ run = "sh scripts/oxide-selector.sh nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-ui --lib --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 600000 }] }
"test:kernel:human-errors" = { durable = true, visibility = "internal", group = "Maintenance", description = "Snapshot the human renderings of kernel refusals.", run = [{ run = "sh scripts/oxide-selector.sh nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-kernel --test human_errors --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 600000 }] }
"test:runner:feedback" = { durable = true, visibility = "internal", group = "Maintenance", description = "Prove the runner's human error mapping, the JSON error.human form and the container health step.", run = [
  { run = "sh scripts/oxide-selector.sh nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy --lib -E 'test(runner::error::tests::) | test(cli::output::envelope::tests::)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 900000 },
  { run = "sh scripts/oxide-selector.sh nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-containers --lib -E 'test(health::tests::)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 600000 },
] }
# The Q-017 gate: no fixed-label spinner can reach a command plane, and the
# whole workspace is linted, not a chosen package list (effigy#467).
"lint:feedback" = { visibility = "internal", group = "Maintenance", description = "Fail on any fixed-label spinner entry point in any workspace crate, and lint every workspace target.", run = [{ task = "lint:feedback:inventory" }, { run = "sh scripts/oxide-selector.sh clippy --workspace --all-targets -- -D warnings", timeout_ms = 900000 }] }
"check:feedback:compile" = { visibility = "internal", group = "Maintenance", run = [{ run = "sh scripts/oxide-selector.sh check -p effigy -p effigy-ui -p effigy-containers --all-targets", timeout_ms = 900000 }] }
"test:feedback:inventory" = { visibility = "internal", group = "Maintenance", run = [{ run = "python3 scripts/test_feedback_inventory.py", timeout_ms = 900000 }] }
"lint:feedback:inventory" = { visibility = "internal", group = "Maintenance", run = [{ run = "python3 scripts/check-feedback-inventory.py", timeout_ms = 900000 }] }
# Human-facing feedback on the remaining command planes (effigy#315): live
# steps for bootstrap/setup, bundle and catalog sources, secrets, release
# gates, deploy provider resolution and task-run steps, plus the error texts
# that wrap a child's failure. The runtime row proves the container-down
# report and the whole-stack step endings (Q-017 gap H).
"test:feedback:planes" = { durable = true, visibility = "internal", group = "Maintenance", description = "Prove the live steps and error texts of bootstrap/setup, bundle sources, secrets, release gates, deploy and task runs.", run = [
  { id = "runner-planes", run = "sh scripts/oxide-selector.sh nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy --lib -E 'test(runner::bootstrap_command::tests::) | test(runner::bundle_command::tests::) | test(runner::release_command::tests::) | test(runner::deploy_command::provider_package::tests::) | test(runner::execute::sequence_run::tests::) | test(runner::task_engine::admission::tests::) | test(runner::secret_vault::tests::) | test(runner::secrets_command::) | test(runner::workspace_command::tests::live_progress)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 900000 },
  { id = "doctor-progress", run = "sh scripts/oxide-selector.sh nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-doctor --lib -E 'test(progress::)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 600000 },
  { id = "manifest-sources", run = "sh scripts/oxide-selector.sh nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-manifest --lib -E 'test(bundles::source::)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 600000 },
  { id = "secrets-vault", run = "sh scripts/oxide-selector.sh nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-secrets --lib --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 600000 },
  { id = "runtime-feedback", run = "sh scripts/oxide-selector.sh nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-runtime --lib -E 'test(write::report::tests::) | test(write::tests::) | test(data::progress::)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 600000 },
  { id = "release-gates", run = "sh scripts/oxide-selector.sh nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-release --lib -E 'test(gate_run_reports) | test(gate_observer) | test(gate_persist) | test(gate_json) | test(failing_and_passing_gates) | test(status_text_shows_the_failed_gate_tail_and_log_path) | test(named_hosted_reuse)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 900000 },
]}
# Argument errors and suggested commands (effigy#318): the targeted usage a
# mistyped argument gets, a guard that parses every `effigy …` form a message
# suggests, and the key names `secrets doctor` prints.
"test:feedback:suggestions" = { durable = true, visibility = "internal", group = "Maintenance", description = "Prove the targeted usage of an argument error and that every suggested command parses under this checkout's grammar.", run = [
  { id = "suggested-commands", run = "sh scripts/oxide-selector.sh nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy --test suggested_commands --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 900000 },
  { id = "argument-error-text", run = "sh scripts/oxide-selector.sh nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy --lib -E 'test(cli::parse_error::tests::)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 900000 },
  { id = "parse-error-output", run = "sh scripts/oxide-selector.sh nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy --test cli_output_tests -E 'test(core_output_tests::cli_parse_error)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 900000 },
  { id = "usage-hint", run = "sh scripts/oxide-selector.sh nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy-cli --lib -E 'test(usage_hint::tests::)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 900000 },
  { id = "secrets-doctor-text", run = "sh scripts/oxide-selector.sh nextest run --config-file tests/config/gateway-nextest.toml --user-config-file none -p effigy --lib -E 'test(doctor_text_tests)' --no-fail-fast --retries 0 --no-tests fail", timeout_ms = 900000 },
]}
"qa:docs" = { visibility = "public", group = "Validation", description = "Check documentation links, examples, agent defaults, knowledge and the changelog.", run = [
  { task = "qa:docs:links" },
  { task = "qa:docs:examples" },
