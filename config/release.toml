[release]
version-file = "Cargo.toml"
changelog = "CHANGELOG.md"
sync-files = ["Cargo.lock"]
tag-format = "v{version}"

[release.gates]
format = "cargo fmt --all -- --check"
test = "cargo test --workspace"
qa = "cargo build --bin effigy && ./target/debug/effigy qa:ci"
build = "cargo build --release --bin effigy"
smoke = "cargo build --bin effigy && ./target/debug/effigy smoke:release"
metadata = "cargo build --bin effigy && ./target/debug/effigy release validate"
