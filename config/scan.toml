[scan.god_files]
# Keep doctor focused on unexpected new mega-hubs instead of the existing
# release orchestration hub and monolithic CLI contract fixture batch.
warn = 1500
high = 3000
critical = 8000
exclude = [
  "src/runner/release_command.rs",
  "tests/cli_output_tests/command_behavior_tests.rs",
]

[scan.comment_ratio]
exclude = ["src/changelog.rs"]
