[scan.god_files]
# Keep doctor focused on unexpected new mega-hubs instead of the existing
# release orchestration hub and monolithic CLI contract fixture batch.
warn = 1500
high = 3000
critical = 8000
exclude = [
  "src/runner/release_command.rs",
  "tests/cli_output_tests/command_behavior_tests.rs",
]

[scan.comment_ratio]
exclude = ["src/changelog.rs"]

[scan.boundary_violations]
# Self-adopt the graph boundary scanner on the scan library/adapter seam first.
# Keep this advisory until the graph scanner has enough history as a gate.
doctor = false
fail_on_findings = false
include_heuristic = false

[scan.boundary_violations.layers.scan_model]
paths = ["crates/effigy-scan/src/**"]

[scan.boundary_violations.layers.scan_builtin_adapter]
paths = ["crates/effigy-builtin/src/scan/**"]
may_depend_on = ["scan_model"]

[scan.dead_code]
# Keep advisory until Rust symbol findings have enough history as a gate.
doctor = false
fail_on_findings = false
include_heuristic = false
