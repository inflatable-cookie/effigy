[containers."linux-release"]
driver = "colima"
startup = "detached"
profile = "effigy-release"
# The builder compiles this checkout's source. The release profile shares one
# writable host mount into its VM, so a checkout outside that mount binds its
# staged source closure there instead of a host path the VM cannot reach
# (effigy#715). Inside a shared mount the checkout itself is the source.
workspace_source = "staged"
# Stable private builder protocol identity; upgrades reuse this project.
# The builder owns one project per exact canonical checkout, including an
# unmarked primary checkout, so two checkouts on one host never share it.
# Legacy effigy-linux-release resources are retained and never adopted.
project_name = "effigy-artifact-builder-v1"
checkout_scoped_identity = true
primary_service = "builder"

[containers."linux-release".services.builder]
catalog = "linux-release-builder"

[containers."linux-release".lifecycle]
on_task_exit = "stop"
shutdown = "graceful"
detach_timeout_secs = 10

[containers."linux-release".host]
mounts = ["./:/workspace"]
