# There is one reviewed spinner sink: `Step`'s own bar construction in
# `crates/effigy-ui/src/steps/mod.rs`, which the feedback inventory exempts by
# name. `indicatif` may be named only in that sink's own module
# (`crates/effigy-ui/src/steps/`), only `mod.rs` may build a bar, and it builds
# exactly one with exactly one style and steady tick. This config is the second
# gate: every constructor that makes a bar is disallowed everywhere, so a
# second construction fails even inside the sink file.
disallowed-methods = [
  { path = "indicatif::ProgressBar::new_spinner", reason = "feedback legacy spinner: migrate to a live progress source" },
  { path = "indicatif::ProgressBar::new", reason = "feedback legacy spinner: migrate to a live progress source" },
  { path = "indicatif::ProgressBar::no_length", reason = "feedback legacy spinner: migrate to a live progress source" },
  { path = "indicatif::ProgressBar::with_draw_target", reason = "feedback legacy spinner: migrate to a live progress source" },
  { path = "indicatif::ProgressBar::hidden", reason = "feedback legacy spinner: migrate to a live progress source" },
  { path = "indicatif::ProgressBar::with_style", reason = "feedback legacy spinner: migrate to a live progress source" },
  { path = "std::io::Stdin::read_line", reason = "terminal hand-over: use effigy_ui::steps::prompt_terminal_stdio or effigy_ui::steps::prompt_terminal_stderr" },
  { path = "std::io::Stdin::lock", reason = "terminal hand-over: use effigy_ui::steps::prompt_terminal_stdio or effigy_ui::steps::prompt_terminal_stderr" },
  { path = "rpassword::prompt_password", reason = "terminal hand-over: use effigy_ui::steps::prompt_terminal_password" },
  { path = "rpassword::read_password", reason = "terminal hand-over: use effigy_ui::steps::prompt_terminal_password" },
  { path = "std::process::Stdio::inherit", reason = "terminal hand-over: hold effigy_ui::steps::suspend_terminal() and use TerminalGuard::inherit_stdio" },
]
