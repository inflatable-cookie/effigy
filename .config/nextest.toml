[test-groups.cold-start]
max-threads = 1

[test-groups.journal-matrix]
max-threads = 1

[profile.default]
# Bound workspace runs locally and on hosted CI, including lifecycle cases.
# Focused profiles retain their stricter per-test limits.
slow-timeout = { period = "360s", terminate-after = 1, grace-period = "2s" }
leak-timeout = { period = "30s", result = "fail" }
# Retain the existing suite bound while fixture classes share the runner.
global-timeout = "3500s"
# Keep failures, slow cases and leaky identities at the end of capped QA logs.
status-level = "fail"
final-status-level = "leak"

[[profile.default.overrides]]
# These host-dependent proofs report named missing-prerequisite results to
# stderr and the hosted step summary. Keep those notices visible on success.
filter = 'package(effigy) & (test(scoped_host_database_alias_tests::) | test(/::the_production_predecessor_adapter_accepts_a_matching_live_predecessor_and_publishes$/))'
success-output = "immediate"

# Cold-start fixtures share one slot; ordinary tests continue alongside them.
# Journal matrices have a separate single-writer class. No deadline changes.
[[profile.default.overrides]]
filter = 'test(container_up_exposure_tests::)'
test-group = "cold-start"

[[profile.default.overrides]]
filter = 'test(/^command_behavior_tests::(cli_deep_doctor_timeout_terminates_(git_identity|health_process)_tree|cli_fast_doctor_timeout_terminates_cargo_metadata_tree|doctor_git_cli_(serial_observer_counterexample|deliberately_late_descendant))$/) | test(/^execution::doctor_inventory::tests::doctor_git_timeout_(process_group_evidence|before_status_is_incomplete_evidence)$/)'
test-group = "cold-start"

[[profile.default.overrides]]
filter = 'binary(gateway_private) & test(managed_host_dependent_replacement_)'
test-group = "cold-start"
slow-timeout = { period = "120s", terminate-after = 1, grace-period = "2s" }
leak-timeout = { period = "30s", result = "fail" }

[[profile.default.overrides]]
filter = 'binary(gateway_private) & (test(managed_matrix_) | test(managed_host_))'
test-group = "cold-start"

[[profile.default.overrides]]
filter = 'binary(cli_output_tests) & test(partial_startup_tests::)'
test-group = "cold-start"

[[profile.default.overrides]]
filter = 'test(run_supervision_matrix_recovery_stop_and_attachment_release_are_idempotent)'
test-group = "journal-matrix"
slow-timeout = { period = "900s", terminate-after = 1, grace-period = "2s" }

[profile.doctor-process]
inherits = "default"

[[profile.doctor-process.overrides]]
filter = 'test(doctor_git_timeout_process_group_evidence)'
slow-timeout = { period = "45s", terminate-after = 1, grace-period = "2s" }

[[profile.doctor-process.overrides]]
filter = 'test(cli_deep_doctor_timeout_terminates_git_identity_tree)'
slow-timeout = { period = "45s", terminate-after = 1, grace-period = "2s" }

[[profile.default.overrides]]
# The run fault-boundary proofs replay every journal boundary with kill, ENOSPC
# and EPERM, and every boundary owns a durable journal: 169.7 s for both under
# the ruled `[scratch] root` (2026-10-25), close enough to the 360 s cap that a
# loaded host loses one. Keep the proofs and bound the wait instead.
filter = 'test(/^run::tests::faults::run_fault_/)'
slow-timeout = { period = "600s", terminate-after = 1, grace-period = "2s" }
