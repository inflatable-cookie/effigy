[profile.default]
# Bound workspace runs locally and on hosted CI, including lifecycle cases.
# Focused profiles retain their stricter per-test limits.
slow-timeout = { period = "360s", terminate-after = 1, grace-period = "2s" }
leak-timeout = { period = "1s", result = "fail" }
# The suite bound admits the run-supervision matrix proofs below, which the
# milestone path now runs with the runner reserved exactly as their owning
# selector (`test:managed:matrix`) declares 3500s for. A tighter bound here
# would terminate the suite for capacity the suite itself reserves.
global-timeout = "3500s"
# Keep failures, slow cases and leaky identities at the end of capped QA logs.
status-level = "fail"
final-status-level = "leak"

[[profile.default.overrides]]
# These fixtures require a ready child inside a cold, subsecond deadline.
# Reserve this runner's slots without changing the deadline or its assertions.
# Other tests retain ordinary concurrency. The focused profile inherits this.
filter = 'test(/^command_behavior_tests::(cli_deep_doctor_timeout_terminates_(git_identity|health_process)_tree|cli_fast_doctor_timeout_terminates_cargo_metadata_tree|doctor_git_cli_(serial_observer_counterexample|deliberately_late_descendant))$/) | test(/^execution::doctor_inventory::tests::doctor_git_timeout_(process_group_evidence|before_status_is_incomplete_evidence)$/)'
threads-required = "num-test-threads"

[[profile.default.overrides]]
# This proof cold-starts three managed stacks and their listener/dependent
# supervisors concurrently. Keep its production startup deadlines intact while
# reserving runner capacity, as in the focused listener validation.
filter = 'binary(gateway_private) & test(managed_host_dependent_replacement_)'
threads-required = "num-test-threads"
slow-timeout = { period = "120s", terminate-after = 1, grace-period = "2s" }
leak-timeout = { period = "1s", result = "fail" }

[[profile.default.overrides]]
# Every cell of the run-supervision matrix drives two full managed activations
# of a fake Compose stack, so one parameterised test is nine cells and eighteen
# activations, and each activation is observed by spawning the CLI for its
# status projection. That is ~95s on a quiet runner, but the milestone `effigy
# test` path schedules all 5401 tests at once, and those 5401 tests inflate each
# status spawn severalfold: QA 897e46a9 terminated nine of the twelve matrix
# proofs at the 360s bound after each had finished eight of its nine cells. Only
# the matrix proofs are long enough for that inflation to reach the bound, and
# the owning selector has always run them two at a time under its own
# `tests/config/managed-matrix-nextest.toml`. Reserve the runner for each proof
# here too, as the other cold-start overrides do, so the milestone path measures
# the activations rather than the contention. The per-test bound, the leak
# bound and every assertion stay unchanged.
filter = 'binary(gateway_private) & test(managed_matrix_)'
threads-required = "num-test-threads"

[[profile.default.overrides]]
# Each partial-startup case owns three service children and cold-starts their
# stacks, and the three-scope proof deliberately runs three scoped activations
# at once. The owning selectors run this group serially for that reason; reserve
# runner capacity here too, so the milestone `effigy test` path runs the same
# proofs rather than racing them against other fixture binaries. Deadlines and
# assertions are unchanged.
filter = 'binary(cli_output_tests) & test(partial_startup_tests::)'
threads-required = "num-test-threads"

[profile.doctor-process]
inherits = "default"

[[profile.doctor-process.overrides]]
filter = 'test(doctor_git_timeout_process_group_evidence)'
slow-timeout = { period = "45s", terminate-after = 1, grace-period = "2s" }

[[profile.doctor-process.overrides]]
filter = 'test(cli_deep_doctor_timeout_terminates_git_identity_tree)'
slow-timeout = { period = "45s", terminate-after = 1, grace-period = "2s" }
