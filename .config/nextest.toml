[profile.default]
# Keep failures, slow cases and leaky identities at the end of capped QA logs.
status-level = "fail"
final-status-level = "leak"

[[profile.default.overrides]]
# These fixtures require a ready child inside a cold, subsecond deadline.
# Reserve this runner's slots without changing the deadline or its assertions.
# Other tests retain ordinary concurrency. The focused profile inherits this.
filter = 'test(/^command_behavior_tests::(cli_deep_doctor_timeout_terminates_(git_identity|health_process)_tree|cli_fast_doctor_timeout_terminates_cargo_metadata_tree|doctor_git_cli_(serial_observer_counterexample|deliberately_late_descendant))$/) | test(/^execution::doctor_inventory::tests::doctor_git_timeout_(process_group_evidence|before_status_is_incomplete_evidence)$/)'
threads-required = "num-test-threads"

[profile.doctor-process]
inherits = "default"

[[profile.doctor-process.overrides]]
filter = 'test(doctor_git_timeout_process_group_evidence)'
slow-timeout = { period = "45s", terminate-after = 1, grace-period = "2s" }

[[profile.doctor-process.overrides]]
filter = 'test(cli_deep_doctor_timeout_terminates_git_identity_tree)'
slow-timeout = { period = "45s", terminate-after = 1, grace-period = "2s" }
