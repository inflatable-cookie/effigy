[profile.default]
slow-timeout = { period = "45s", terminate-after = 1, grace-period = "2s" }
leak-timeout = { period = "30s", result = "fail" }
global-timeout = "600s"

# The environment-owned supervisor proof starts an environment through a
# task step, restarts one listener generation after that task's lease ends and
# then settles the environment, so it needs more than the default slow period.
[[profile.default.overrides]]
filter = "test(environment_owned_supervisor_outlives_)"
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "2s" }

# These proofs drive several public CLI transitions and real listener processes.
[[profile.default.overrides]]
filter = "test(managed_host_dependent_replacement_) | test(container_hybrid_environment_switch_) | test(container_headless_managed_lifecycle_publishes_routes_in_scoped_data_from_clone)"
slow-timeout = { period = "120s", terminate-after = 1, grace-period = "2s" }

# The leader-exit proof starts a two-listener environment through the public
# CLI, signals one leader per restart policy and settles the environment
# (effigy#336).
[[profile.default.overrides]]
filter = "test(managed_host_listener_leader_exit_)"
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "2s" }

# The adapter-less proofs start plain servers, restart one on its reserved port
# and settle the environment through the public CLI (effigy#334).
[[profile.default.overrides]]
filter = "test(managed_host_adapterless_)"
slow-timeout = { period = "120s", terminate-after = 1, grace-period = "2s" }

# The failed-republication proof holds a listener silent long enough to
# withdraw its route, then fails one publication and retries it, and the hung
# restart proof starts an environment before restarting a listener that never
# answers (effigy#390).
[[profile.default.overrides]]
filter = "test(managed_host_listener_retries_a_failed_republication_) | test(hung_restart_does_not_block_down_)"
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "2s" }

# This clone/switch proof runs a listener up, a container handover and a switch
# back through the public CLI in a scoped clone, so it needs the same budget as
# the other clone and switch proofs rather than the 45s default (papercut
# 630e6e98).
[[profile.default.overrides]]
filter = "test(container_scoped_clone_first_listener_up_and_switch_round_trip_hands_over)"
slow-timeout = { period = "120s", terminate-after = 1, grace-period = "2s" }

# Every managed-matrix cell runs a partial prior, one failed child and an
# immediate restart through the public CLI, so it needs more than the 45s
# default but far less than the retired nine-cell sweep (Q-013 ruling 2).
[[profile.default.overrides]]
filter = "test(managed_matrix_)"
slow-timeout = { period = "120s", terminate-after = 1, grace-period = "2s" }

# Keep an external recorded pipe holder through the real custody drain bound,
# then observe the host supervisor's own restart decision and settle both.
[[profile.default.overrides]]
filter = "test(host_supervisor_restarts_after_a_drain_gap_with_inherited_session_flags) | test(canonical_capture_stops_a_full_pipe_with_an_unconsumed_styled_reader)"
slow-timeout = { period = "90s", terminate-after = 1, grace-period = "2s" }
