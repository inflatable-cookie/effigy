[profile.default]
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "2s" }
leak-timeout = { period = "1s", result = "fail" }
# A drive-backed temp root costs about 26 ms per durable journal commit against
# 0.16 ms on the internal disk, and the §12.3 supervisor matrix alone owns 288
# journals. Measured 2026-10-25: the whole matrix takes about 550 s under the
# ruled `[scratch] root` and 61 s internally, so the run cap follows the proof.
global-timeout = "1800s"

[[profile.default.overrides]]
# The §12.3 supervisor matrix keeps its full cross product (3 front ends × 4
# prior states × 8 stops × 3 attachments), and every cell owns a fresh durable
# checkout journal. Keep the proof rather than trimming cells for the volume,
# and run it alone so its cells do not queue behind other journals.
filter = 'test(run_supervision_matrix_recovery_stop_and_attachment_release_are_idempotent)'
threads-required = "num-test-threads"
slow-timeout = { period = "900s", terminate-after = 1, grace-period = "2s" }
