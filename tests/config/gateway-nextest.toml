[test-groups.cold-start]
max-threads = 1

[profile.default]
# One budget for one ordinary selector. A journal-heavy selector names its own
# budget file (journal-heavy-nextest.toml) instead of raising this per test.
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "2s" }
# A test process that outlives its result is reaped, not failed: under load a
# 1 s window failed healthy runs for slow reaping.
leak-timeout = { period = "30s", result = "fail" }
global-timeout = "1800s"

[[profile.default.overrides]]
# Share the default suite's bounded cold-start class without reserving ordinary
# test slots. Keep the enclosing activation budgets and assertions unchanged.
filter = 'test(container_up_exposure_tests::)'
test-group = "cold-start"
