# Kernel fault suite (§12.1) and supervisor matrix (§12.3): each test drives
# hundreds of fresh-HOME runs, so per-test bounds are wider than the default.
[profile.default]
slow-timeout = { period = "600s", terminate-after = 1, grace-period = "5s" }
leak-timeout = { period = "30s", result = "fail" }
global-timeout = "1800s"

# Each scenario starts twelve fault-shard processes. A shard is bound by
# per-job latency (child handshakes, store writes, closure polls), not by
# cores, so a drive is worth running wider than the core count and the group
# runs three drives at once: enough lanes to overlap the drives that finish
# early with the one long environment handover, without multiplying the
# expansion by host CPU count.
[test-groups.kernel-fault-drivers]
max-threads = 3

[[profile.default.overrides]]
filter = 'test(/^faults::scenarios::/)'
test-group = 'kernel-fault-drivers'
