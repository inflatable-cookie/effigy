[profile.default]
# One representative end-to-end cell per front end and stop (Q-013 ruling 2):
# a partial prior, one failed child and an immediate restart, about 15-30s on
# a quiet host. The full prior × children cross product is the kernel model
# test. Force termination and fail leaked handles.
slow-timeout = { period = "120s", terminate-after = 1, grace-period = "2s" }
leak-timeout = { period = "30s", result = "fail" }
global-timeout = "900s"
