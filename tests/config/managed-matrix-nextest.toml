[profile.default]
# Each parameterised test covers nine cases (three priors × zero to two
# failed children), each with an immediate restart; one takes about 300s on a
# quiet host. Force termination and fail leaked handles.
slow-timeout = { period = "600s", terminate-after = 1, grace-period = "2s" }
leak-timeout = { period = "2s", result = "fail" }
global-timeout = "3500s"
