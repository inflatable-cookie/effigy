# Contract 054 §4.3 verbatim: a digest release reaches a deploy task, with no
# changelog and no version file of its own.
[release]

[release.identities.site]
kind = "digest"

[release.artifacts.site]
task = "build"
path = "dist/"

[release.targets.production]
kind = "task"
task = "deploy:production"
verify = "deploy:health"
