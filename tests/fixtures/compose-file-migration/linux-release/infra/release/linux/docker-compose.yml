services:
  builder:
    build:
      context: ../../..
      dockerfile: infra/release/linux/Dockerfile
    working_dir: /workspace
    command: ["bash", "-lc", "while true; do sleep 3600; done"]
    volumes:
      - ../../../:/workspace
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git

volumes:
  cargo-registry:
  cargo-git:
