# Linux ARM proof container for card 138. Owned by the Effigy
# [containers."linux-arm"] environment; do not run it through Docker Desktop.
#
# Mount layout keeps the repo's sibling path dependencies working unchanged:
# /workspace/soundcheck/../soundcheck-library and ../longhorn resolve exactly
# as they do on the host.
services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: soundcheck-linux-arm-builder:local
    working_dir: /workspace
    environment:
      CARGO_NET_OFFLINE: "true"
    volumes:
      # The repository itself.
      - ../..:/workspace/soundcheck
      # Vendored crates + git sources, read-only, plus the cargo config that
      # redirects every source at the vendored tree.
      - ../../vendor:/workspace/soundcheck/vendor:ro
      - ./cargo-vendor.config.toml:/usr/local/cargo/config.toml:ro
      # Sibling path dependencies.
      - ../../../soundcheck-library:/workspace/soundcheck-library
      - ../../../longhorn:/workspace/longhorn
      # Keep Linux build artifacts out of the host macOS target dirs.
      - linux-arm-target-soundcheck:/workspace/soundcheck/target
      - linux-arm-target-library:/workspace/soundcheck-library/target
      - linux-arm-cargo-registry:/usr/local/cargo/registry

volumes:
  linux-arm-target-soundcheck:
  linux-arm-target-library:
  linux-arm-cargo-registry:
