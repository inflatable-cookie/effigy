name: Release Gates

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-gates:
    name: Validate release gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run release gate checks
        run: ./scripts/check-release-gates.sh
