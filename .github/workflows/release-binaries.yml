name: Release Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  gates:
    name: Release gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo nextest run

      - name: Run doc tests
        run: cargo test --doc

      - name: Build release binary
        run: cargo build --release --bin effigy

      - name: Smoke test
        run: ./scripts/check-release-smoke.sh ./target/release/effigy

  build:
    name: Build (${{ matrix.target }})
    needs: gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation toolchain
        if: matrix.cross
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --bin effigy --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/effigy effigy-${{ matrix.target }}

      - name: Check glibc compatibility floor
        if: contains(matrix.target, 'unknown-linux-gnu')
        run: ./scripts/check-linux-glibc-floor.sh ./effigy-${{ matrix.target }} 2.35

      - name: Smoke test
        run: ./scripts/check-release-smoke.sh ./effigy-${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: effigy-${{ matrix.target }}
          path: effigy-${{ matrix.target }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    outputs:
      has-tap-token: ${{ steps.check-token.outputs.has-token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-notes-bootstrap

      - name: Build effigy
        run: cargo build --release --bin effigy

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ./target/release/effigy changelog extract CHANGELOG.md --version "$VERSION" > release-notes.md; then
            if [ ! -s release-notes.md ]; then
              echo "::warning::Extractor returned an empty release note body for $VERSION, falling back to generated notes"
              rm -f release-notes.md
              echo "fallback=true" >> "$GITHUB_OUTPUT"
            else
              echo "fallback=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::warning::No CHANGELOG.md section found for $VERSION, falling back to generated notes"
            rm -f release-notes.md
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          chmod +x artifacts/effigy-*
          if [ "${{ steps.notes.outputs.fallback }}" = "true" ]; then
            gh release create "$TAG" \
              --title "Effigy $VERSION" \
              --generate-notes \
              artifacts/effigy-*
          else
            gh release create "$TAG" \
              --title "Effigy $VERSION" \
              --notes-file release-notes.md \
              artifacts/effigy-*
          fi

      - name: Check for Homebrew tap token
        id: check-token
        env:
          TOKEN: ${{ secrets.EFFIGY_TAP_GH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          fi

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    if: needs.release.outputs.has-tap-token == 'true'
    steps:
      - name: Compute binary SHA256 hashes
        id: hashes
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BASE="https://github.com/inflatable-cookie/effigy/releases/download/${TAG}"
          ARM_SHA="$(curl -fsSL "${BASE}/effigy-aarch64-apple-darwin" | sha256sum | awk '{print $1}')"
          X86_SHA="$(curl -fsSL "${BASE}/effigy-x86_64-apple-darwin" | sha256sum | awk '{print $1}')"
          LINUX_X86_SHA="$(curl -fsSL "${BASE}/effigy-x86_64-unknown-linux-gnu" | sha256sum | awk '{print $1}')"
          LINUX_ARM_SHA="$(curl -fsSL "${BASE}/effigy-aarch64-unknown-linux-gnu" | sha256sum | awk '{print $1}')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "arm_url=${BASE}/effigy-aarch64-apple-darwin" >> "$GITHUB_OUTPUT"
          echo "arm_sha=$ARM_SHA" >> "$GITHUB_OUTPUT"
          echo "x86_url=${BASE}/effigy-x86_64-apple-darwin" >> "$GITHUB_OUTPUT"
          echo "x86_sha=$X86_SHA" >> "$GITHUB_OUTPUT"
          echo "linux_x86_url=${BASE}/effigy-x86_64-unknown-linux-gnu" >> "$GITHUB_OUTPUT"
          echo "linux_x86_sha=$LINUX_X86_SHA" >> "$GITHUB_OUTPUT"
          echo "linux_arm_url=${BASE}/effigy-aarch64-unknown-linux-gnu" >> "$GITHUB_OUTPUT"
          echo "linux_arm_sha=$LINUX_ARM_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout tap repository
        uses: actions/checkout@v6
        with:
          repository: inflatable-cookie/homebrew-tap
          token: ${{ secrets.EFFIGY_TAP_GH_TOKEN }}

      - name: Update formula
        env:
          VERSION: ${{ steps.hashes.outputs.version }}
          TAG: ${{ steps.hashes.outputs.tag }}
          ARM_URL: ${{ steps.hashes.outputs.arm_url }}
          ARM_SHA: ${{ steps.hashes.outputs.arm_sha }}
          X86_URL: ${{ steps.hashes.outputs.x86_url }}
          X86_SHA: ${{ steps.hashes.outputs.x86_sha }}
          LINUX_X86_URL: ${{ steps.hashes.outputs.linux_x86_url }}
          LINUX_X86_SHA: ${{ steps.hashes.outputs.linux_x86_sha }}
          LINUX_ARM_URL: ${{ steps.hashes.outputs.linux_arm_url }}
          LINUX_ARM_SHA: ${{ steps.hashes.outputs.linux_arm_sha }}
        run: |
          cat > Formula/effigy.rb <<FORMULA
          class Effigy < Formula
            desc "Unified task runner for monorepos and nested workspaces"
            homepage "https://github.com/inflatable-cookie/effigy"
            license "MIT"
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "${ARM_URL}"
                sha256 "${ARM_SHA}"
              elsif Hardware::CPU.intel?
                url "${X86_URL}"
                sha256 "${X86_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url "${LINUX_X86_URL}"
                sha256 "${LINUX_X86_SHA}"
              elsif Hardware::CPU.arm?
                url "${LINUX_ARM_URL}"
                sha256 "${LINUX_ARM_SHA}"
              end
            end

            def install
              binary = stable.url.split("/").last
              bin.install binary => "effigy"
            end

            test do
              assert_match "effigy", shell_output("#{bin}/effigy --help")
            end
          end
          FORMULA
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Formula/effigy.rb

      - name: Commit and push
        env:
          TAG: ${{ steps.hashes.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/effigy.rb
          git commit -m "bump effigy to ${TAG}"
          git push
