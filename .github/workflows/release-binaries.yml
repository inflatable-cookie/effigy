name: Release Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  gates:
    name: Release gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo nextest run

      - name: Run doc tests
        run: cargo test --doc

      - name: Build release binary
        run: cargo build --release --bin effigy

      - name: Smoke test
        run: ./scripts/check-release-smoke.sh ./target/release/effigy

  build:
    name: Build (${{ matrix.target }})
    needs: gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --bin effigy --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/effigy effigy-${{ matrix.target }}

      - name: Smoke test
        run: ./scripts/check-release-smoke.sh ./effigy-${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: effigy-${{ matrix.target }}
          path: effigy-${{ matrix.target }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section for this version (between ## [X.Y.Z] and next ## [)
          NOTES="$(sed -n "/^## \[$VERSION\]/,/^## \[/{/^## \[$VERSION\]/d;/^## \[/d;p;}" CHANGELOG.md)"
          if [ -z "$NOTES" ]; then
            echo "::warning::No CHANGELOG.md section found for $VERSION, falling back to generated notes"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          else
            # Write to file to preserve newlines
            echo "$NOTES" > release-notes.md
            echo "fallback=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          chmod +x artifacts/effigy-*
          if [ "${{ steps.notes.outputs.fallback }}" = "true" ]; then
            gh release create "$TAG" \
              --title "Effigy $VERSION" \
              --generate-notes \
              artifacts/effigy-*
          else
            gh release create "$TAG" \
              --title "Effigy $VERSION" \
              --notes-file release-notes.md \
              artifacts/effigy-*
          fi
