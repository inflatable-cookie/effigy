name: Homebrew Tap Formula PR

on:
  workflow_run:
    workflows:
      - Homebrew Tap Metadata
    types:
      - completed
  workflow_dispatch:
    inputs:
      metadata_run_id:
        description: "Actions run id from Homebrew Tap Metadata workflow"
        required: true
        type: string
      tap_repo:
        description: "Tap repository slug"
        required: false
        default: "inflatable-cookie/homebrew-effigy"
        type: string

jobs:
  open-tap-pr:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      TAP_REPO: ${{ github.event.inputs.tap_repo || 'inflatable-cookie/homebrew-effigy' }}
      METADATA_RUN_ID: ${{ github.event.inputs.metadata_run_id || github.event.workflow_run.id }}
    steps:
      - name: Checkout effigy repository
        uses: actions/checkout@v4

      - name: Validate tap token
        env:
          TAP_TOKEN: ${{ secrets.EFFIGY_TAP_GH_TOKEN }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "EFFIGY_TAP_GH_TOKEN secret is required to open tap PRs" >&2
            exit 1
          fi

      - name: Download Homebrew metadata artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          artifact_url="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${REPO}/actions/runs/${METADATA_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("homebrew-metadata-")) | .archive_download_url' \
            | head -n1)"

          if [[ -z "$artifact_url" ]]; then
            echo "homebrew metadata artifact not found for run ${METADATA_RUN_ID}" >&2
            exit 1
          fi

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "$artifact_url" \
            -o metadata.zip

          unzip -p metadata.zip homebrew-metadata.json > homebrew-metadata.json

          jq -e '.tag and .version and .url and .sha256' homebrew-metadata.json >/dev/null

      - name: Read metadata outputs
        id: metadata
        run: |
          set -euo pipefail
          echo "tag=$(jq -r '.tag' homebrew-metadata.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version' homebrew-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.EFFIGY_TAP_GH_TOKEN }}
          path: tap

      - name: Update formula from metadata
        run: |
          ./scripts/update-homebrew-formula-from-metadata.sh \
            --metadata "$GITHUB_WORKSPACE/homebrew-metadata.json" \
            --formula "$GITHUB_WORKSPACE/tap/Formula/effigy.rb"

      - name: Open tap formula bump PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.EFFIGY_TAP_GH_TOKEN }}
          path: tap
          commit-message: "chore(homebrew): bump effigy to ${{ steps.metadata.outputs.tag }}"
          branch: "automation/homebrew-bump-${{ steps.metadata.outputs.tag }}"
          delete-branch: true
          title: "chore(homebrew): bump effigy to ${{ steps.metadata.outputs.tag }}"
          body: |
            Automated formula bump from core release metadata.

            - tag: `${{ steps.metadata.outputs.tag }}`
            - version: `${{ steps.metadata.outputs.version }}`
            - source: `${{ github.repository }}` run `${{ env.METADATA_RUN_ID }}`

            This PR was generated by `.github/workflows/homebrew-tap-formula-pr.yml`.
