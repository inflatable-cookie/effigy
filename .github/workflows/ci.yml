name: CI

# Ordinary pushes intentionally rely on local `effigy qa`. Hosted CI runs when
# explicitly requested or when a pull request needs clean-clone evidence.
# Recent hosted tests took 14–17 minutes; allow compilation and workspace growth.
# Partition test execution to keep each job below 20 minutes, including builds.
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Fixtures repeatedly fingerprint and launch the CLI. Debug symbols inflate those
# reads without changing debug assertions or test behavior; retain the test code.
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # Repo-wide allows live in [workspace.lints.clippy] (root Cargo.toml),
        # so no -A flags are needed here — a plain clippy matches local runs.
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Run tests
        run: cargo nextest run --workspace --partition hash:${{ matrix.shard }}/4 --config-file .config/nextest.toml --user-config-file none --no-fail-fast --retries 0 --final-status-level pass

      - name: Run doc tests
        if: matrix.shard == 1
        run: cargo test --workspace --doc

  shared-process:
    name: Shared-process tests (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTFLAGS: --cfg effigy_shared_process
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        suite: [library-workspace, library-core, library-runner, library-other, cli, gateway, rest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Keep default libtest threads within each related library family.
      # The runner proves the compiled inventory is disjoint and complete.
      # Release still runs full cargo test --workspace; local QA remains full,
      # unpartitioned nextest. Neither route uses these hosted cohort filters.
      - name: Run workspace tests in shared processes
        run: python3 scripts/ci-shared-process.py ${{ matrix.suite }}

  managed-lifecycle:
    name: Managed lifecycle matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Run managed lifecycle matrix
        run: cargo run --bin effigy -- test:managed:matrix

  released-surface:
    name: Released Surface Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Run released-surface regression lane
        run: cargo run --bin effigy -- qa:released-surface

  supply-chain:
    name: Supply-chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo-deny (advisories, licenses, bans, sources)
        run: cargo deny check
