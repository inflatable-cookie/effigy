name: CI

# Ordinary pushes intentionally rely on local `effigy qa`. Hosted CI runs when
# explicitly requested or when a pull request needs clean-clone evidence.
# Recent hosted tests took 14–17 minutes; allow compilation and workspace growth.
# The lifecycle selector has a 40-minute cap; its job also allows bootstrap time.
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # Repo-wide allows live in [workspace.lints.clippy] (root Cargo.toml),
        # so no -A flags are needed here — a plain clippy matches local runs.
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Run tests
        run: cargo nextest run --workspace --config-file .config/nextest.toml --user-config-file none --no-fail-fast --retries 0 --final-status-level pass

      - name: Run doc tests
        run: cargo test --workspace --doc

  shared-process:
    name: Shared-process tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: --cfg effigy_shared_process
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Keep libtest's parallel threads: this is the release test gate's
      # shared-process model, which nextest's per-test processes cannot prove.
      - name: Run workspace tests in shared processes
        run: cargo test --workspace --no-fail-fast

  managed-lifecycle:
    name: Managed lifecycle matrix
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Run managed lifecycle matrix
        run: cargo run --bin effigy -- test:managed:matrix

  released-surface:
    name: Released Surface Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run released-surface regression lane
        run: cargo run --bin effigy -- qa:released-surface --repo .

  supply-chain:
    name: Supply-chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo-deny (advisories, licenses, bans, sources)
        run: cargo deny check
