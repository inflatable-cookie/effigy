name: JSON Contracts

# Keep routine main pushes local; use this workflow for pull-request proof or
# an explicit clean-clone contract check.
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: json-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-links:
    name: Validate docs links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Put checkout CLI on PATH
        run: echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"

      - name: Validate docs QA bundle
        run: cargo run --bin effigy -- qa:docs

  json-contracts:
    name: Validate JSON contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Put checkout CLI on PATH
        run: echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"

      - name: Validate JSON contracts
        run: |
          set -o pipefail
          cargo run --bin effigy -- contracts check-json --print-selected=json | tee json-contracts.log
          grep -m1 '^{"selected":' json-contracts.log > json-contracts-selected.json

      - name: Validate selection artifact contract
        run: cargo run --bin effigy -- contracts check-json --validate-selection --artifact ./json-contracts-selected.json

      - name: Validator smoke check (negative path)
        run: cargo test -p effigy-contracts --lib tests::artifact_selection_validation_reads_the_artifact_file -- --exact --nocapture

      - name: Upload JSON contracts artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: json-contracts-${{ github.run_id }}
          path: |
            json-contracts.log
            json-contracts-selected.json
