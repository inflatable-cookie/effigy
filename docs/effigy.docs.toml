[docs_policy.graph]
roots = ["README.md", "AGENTS.md", "CHANGELOG.md", "PAPERCUTS.md", "docs"]

# Effigy's knowledge and architecture documents may carry per-section
# `Status:` and `Owner:` lines as well as the document header line, so both
# fields are multi-valued here. Currentness resolves from the first occurrence
# in file order, which is the document header. The former starter shipped
# `cardinality = "one"` for both; this repository deliberately deviates, which
# is exactly what consumer-owned configuration means.
[docs_policy.graph.fields.status]
labels = ["Status"]
cardinality = "many"

[docs_policy.graph.fields.owner]
labels = ["Owner"]
cardinality = "many"

[docs_policy.graph.currentness]
field = "status"
current = [
  "active",
  "ready",
  "strict-ready",
  "draft",
  "planned",
  "queued",
  "open",
  "accepted",
  "promoted",
  "live",
]
historical = ["complete", "archived", "closed", "superseded", "deprecated"]

# ---- Kinds -------------------------------------------------------------------
# Kind globs must not overlap: one document matches at most one kind. Single `*`
# never crosses a path separator, which keeps each nested family disjoint from
# its parent directory.

[docs_policy.graph.kinds.contract]
include = ["docs/knowledge/contracts/*.md"]
authority = 100
default-currentness = "current"

[docs_policy.graph.kinds.architecture]
include = ["docs/knowledge/architecture/*.md"]
authority = 90
default-currentness = "current"

[docs_policy.graph.kinds.knowledge]
include = ["docs/knowledge/*.md", "docs/knowledge/domain/*.md"]
authority = 85
default-currentness = "current"

[docs_policy.graph.kinds.plan]
include = ["docs/plan.md"]
authority = 65
default-currentness = "current"

[docs_policy.graph.kinds.guide]
include = ["docs/guides/*.md"]
authority = 50
default-currentness = "current"

[docs_policy.graph.kinds.archived-guide]
include = ["docs/guides/archive/*.md"]
authority = 10
default-currentness = "historical"

[docs_policy.graph.kinds.front-door]
include = ["README.md", "AGENTS.md", "CHANGELOG.md", "PAPERCUTS.md", "docs/README.md"]
authority = 40
default-currentness = "current"

[docs_policy.graph.kinds.triage]
include = ["docs/triage/*.md"]
authority = 20

# ---- Relations ---------------------------------------------------------------
# Labels match `Label: [link](target)` metadata lines; headings match links found
# under the named heading.

[docs_policy.graph.relations.contract]
labels = ["Contract", "Contracts"]

[docs_policy.graph.relations.architecture]
labels = ["Architecture"]

[docs_policy.graph.relations.depends-on]
labels = ["Depends on"]
