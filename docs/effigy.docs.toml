[docs_policy.indexes.vision]
file = "docs/vision/README.md"
dir = "docs/vision"
section = "Vision Artifacts"
exclude = ["history/**", "governance/**", "decisions/**"]

[docs_policy.next_actions.vision]
index = "vision"
heading = "## Next Task"
allowlist_file = "docs/scripts/fixtures/vision-next-task/actionable-verbs.txt"

# ---- Documentation graph profile ---------------------------------------------
# Effigy's own repository-owned documentation semantics for `effigy docs context`
# (contract `041`, architecture `024`).
#
# This block is committed consumer configuration. It was materialized from the
# `northstar` starter (`effigy init northstar`) and then extended for this
# repository's real docs tree. Nothing reads an installed skill or starter at
# runtime: the bytes below are the only authority. Updating the starter or the
# `effigy` agent skill does not reinterpret this profile — re-materializing is
# an explicit edit to this file.

[docs_policy.graph]
roots = ["README.md", "AGENTS.md", "CHANGELOG.md", "PAPERCUTS.md", "docs"]

# Effigy's roadmap and architecture documents legitimately carry per-section
# `Status:` and `Owner:` lines as well as the document header line, so both
# fields are multi-valued here. Currentness resolves from the first occurrence
# in file order, which is the document header. The `northstar` starter ships
# `cardinality = "one"` for both; this repository deliberately deviates, which
# is exactly what consumer-owned configuration means.
[docs_policy.graph.fields.status]
labels = ["Status"]
cardinality = "many"

[docs_policy.graph.fields.owner]
labels = ["Owner"]
cardinality = "many"

[docs_policy.graph.currentness]
field = "status"
current = [
  "active",
  "ready",
  "strict-ready",
  "draft",
  "planned",
  "queued",
  "open",
  "accepted",
  "promoted",
  "live",
]
historical = ["complete", "archived", "closed", "superseded", "deprecated"]

# ---- Kinds -------------------------------------------------------------------
# Kind globs must not overlap: one document matches at most one kind. Single `*`
# never crosses a path separator, which keeps each nested family disjoint from
# its parent directory.

[docs_policy.graph.kinds.contract]
include = ["docs/contracts/*.md"]
authority = 100
default-currentness = "current"

[docs_policy.graph.kinds.architecture]
include = ["docs/architecture/*.md"]
authority = 90
default-currentness = "current"

[docs_policy.graph.kinds.spec]
include = ["docs/specs/*.md"]
authority = 85
default-currentness = "current"

[docs_policy.graph.kinds.archived-spec]
include = ["docs/specs/archive/*.md"]
authority = 10
default-currentness = "historical"

[docs_policy.graph.kinds.vision]
include = ["docs/vision/*.md", "docs/vision/decisions/*.md", "docs/vision/governance/*.md"]
authority = 80
default-currentness = "current"

[docs_policy.graph.kinds.archived-vision]
include = ["docs/vision/history/*.md"]
authority = 10
default-currentness = "historical"

[docs_policy.graph.kinds.roadmap]
include = ["docs/roadmaps/*.md", "docs/roadmaps/*/*.md"]
authority = 70

[docs_policy.graph.kinds.ready-card]
include = ["docs/roadmaps/*/batch-cards/*.md"]
authority = 60

# Live guides carry no `Status:` line; the directory split is the currentness
# signal, so the kind default supplies it and `archived-guide` overrides it.
[docs_policy.graph.kinds.guide]
include = ["docs/guides/*.md"]
authority = 50
default-currentness = "current"

[docs_policy.graph.kinds.archived-guide]
include = ["docs/guides/archive/*.md"]
authority = 10
default-currentness = "historical"

[docs_policy.graph.kinds.front-door]
include = ["README.md", "AGENTS.md", "CHANGELOG.md", "PAPERCUTS.md", "docs/README.md"]
authority = 40
default-currentness = "current"

[docs_policy.graph.kinds.log]
include = ["docs/logs/*.md", "docs/logs/*/*.md"]
authority = 30
default-currentness = "historical"

[docs_policy.graph.kinds.archived-log]
include = ["docs/logs/archive/*/*.md"]
authority = 5
default-currentness = "historical"

[docs_policy.graph.kinds.audit]
include = ["docs/audits/*.md", "docs/roadmaps/*/audits/*.md"]
authority = 25

[docs_policy.graph.kinds.research]
include = ["docs/research/*.md", "docs/research/*/*.md"]
authority = 20

[docs_policy.graph.kinds.triage]
include = ["docs/triage/*.md"]
authority = 20

[docs_policy.graph.kinds.handoff]
include = ["docs/handoffs/*.md"]
authority = 15

# ---- Relations ---------------------------------------------------------------
# Labels match `Label: [link](target)` metadata lines; headings match links found
# under the named heading.

[docs_policy.graph.relations.contract]
labels = ["Contract", "Contracts"]

[docs_policy.graph.relations.architecture]
labels = ["Architecture"]

[docs_policy.graph.relations.spec]
labels = ["Spec", "Lane", "Strict lane"]

[docs_policy.graph.relations.roadmap]
labels = ["Roadmap", "Roadmaps"]

[docs_policy.graph.relations.card]
labels = ["Card", "Batch card", "Ready card", "Current ready card", "Completed card"]

[docs_policy.graph.relations.evidence]
labels = ["Evidence", "Prior evidence", "Predecessor evidence", "Closeout log", "Predecessor"]

[docs_policy.graph.relations.depends-on]
labels = ["Depends on"]

[docs_policy.graph.relations.next-task]
headings = ["Next Task"]

# ---- Cross-repository source sharing -----------------------------------------
# Effigy's own half of two-sided membership for `effigy docs context --sources`
# (roadmap `g09.006`, spec `122`). A portfolio file names directories to look
# in; this table is how this repository says it wants to be found there. Nothing
# is crawled and no other repository is read without its own `share = true`.

[docs_policy.sources]
share = true
front_doors = ["docs/README.md", "AGENTS.md", "README.md"]
skill_roots = [".agents/skills"]
