[[retired]]
id = "effigy-project-port-ranges"
retired = "2026-10-26; Q-011 simplification (effigy#346)"
replacement = "Host ports come from the OS or Compose: a generated service publishes `127.0.0.1::<container-port>` and `up` reads the assigned port back into its route, a manifest pin is used as written and a collision names the holder, and `[containers.<NAME>.host].stable_ports = true` derives one stable port per published container port from the checkout path. There is no 100-port project range, no registry of pins and owning checkouts, and no `effigy container ports status|reclaim` command."
