[[retired]]
id = "container-restart-recovery"
retired = "2026-10-26; Q-011 simplification (effigy#352)"
replacement = "The runtime restarts a stopped service, not Effigy: once `up` has started the stack it asks the runtime for `restart: unless-stopped` on every container whose stack declares no policy of its own, and a declared policy wins. There is no hand-start of an exited container by name, no `{full_id}.timer` unload surgery, no `systemctl stop`/`reset-failed` on nerdctl health-check units and no `/run` inode-pressure parsing."
