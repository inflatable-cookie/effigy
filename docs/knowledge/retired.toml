id = "runtime-scope-journal"
retired = "2026-10-25; Q-011 simplification (effigy#345)"
replacement = "Ownership is the backend's own labels: a checkout owns a container, volume or network exactly when it carries `com.docker.compose.project=<project>` plus `com.effigy.checkout` (or `com.effigy.repo-root`) and `com.effigy.scope`, or a named volume is one of its projects' by the `<project>-<volume>` name Compose gave it. `effigy container retire` asks the backend what carries them, deletes all of it, reports what it kept on purpose and what it could not delete, and releases the checkout's gateway routes and loopback addresses by checkout path. `retire --dead` groups those labels by checkout path and retires the groups whose path is missing. Nothing is recorded beside the labels, so there is no journal to keep unverified, no generation to compare and no fence to lease."
