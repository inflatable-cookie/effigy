replacement = "Q-009 rebuilt `effigy bootstrap` around ordinary task selectors and pinned sources. `[bootstrap].setup` is an ordered list of selectors, `start` is one selector, and `submodules = true` initialises submodules recursively at their recorded commits. For the whole v0.15 line the retired spellings are translated instead of refused, so a v0.14.1 project keeps loading (effigy#273): `run` is read as `setup` (`{ task = ... }` entries become selectors and inline `run`/`rhai`/command steps run as internal tasks selected in order), `{ task = ... }` entries in `setup` are read as selectors, a `submodules` policy string is read as a boolean, a multi-selector `start` chain runs as one internal task, and `[bootstrap].children`/the `bootstrap:db-seed` callback keep loading, with one deprecation notice per manifest on stderr and in `effigy doctor`. Only `effigy bootstrap` refuses the retired-only surfaces, with today's message: `[bootstrap].children` and `bootstrap children status|sync` became pinned `[sources.<name>]` (`git`, `rev` or `rev_file`, `path`) checked by `effigy doctor`; `bootstrap deps sync` became a repo-owned selector in `setup`; `--db-seed`, the dump prompts and the `bootstrap:db-seed` bootstrap callback became a first-seed task in `setup`; `--fresh` and `bootstrap teardown` became environment lifecycle (`effigy container <name> down`); `--backend` became the declared environment plus the machine backend preference; `--start` is the default. The translation is removed after v0.15, when every retired spelling refuses again with this entry and the changelog."
owner = "docs/knowledge/contracts/020-remote-bundle-sources-git-and-oci-delivery-contract.md"
