[[retired]]
id = "parent-capability-inheritance"
retired = "2026-10-25; v0.15 simplification (Q-011)"
replacement = "A nested `effigy` is an ordinary invocation: it classifies its own tree, and a durable nested run journals in its own checkout. No process inherits or checks a \"parent capability\", so closing a descriptor, killing or sleeping the parent, a dead admission hook or a leaked variable never makes a nested run refuse. Admission nesting is the advisory `EFFIGY_ADMITTED=<admitting run id>` marker, checked without a liveness test. Foreground descendant custody (process groups, the memory guard and its anonymous cleanup pin at descriptor 10) and #338's session-access handoff at descriptor 11 are unchanged."
