name: Distribution Preflight

on:
  pull_request:
    paths:
      - "scripts/check-distribution-preflight.sh"
      - "scripts/check-distribution-metadata.sh"
      - "scripts/check-distribution-artifact-pipeline-smoke.sh"
      - "scripts/validate-distribution-artifacts.sh"
      - "scripts/generate-distribution-closeout-report.sh"
      - "docs/guides/014-release-checklist-template.md"
      - "docs/guides/024-ci-and-automation-recipes.md"
      - "docs/guides/044-distribution-first-publish-execution-runbook.md"
      - "docs/reports/**"
      - ".github/workflows/distribution-artifact-pipeline-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/check-distribution-preflight.sh"
      - "scripts/check-distribution-metadata.sh"
      - "scripts/check-distribution-artifact-pipeline-smoke.sh"
      - "scripts/validate-distribution-artifacts.sh"
      - "scripts/generate-distribution-closeout-report.sh"
      - "docs/guides/014-release-checklist-template.md"
      - "docs/guides/024-ci-and-automation-recipes.md"
      - "docs/guides/044-distribution-first-publish-execution-runbook.md"
      - "docs/reports/**"
      - ".github/workflows/distribution-artifact-pipeline-smoke.yml"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run distribution preflight
        run: ./scripts/check-distribution-preflight.sh --tag v0.1.0
