name: Release Gates

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to validate for install checks (for manual runs)"
        required: false
        type: string
      repo_url:
        description: "Git repository URL to install from"
        required: false
        type: string

jobs:
  release-gates:
    name: Validate release gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run release gate checks
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_REPO_URL: ${{ github.event.inputs.repo_url || format('https://github.com/{0}.git', github.repository) }}
        run: ./scripts/check-release-gates.sh --tag "$RELEASE_TAG" --repo-url "$RELEASE_REPO_URL"
