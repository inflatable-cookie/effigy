[workspace]
default-members = [".", "crates/effigy-kernel"]
exclude = ["crates/effigy-parent-fixtures-*"]
members = [
    "crates/effigy-test-support",
    "crates/effigy-kernel",
    "crates/effigy-bootstrap",
    "crates/effigy-builtin",
    "crates/effigy-changelog",
    "crates/effigy-catalog",
    "crates/effigy-exec",
    "crates/effigy-gateway",
    "crates/effigy-process",
    "crates/effigy-ui",
    "crates/effigy-cli",
    "crates/effigy-contracts",
    "crates/effigy-context",
    "crates/effigy-data",
    "crates/effigy-core",
    "crates/effigy-execution",
    "crates/effigy-managed",
    "crates/effigy-manifest",
    "crates/effigy-tasks",
    "crates/effigy-tui",
    "crates/effigy-containers",
    "crates/effigy-deps",
    "crates/effigy-release",
    "crates/effigy-rhai",
    "crates/effigy-routing",
    "crates/effigy-scan",
    "crates/effigy-secrets",
    "crates/effigy-state",
    "crates/effigy-runtime",
    "crates/effigy-runtime-plan",
    "crates/effigy-docs-policy",
    "crates/effigy-env",
    "crates/effigy-doctor",
    "crates/effigy-json-schema",
]

[workspace.package]
version = "0.14.1"
edition = "2021"
license = "MIT"

[workspace.lints]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(effigy_shared_process)"] }

# Custody fingerprints the real CLI in development proofs. Keep the cryptographic
# compressor optimized, as in release builds, even for large debug executables.
[profile.dev.package."sha2:0.11.0"]
opt-level = 3

[profile.test.package."sha2:0.11.0"]
opt-level = 3

# Every secrets test runs at least one argon2id KDF (19 MiB, t=2). Optimising
# the KDF keeps the suite honest without spending seconds per test.
[profile.test.package."argon2:0.6.0"]
opt-level = 3

# Read-boundary proofs exercise the shipping CLI configuration without symbols,
# keeping macOS pre-main loading inside the unchanged fixture deadlines.
[profile.discovery-proof]
inherits = "release"
strip = "symbols"

# Lifecycle fixtures also exercise debug-only process evidence seams. Retain
# optimization for cold CLI deadlines while enabling those refusing oracles.
[profile.fixture-proof]
inherits = "discovery-proof"
debug-assertions = true

[package]
name = "effigy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Unified task runner with nested catalog resolution"
# Effigy ships as a prebuilt binary (brew / GitHub releases / `cargo install
# --git`), not as a crates.io publish. Matches the `publish = false` set on
# every workspace member crate.
publish = false

[lints]
workspace = true

[features]
# Engine fault points for run-control proofs; never in a product build.
fault-injection = ["effigy-kernel/fault-injection"]
# The disposable activation the workspace-serving process-lifetime proof runs
# in a detached process. Enables the kernel's fixture-only active-publication
# transaction; absent from every product build.
workspace-serving-fixture = ["effigy-kernel/test-support"]

[dependencies]
base64 = "0.22"
effigy-bootstrap = { path = "crates/effigy-bootstrap" }
effigy-builtin = { path = "crates/effigy-builtin" }
effigy-catalog = { path = "crates/effigy-catalog" }
effigy-changelog = { path = "crates/effigy-changelog" }
effigy-cli = { path = "crates/effigy-cli" }
effigy-contracts = { path = "crates/effigy-contracts" }
effigy-context = { path = "crates/effigy-context" }
effigy-containers = { path = "crates/effigy-containers" }
effigy-core = { path = "crates/effigy-core" }
effigy-data = { path = "crates/effigy-data" }
effigy-deps = { path = "crates/effigy-deps" }
effigy-doctor = { path = "crates/effigy-doctor" }
effigy-docs-policy = { path = "crates/effigy-docs-policy" }
effigy-env = { path = "crates/effigy-env" }
effigy-exec = { path = "crates/effigy-exec" }
effigy-execution = { path = "crates/effigy-execution" }
effigy-gateway = { path = "crates/effigy-gateway" }
effigy-managed = { path = "crates/effigy-managed" }
effigy-manifest = { path = "crates/effigy-manifest" }
effigy-kernel = { path = "crates/effigy-kernel" }
effigy-process = { path = "crates/effigy-process" }
effigy-release = { path = "crates/effigy-release" }
effigy-rhai = { path = "crates/effigy-rhai" }
effigy-runtime = { path = "crates/effigy-runtime" }
effigy-runtime-plan = { path = "crates/effigy-runtime-plan" }
effigy-routing = { path = "crates/effigy-routing" }
effigy-scan = { path = "crates/effigy-scan" }
effigy-secrets = { path = "crates/effigy-secrets" }
effigy-state = { path = "crates/effigy-state" }
effigy-tasks = { path = "crates/effigy-tasks" }
effigy-tui = { path = "crates/effigy-tui" }
effigy-ui = { path = "crates/effigy-ui" }
anstyle = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
sha2 = "0.11"
toml = "1"
toml_edit = "0.25.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ratatui = "0.30"
crossterm = "0.29"
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }
vt100 = "0.16.2"
globset = "0.4"
walkdir = "2"
semver = "1"
regex = "1"
libc = "0.2"
signal-hook = "0.4"
tokio = { version = "1", features = ["rt-multi-thread"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
minijinja = "2"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
x509-parser = "0.16"
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
tempfile = "3"

[dev-dependencies]

effigy-json-schema = { path = "crates/effigy-json-schema" }
effigy-test-support = { path = "crates/effigy-test-support" }
# A settled-run proof asks the kernel whether a workload group still exists.
libc = "0.2"
base64 = "0.22"
# Ordinary HTTP/1 server fixture for the managed listener readiness probe.
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["net"] }
effigy-containers = { path = "crates/effigy-containers", features = ["test-support"] }
# The managed gateway auto-start PTY proof uses a real private pseudo-terminal.
nix = { version = "0.31", default-features = false, features = ["term"] }
# A run-control proof writes the fixture journal in a loop to show a read
# beside a continuous writer answers at once (effigy#339).
rusqlite = { version = "0.40", features = ["bundled"] }
