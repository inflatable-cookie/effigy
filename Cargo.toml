[package]
name = "effigy"
version = "0.2.13"
edition = "2021"
license = "MIT"
description = "Unified task runner with nested catalog resolution"

[dependencies]
anstream = "0.6"
anstyle = "1"
indicatif = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = "0.20"
toml = "0.8"
toml_edit = "0.25.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ratatui = "0.29"
crossterm = "0.29"
nix = { version = "0.29", default-features = false, features = ["process", "signal"] }
vt100 = "0.15.2"
indexmap = { version = "2", features = ["serde"] }
globset = "0.4"
walkdir = "2"
ignore = "0.4"
semver = "1"
zeroize = "1"
regex = "1"
rhai = { version = "1", features = ["serde"] }
